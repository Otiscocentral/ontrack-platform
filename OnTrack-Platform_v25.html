}

function ThinkversationPanel({studentName,studentId,studentEmail,coachEmail,onSaved,showToast}){
  const [phase,setPhase]=useState(0); // 0=overview, 1-5=phases
  const [phaseNotes,setPhaseNotes]=useState({land:"",notice:"",connect:"",discover:"",commit:""});
  const [machine,setMachine]=useState({energy:5,focus:5,stress:5});
  const [sdt,setSdt]=useState({autonomy:5,competence:5,relatedness:5});
  const [changeRuler,setChangeRuler]=useState({importance:7,confidence:6});
  const [intentions,setIntentions]=useState([{id:1,situation:"",action:"",when:"",where:"",backup:"",confidence:7}]);
  const [sessionInfo,setSessionInfo]=useState({student:studentName||"",sid:studentId||"",date:todayYMD(),num:"",dur:"50",mode:"In-Person"});
  const [generating,setGenerating]=useState(false);
  const [generatedNote,setGeneratedNote]=useState(null);
  const [saving,setSaving]=useState(false);
  const [saved,setSaved]=useState(false);
  const [savedId,setSavedId]=useState(null);
  const [attested,setAttested]=useState(false);
  const [attesting,setAttesting]=useState(false);
  const [followUpData,setFollowUpData]=useState(null);
  const [generatingFollowUp,setGeneratingFollowUp]=useState(false);
  const tvAbortRef=useRef(null); // abort in-flight generation on unmount
  useEffect(()=>()=>{tvAbortRef.current?.abort();},[]);

  const upd=(k,v)=>setSessionInfo(p=>({...p,[k]:v}));
  const updPN=(k,v)=>setPhaseNotes(p=>({...p,[k]:v}));
  const addIntention=()=>setIntentions(p=>[...p,{id:Date.now(),situation:"",action:"",when:"",where:"",backup:"",confidence:7}]);
  const updInt=(id,k,v)=>setIntentions(p=>p.map(i=>i.id===id?{...i,[k]:v}:i));
  const rmInt=(id)=>setIntentions(p=>p.filter(i=>i.id!==id));

  const phaseComplete=(pid)=>{
    const key={1:"land",2:"notice",3:"connect",4:"discover",5:"commit"}[pid];
    return key&&phaseNotes[key]?.trim().length>10;
  };

  const generateNote=async()=>{
    if(!AI_CONFIGURED){showToast("⚠️ Claude proxy not configured — see Step 3");return;}
    if(!sessionInfo.student.trim()){showToast("⚠️ Enter the student name before generating a Thinkversation™ note.");return;}
    setGenerating(true);
    const intentionText=intentions.filter(i=>i.situation||i.action).map((i,n)=>
      `${n+1}. IF ${i.situation||"[situation]"} → THEN ${i.action||"[action]"} WHEN ${i.when} WHERE ${i.where}${i.backup?`. Backup: ${i.backup}`:""} (Confidence: ${i.confidence}/10)`
    ).join("\n");

    const sys=`You are documenting a Thinkversation™ coaching session — a brain-compatible, neurodiversity-affirming coaching model developed by Claude Bisson, M.Ed., ICF-ACC, JST (Focused Solutions LLC).

The Thinkversation™ model has 5 phases: LAND (grounding/calibration), NOTICE (metacognitive observation), CONNECT (meaning-making/values), DISCOVER (solution exploration/MI), COMMIT (implementation intentions).

Generate a complete, professional coaching session note in this JSON structure. Return ONLY valid JSON, no preamble:
{
  "sessionSummary": "2-3 sentence overview of the full session arc",
  "landPhase": "Coach observations from LAND phase — student's arrival state, energy, readiness",
  "noticePhase": "Insights from NOTICE — wins, patterns, action step follow-up, self-observations",
  "connectPhase": "CONNECT synthesis — values activated, strengths identified, meaning made, SDT observations",
  "discoverPhase": "DISCOVER summary — solutions explored, MI change ruler reflections, cognitive ergonomics identified",
  "commitPhase": "COMMIT documentation — implementation intentions, anticipatory coping, confidence ratings",
  "efFocusAreas": "EF domains addressed in this session",
  "studentInsights": "Key moments of self-awareness or breakthrough",
  "coachObservations": "Clinical observations — tone, affect, patterns, concerns (confidential)",
  "actionSteps": "Specific commitments made, formatted as IF-THEN where applicable",
  "nextSessionFocus": "Priority areas for next Thinkversation",
  "coachingCompetencies": "ICF competencies demonstrated",
  "sdtObservations": "Autonomy/Competence/Relatedness observations from this session"
}`;

    const msg=`Student: ${sessionInfo.student}${sessionInfo.sid?" (ID:"+sessionInfo.sid+")":""}
Session #${sessionInfo.num||"?"} | ${sessionInfo.date} | ${sessionInfo.dur}min | ${sessionInfo.mode}

MACHINE RATINGS: Energy ${machine.energy}/10 · Focus ${machine.focus}/10 · Stress ${machine.stress}/10
SDT RATINGS: Autonomy ${sdt.autonomy}/10 · Competence ${sdt.competence}/10 · Relatedness ${sdt.relatedness}/10
CHANGE RULER: Importance ${changeRuler.importance}/10 · Confidence ${changeRuler.confidence}/10

LAND PHASE NOTES:
${phaseNotes.land||"(not documented)"}

NOTICE PHASE NOTES:
${phaseNotes.notice||"(not documented)"}

CONNECT PHASE NOTES:
${phaseNotes.connect||"(not documented)"}

DISCOVER PHASE NOTES:
${phaseNotes.discover||"(not documented)"}

COMMIT PHASE NOTES:
${phaseNotes.commit||"(not documented)"}

IMPLEMENTATION INTENTIONS:
${intentionText||"(not documented)"}`;

    try{
      const ctrl=new AbortController();tvAbortRef.current=ctrl;
      const res=await callClaude({model:MODEL,max_tokens:4096,system:sys,messages:[{role:"user",content:msg}]},ctrl.signal);
      if(!res.ok)throw new Error(`API ${res.status}`);
      const d=await res.json();const raw=d.content?.[0]?.text||"{}";
      let parsed;try{parsed=JSON.parse(raw.replace(/```json|```/g,"").trim());}catch{try{const m=raw.match(/\{[\s\S]*\}/);parsed=m?JSON.parse(m[0]):{};}catch{parsed={};}}
      setGeneratedNote({...sessionInfo,...parsed,machine,sdt,changeRuler,intentions,phaseNotes});
      setPhase(6);
      showToast("✅ Thinkversation™ note generated!");
    }catch(e){
      if(e.name!=="AbortError")showToast(`Generation failed — ${e.message||"check connection"}`);
    }finally{setGenerating(false);}
  };

  const saveNote=async()=>{
    if(!db){showToast("Firebase not connected");return;}
    if(saving)return;
    if(!generatedNote||!generatedNote.student){showToast("⚠️ Generate a note first before saving.");return;}
    setSaving(true);
    try{
      const n=generatedNote||{};
      const _ref=await db.collection("sessionNotes").add({
        studentSUID:sessionInfo.sid||"",studentName:sessionInfo.student.trim(),
        coachEmail,sessionDate:sessionInfo.date,sessionNum:parseInt(sessionInfo.num,10)||0,
        sessionDur:parseInt(sessionInfo.dur,10)||50,
        noteType:"thinkversation",
        sessionData:{
          ...sessionInfo,...n,
          rawNotes:Object.values(phaseNotes).join("\n\n"),
          thinkversationPhases:phaseNotes,
          machine,sdt,changeRuler,intentions
        },
        createdAt:firebase.firestore.FieldValue.serverTimestamp()
      });
      setSavedId(_ref.id);setSaved(true);
      showToast("✅ Thinkversation™ note saved!");
      if(onSaved)onSaved();
    }catch(e){showToast("Save failed: "+e.message);}
    finally{setSaving(false);}
  };

  const attestNote=async()=>{
    if(!savedId){showToast("Save first, then attest.");return;}
    if(attesting)return;
    if(!window.confirm(`Attest this Thinkversation™ note as ${COACH_NAME}, ${COACH_TITLE}?`))return;
    setAttesting(true);
    try{
      await db.collection("sessionNotes").doc(savedId).update({
        attestedAt:firebase.firestore.FieldValue.serverTimestamp(),
        attestedBy:COACH_NAME,attestedByTitle:COACH_TITLE,attestedByEmail:COACH_EMAIL
      });
      setAttested(true);showToast("🔏 Note attested and locked!");
    }catch(e){showToast("Attestation failed: "+e.message);}
    finally{setAttesting(false);}};

  const NOTE_KEYS=[
    {k:"sessionSummary",  l:"📖 Session Summary"},
    {k:"landPhase",       l:"🌊 LAND — Arrival & Calibration"},
    {k:"noticePhase",     l:"🔍 NOTICE — Observations"},
    {k:"connectPhase",    l:"🔗 CONNECT — Meaning & Values"},
    {k:"discoverPhase",   l:"💡 DISCOVER — Possibilities"},
    {k:"commitPhase",     l:"🎯 COMMIT — Implementation"},
    {k:"efFocusAreas",    l:"🧠 EF Focus Areas"},
    {k:"studentInsights", l:"💡 Student Insights"},
    {k:"coachObservations",l:"🔒 Coach Observations (Confidential)"},
    {k:"actionSteps",     l:"✅ Action Steps / Implementation Intentions"},
    {k:"nextSessionFocus",l:"🔭 Next Thinkversation Focus"},
    {k:"sdtObservations", l:"🧬 SDT Observations"},
    {k:"coachingCompetencies",l:"🎓 ICF Competencies"},
  ];

  const pi={background:"var(--s2)",border:"1px solid var(--bdr)",color:"var(--txt)",borderRadius:7,padding:"8px 11px",fontSize:12,width:"100%"};

  // Phase 6 = Generated Note Review
  if(phase===6&&generatedNote)return(
    <div className="fade">
      <div className="card" style={{borderColor:O+"55",background:"linear-gradient(135deg,#001a3a,var(--s1))",marginBottom:14}}>
        <div style={{fontSize:9,color:O,fontWeight:700,letterSpacing:1,textTransform:"uppercase",marginBottom:4}}>
          Thinkversation™ Session Note — Focused Solutions LLC
        </div>
        <div style={{fontFamily:"'DM Serif Display',serif",fontSize:20,marginBottom:2}}>
          {generatedNote.student||"Student"} — Session {generatedNote.num||"#?"}
        </div>
        <div style={{fontSize:11,color:"var(--muted)"}}>{fmtDate(generatedNote.date)} · {generatedNote.dur} min · {generatedNote.mode}</div>
        <div style={{display:"flex",gap:10,marginTop:8,flexWrap:"wrap"}}>
          {[["Energy",generatedNote.machine?.energy,"#3b82f6"],["Focus",generatedNote.machine?.focus,"#8b5cf6"],["Stress",generatedNote.machine?.stress,"#ef4444"]].map(([l,v,col])=>
            <div key={l} style={{background:col+"18",border:`1px solid ${col}33`,borderRadius:6,padding:"2px 10px",fontSize:10,color:col}}>
              {l}: {v}/10
            </div>
          )}
          {[["Autonomy",generatedNote.sdt?.autonomy],["Competence",generatedNote.sdt?.competence],["Relatedness",generatedNote.sdt?.relatedness]].map(([l,v])=>
            <div key={l} style={{background:"var(--green)12",border:"1px solid var(--green)33",borderRadius:6,padding:"2px 10px",fontSize:10,color:"var(--green)"}}>
              SDT-{l}: {v}/10
            </div>
          )}
        </div>
      </div>
      {NOTE_KEYS.map(({k,l})=>generatedNote[k]?(
        <div key={k} className="card" style={{padding:"12px 16px",borderLeft:`3px solid ${O}55`,marginBottom:8}}>
          <div style={{fontSize:10,color:O,fontWeight:700,letterSpacing:.8,textTransform:"uppercase",marginBottom:5}}>{l}</div>
          <textarea className="inp" spellCheck={true} data-gramm={true} style={{background:"transparent",border:"none",width:"100%",resize:"vertical",fontSize:12,lineHeight:1.75,minHeight:56}}
            value={generatedNote[k]||""} onChange={e=>setGeneratedNote(p=>({...p,[k]:e.target.value}))}/>
        </div>
      ):null)}
      {attested&&<div style={{background:"var(--green)12",border:"1px solid var(--green)44",borderRadius:8,padding:"10px 14px",marginTop:8,display:"flex",alignItems:"center",gap:10}}>
        <span>🔏</span>
        <div><div style={{fontSize:12,fontWeight:700,color:"var(--green)"}}>Attested & Locked</div>
        <div style={{fontSize:10,color:"var(--muted)"}}>Certified by {COACH_NAME}, {COACH_TITLE}</div></div>
      </div>}
      <div style={{display:"flex",gap:8,flexWrap:"wrap",marginTop:10}}>
        <button className="btn btn-green" onClick={saveNote} disabled={saving||saved} style={{opacity:saved?0.7:1}}>
          {saving?"Saving...":saved?"✅ Saved":"💾 Save to Firebase"}
        </button>
        <button style={{background:"var(--green)18",border:"1px solid var(--green)44",color:"var(--green)",borderRadius:8,padding:"9px 14px",fontSize:12,fontWeight:600,cursor:!saved||attested?"not-allowed":"pointer",opacity:!saved||attested?0.5:1}}
          onClick={attestNote} disabled={!saved||attested}>
          {attested?"🔏 Attested":"🔏 Attest & Lock"}
        </button>
        <button className="btn btn-ghost btn-sm" onClick={async()=>{
          setGeneratingFollowUp(true);
          const result=await generateFollowUpEmail(generatedNote,generatedNote.student,fmtDate(generatedNote.date),showToast);
          setGeneratingFollowUp(false);
          if(result){
            let tvUid="";
            if(db&&studentEmail){try{const s=await db.collection("roster").where("email","==",studentEmail.toLowerCase()).limit(1).get();if(!s.empty)tvUid=s.docs[0].data().uid||"";}catch{}}
            setFollowUpData({subject:`Your Thinkversation™ Session Summary — ${generatedNote.student} — ${fmtDate(generatedNote.date)}`,body:result.text,activities:result.activities||[],studentEmail:studentEmail||"",studentUid:tvUid,sessionDate:generatedNote.date||""});
          }
        }} disabled={generatingFollowUp}>
          {generatingFollowUp?"⟳ Generating...":"📧 Student Follow-Up"}
        </button>
        <button className="btn btn-ghost btn-sm" style={{marginLeft:"auto"}} onClick={()=>{setPhase(0);setGeneratedNote(null);setSaved(false);setSavedId(null);setAttested(false);setFollowUpData(null);setPhaseNotes({land:"",notice:"",connect:"",discover:"",commit:""});setMachine({energy:5,focus:5,stress:5});setSdt({autonomy:5,competence:5,relatedness:5});setChangeRuler({importance:7,confidence:6});setIntentions([{id:1,situation:"",action:"",when:"",where:"",backup:"",confidence:7}]);}}>🔄 New Session</button>
      </div>
      {followUpData&&<FollowUpEmailModal studentName={generatedNote.student} studentEmail={followUpData.studentEmail} studentUid={followUpData.studentUid||""} sessionDate={followUpData.sessionDate||""} subject={followUpData.subject} body={followUpData.body} activities={followUpData.activities||[]} onClose={()=>setFollowUpData(null)} showToast={showToast}/>}
    </div>
  );

  const currentPhaseData=THINKVERSATION_PHASES[phase-1];

  return(
    <div>
      <div className="card" style={{borderColor:O+"44",background:"linear-gradient(135deg,#001a3a,var(--s1))",marginBottom:14}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",flexWrap:"wrap",gap:10}}>
          <div>
            <div style={{fontSize:9,color:O,fontWeight:700,letterSpacing:1.2,textTransform:"uppercase",marginBottom:4}}>
              Thinkversation™ · Focused Solutions LLC
            </div>
            <div style={{fontFamily:"'DM Serif Display',serif",fontSize:16,marginBottom:2}}>
              Brain-Compatible Coaching Session
            </div>
            <div style={{fontSize:10,color:"var(--muted)"}}>A 5-phase neurodiversity-affirming conversation model · 50 minutes</div>
          </div>
          <div style={{fontSize:10,color:"var(--muted)",textAlign:"right"}}>
            <div style={{fontWeight:700,color:"var(--txt)"}}>{COACH_NAME}, {COACH_TITLE}</div>
            <div>Focused Solutions LLC · {COACH_PHONE}</div>
          </div>
        </div>
        <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(130px,1fr))",gap:8,marginTop:12}}>
          {[["Student",sessionInfo.student,"text",s=>upd("student",s)],["ID",sessionInfo.sid,"text",s=>upd("sid",s)],
            ["Session #",sessionInfo.num,"number",s=>upd("num",s)],["Date",sessionInfo.date,"date",s=>upd("date",s)],
            ["Duration (min)",sessionInfo.dur,"number",s=>upd("dur",s)]].map(([l,v,t,fn])=>(
            <div key={l}>
              <div style={{fontSize:9,color:"var(--muted)",fontWeight:700,marginBottom:3}}>{l}</div>
              <input style={{...pi,fontSize:11,padding:"6px 9px"}} type={t} value={v} onChange={e=>fn(e.target.value)}/>
            </div>
          ))}
          <div>
            <div style={{fontSize:9,color:"var(--muted)",fontWeight:700,marginBottom:3}}>Modality</div>
            <select style={{...pi,fontSize:11,padding:"6px 9px"}} value={sessionInfo.mode} onChange={e=>upd("mode",e.target.value)}>
              <option>In-Person</option><option>Zoom / Video</option><option>Phone</option>
            </select>
          </div>
        </div>
      </div>
      <div style={{display:"grid",gridTemplateColumns:"repeat(5,1fr)",gap:6,marginBottom:16}}>
        {THINKVERSATION_PHASES.map(p=>(
          <button key={p.id} className={`phase-tab${phase===p.num?" active":phaseComplete(p.num)?" done":""}`}
            onClick={()=>setPhase(p.num)}>
            <div className="phase-badge" style={{
              background:phase===p.num?p.color:phaseComplete(p.num)?"var(--green)":"var(--bdr)",
              color:phase===p.num||phaseComplete(p.num)?"#fff":"var(--muted)"
            }}>{phaseComplete(p.num)?"✓":p.num}</div>
            <div style={{flex:1,minWidth:0}}>
              <div style={{fontSize:10,fontWeight:800,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{p.label}</div>
              <div style={{fontSize:8,color:"var(--muted)"}}>{p.time}</div>
            </div>
          </button>
        ))}
      </div>
      {phase===0&&(
        <div className="fade">
          <div className="card" style={{marginBottom:12}}>
            <div className="card-title">🌀 Thinkversation™ Framework Overview</div>
            <div style={{fontSize:11,color:"var(--muted)",marginBottom:14,lineHeight:1.7}}>
              A structured 50-minute coaching conversation that honors how the neurodivergent brain learns and grows.
              Click any phase above to begin documenting, or work through them in sequence.
            </div>
            {THINKVERSATION_PHASES.map(p=>(
              <div key={p.id} onClick={()=>setPhase(p.num)} style={{display:"flex",gap:12,padding:"10px 12px",borderRadius:8,cursor:"pointer",marginBottom:6,background:"var(--s2)",border:"1px solid var(--bdr)",transition:"all .15s"}}
                onMouseEnter={e=>{e.currentTarget.style.borderColor=p.color+"66"}}
                onMouseLeave={e=>{e.currentTarget.style.borderColor="var(--bdr)"}}>
                <div style={{width:32,height:32,borderRadius:8,background:p.color+"22",border:`1px solid ${p.color}44`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:16,flexShrink:0}}>{p.icon}</div>
                <div style={{flex:1}}>
                  <div style={{display:"flex",gap:8,alignItems:"center",marginBottom:2}}>
                    <div style={{fontSize:11,fontWeight:800,color:p.color}}>{p.num}. {p.label}</div>
                    <div style={{fontSize:9,color:"var(--muted)"}}>{p.time} · {p.title}</div>
                  </div>
                  <div style={{fontSize:10,color:"var(--muted)",lineHeight:1.5,marginBottom:4}}>{p.subtitle}</div>
                  <div style={{fontSize:8,color:"var(--dim)",lineHeight:1.5}}>📚 {p.evidence}</div>
                </div>
              </div>
            ))}
          </div>
          {Object.values(phaseNotes).some(v=>v.trim().length>10)&&(
            <div style={{display:"flex",gap:8,marginTop:8}}>
              <button className="btn btn-primary" onClick={generateNote} disabled={generating}>
                {generating?"⟳ Generating Thinkversation™ Note...":"✨ Generate Structured Note →"}
              </button>
            </div>
          )}
        </div>
      )}
      {phase>=1&&phase<=5&&currentPhaseData&&(
        <div className="fade">
          <div className="card" style={{borderColor:currentPhaseData.color+"55",background:`linear-gradient(135deg,${currentPhaseData.color}08,var(--s1))`,marginBottom:12}}>
            <div style={{display:"flex",gap:12,alignItems:"flex-start",marginBottom:12}}>
              <div style={{width:44,height:44,borderRadius:10,background:currentPhaseData.color+"22",border:`2px solid ${currentPhaseData.color}44`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:22,flexShrink:0}}>{currentPhaseData.icon}</div>
              <div>
                <div style={{fontSize:8,color:currentPhaseData.color,fontWeight:800,letterSpacing:1.2,textTransform:"uppercase",marginBottom:2}}>{currentPhaseData.num}. {currentPhaseData.label} · {currentPhaseData.time}</div>
                <div style={{fontFamily:"'DM Serif Display',serif",fontSize:17,marginBottom:2}}>{currentPhaseData.title}</div>
                <div style={{fontSize:11,color:"var(--muted)",fontStyle:"italic"}}>{currentPhaseData.subtitle}</div>
              </div>
            </div>
            <div style={{marginBottom:10}}>
              <div style={{fontSize:9,color:"var(--muted)",fontWeight:700,marginBottom:4}}>📚 EVIDENCE BASE</div>
              <div style={{fontSize:9,color:"var(--dim)",lineHeight:1.6}}>{currentPhaseData.evidence}</div>
            </div>
            <div style={{marginBottom:10}}>
              <div style={{fontSize:9,color:currentPhaseData.color,fontWeight:700,textTransform:"uppercase",letterSpacing:.8,marginBottom:6}}>Coaching Prompts</div>
              {currentPhaseData.prompts.map((p,i)=>(
                <div key={i} style={{fontSize:11,color:"var(--txt)",padding:"5px 10px",borderLeft:`2px solid ${currentPhaseData.color}55`,marginBottom:4,lineHeight:1.5}}>
                  {p}
                </div>
              ))}
            </div>
          </div>
          {phase===1&&(
            <div className="card" style={{marginBottom:12}}>
              <div style={{fontSize:11,fontWeight:700,color:"#3b82f6",marginBottom:10}}>Machine Ratings</div>
              <SliderRating label="Energy" value={machine.energy} onChange={v=>setMachine(p=>({...p,energy:v}))} color="#3b82f6"/>
              <SliderRating label="Focus" value={machine.focus} onChange={v=>setMachine(p=>({...p,focus:v}))} color="#8b5cf6"/>
              <SliderRating label="Stress" value={machine.stress} onChange={v=>setMachine(p=>({...p,stress:v}))} color="#ef4444"/>
            </div>
          )}
          {phase===3&&(
            <div className="card" style={{marginBottom:12}}>
              <div style={{fontSize:11,fontWeight:700,color:"var(--green)",marginBottom:10}}>SDT Pulse Check</div>
              {SDT_ITEMS.map(item=>(
                <SliderRating key={item.id} label={item.l} value={sdt[item.id]} onChange={v=>setSdt(p=>({...p,[item.id]:v}))} color={item.color}/>
              ))}
              <div style={{fontSize:10,color:"var(--muted)",marginTop:6,lineHeight:1.5}}>
                SDT predicts coaching outcomes: Autonomy · Competence · Relatedness <span style={{color:"var(--green)"}}>— Ryan & Deci, 2017</span>
              </div>
            </div>
          )}
          {phase===4&&(
            <div className="card" style={{marginBottom:12}}>
              <div style={{fontSize:11,fontWeight:700,color:"#10b981",marginBottom:10}}>Change Ruler — Motivational Interviewing</div>
              <SliderRating label="Importance" value={changeRuler.importance} onChange={v=>setChangeRuler(p=>({...p,importance:v}))} color="#10b981"/>
              <SliderRating label="Confidence" value={changeRuler.confidence} onChange={v=>setChangeRuler(p=>({...p,confidence:v}))} color="#f59e0b"/>
              <div style={{fontSize:10,color:"var(--muted)",marginTop:6}}>Miller & Rollnick (2013) — evokes intrinsic motivation</div>
            </div>
          )}
          {phase===5&&(
            <div className="card" style={{marginBottom:12}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
                <div style={{fontSize:11,fontWeight:700,color:O}}>Implementation Intentions</div>
                <button className="btn btn-ghost btn-xs" onClick={addIntention}>+ Add IF-THEN</button>
              </div>
              <div style={{fontSize:9,color:"var(--muted)",marginBottom:10}}>Gollwitzer (1999): IF-THEN planning increases follow-through by up to 300% in people with ADHD</div>
              {intentions.map((intent,i)=>(
                <div key={intent.id} className="if-then-row">
                  <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
                    <div style={{fontSize:10,fontWeight:800,color:O}}>Commitment {i+1}</div>
                    {intentions.length>1&&<button onClick={()=>rmInt(intent.id)} style={{background:"transparent",border:"none",color:"var(--muted)",cursor:"pointer",fontSize:11}}>✕</button>}
                  </div>
                  {[["situation","🔀 IF (trigger/situation)","When I am at..."],["action","➡️ THEN (specific action)","I will..."],
                    ["when","⏰ WHEN (exact time)","At 2pm on Tuesday..."],["where","📍 WHERE (exact location)","At my desk in..."],
                    ["backup","🛡️ BACKUP PLAN","If that doesn't work, I will..."]].map(([k,l,ph])=>(
                    <div key={k} style={{marginBottom:6}}>
                      <div style={{fontSize:9,color:"var(--muted)",fontWeight:700,marginBottom:2}}>{l}</div>
                      <input className="inp" spellCheck={true} data-gramm={true} style={{fontSize:11}} value={intent[k]} onChange={e=>updInt(intent.id,k,e.target.value)} placeholder={ph}/>
                    </div>
                  ))}
                  <div style={{marginTop:8}}>
                    <SliderRating label="Confidence" value={intent.confidence} onChange={v=>updInt(intent.id,"confidence",v)} color={O}/>
                  </div>
                </div>
              ))}
            </div>
          )}
          <div className="card" style={{marginBottom:12}}>
            <div style={{fontSize:10,color:currentPhaseData.color,fontWeight:700,textTransform:"uppercase",letterSpacing:.8,marginBottom:6}}>
              Your {currentPhaseData.label} Notes
            </div>
            <textarea className="inp ta" spellCheck={true} data-gramm={true}
              value={phaseNotes[currentPhaseData.id]||""}
              onChange={e=>updPN(currentPhaseData.id,e.target.value)}
              style={{minHeight:160,lineHeight:1.75}}
              placeholder={`Document what emerged in the ${currentPhaseData.label} phase... (Use the prompts above as a guide)`}/>
          </div>
          <div style={{display:"flex",gap:8,justifyContent:"space-between",alignItems:"center"}}>
            <button className="btn btn-ghost btn-sm" onClick={()=>setPhase(p=>Math.max(0,p-1))}>← {phase===1?"Overview":"Previous"}</button>
            {phase<5
              ?<button className="btn btn-primary btn-sm" onClick={()=>setPhase(p=>p+1)}>Next Phase →</button>
              :<button className="btn btn-primary" onClick={generateNote} disabled={generating}>
                  {generating?"⟳ Generating...":"✨ Generate Thinkversation™ Note →"}
                </button>
            }
          </div>
        </div>
      )}
    </div>
  );
}

/* ═══════════════════════════════════════════════════════════
   BETWEEN-SESSION SELF-MONITORING CHECK-IN
   Evidence: Self-monitoring as EF intervention (Mace et al.)
   Machine·Mind·Mission framework (Giwerc/ADDCA)
   SDT pulse · Metacognitive reflection · MI follow-up
═══════════════════════════════════════════════════════════ */
function BetweenSessionCheckIn({uid,readOnly=false}){
  const [checkIns,setCheckIns]=useState([]);
  const [editing,setEditing]=useState(false);
  const [showAllCI,setShowAllCI]=useState(false);
  const [form,setForm]=useState({date:todayYMD(),machine:{energy:5,focus:5,sleep:5},mind:{anxiety:5,selfTalk:5},mission:{motivation:5,goalProgress:5},stepsCompleted:[],stepsNotes:"",bringToSession:"",wins:"",stuck:""});
  const [saving,setSaving]=useState(false);
  const [loading,setLoading]=useState(true);

  useEffect(()=>{
    if(!uid||!db){setLoading(false);return;}
    db.collection("mos").doc(uid).get().then(snap=>{
      if(snap.exists){const d=snap.data();if(d.checkIns)setCheckIns(d.checkIns.slice(-24));}
      setLoading(false);
    }).catch(()=>setLoading(false));
  },[uid]);

  const upd=(path,v)=>setForm(p=>{
    const parts=path.split(".");
    if(parts.length===1)return{...p,[parts[0]]:v};
    if(parts.length===2)return{...p,[parts[0]]:{...p[parts[0]],[parts[1]]:v}};
    return p;
  });

  const save=async()=>{
    if(!db||!uid){return;}
    if(saving)return;
    setSaving(true);
    try{
      const entry={...form,createdAt:new Date().toISOString()};
      const updated=[...checkIns,entry].slice(-24);
      await db.collection("mos").doc(uid).set({checkIns:updated,lastCheckIn:firebase.firestore.FieldValue.serverTimestamp()},{merge:true});
      setCheckIns(updated);setEditing(false);
      setForm({date:todayYMD(),machine:{energy:5,focus:5,sleep:5},mind:{anxiety:5,selfTalk:5},mission:{motivation:5,goalProgress:5},stepsCompleted:[],stepsNotes:"",bringToSession:"",wins:"",stuck:""});
    }catch(e){console.error("Check-in save:",e);}
    finally{setSaving(false);}
  };

  if(loading)return<div style={{padding:20,color:"var(--muted)",textAlign:"center"}}>Loading check-ins...</div>;

  const CARD="#161b22",BORDER="#30363d";
  const latest=checkIns[checkIns.length-1];

  return(
    <div style={{fontFamily:"'DM Sans',sans-serif"}}>
      <div style={{background:"linear-gradient(135deg,#001a3a,#0d1117)",border:`2px solid ${O}33`,borderRadius:12,padding:"14px 16px",marginBottom:14}}>
        <div style={{fontSize:9,color:O,fontWeight:800,letterSpacing:1.2,textTransform:"uppercase",marginBottom:4}}>
          Between-Session Self-Monitoring
        </div>
        <div style={{fontFamily:"'DM Serif Display',serif",fontSize:16,marginBottom:2}}>Weekly Machine · Mind · Mission Check-In</div>
        <div style={{fontSize:10,color:"#8b949e",lineHeight:1.6}}>
          Research shows self-monitoring improves EF outcomes. This brief check-in builds metacognitive awareness — a core coaching goal.
        </div>
        {!readOnly&&<button className="btn btn-primary btn-sm" style={{marginTop:10}} onClick={()=>{const opening=!editing;setEditing(!editing);if(opening)setForm(p=>({...p,date:todayYMD()}));}}>
          {editing?"✕ Cancel":checkIns.length?"📝 New Check-In":"📝 Start Check-In"}
        </button>}
      </div>
      {editing&&!readOnly&&(
        <div style={{background:CARD,border:`2px solid ${O}55`,borderRadius:12,padding:16,marginBottom:14}} className="fade">
          <div style={{fontSize:12,fontWeight:700,color:O,marginBottom:14}}>📅 {fmtDate(form.date)}</div>
          <div className="mmm-card">
            <div style={{fontSize:11,fontWeight:800,color:"#3b82f6",marginBottom:8}}>🔧 MACHINE — Body & Brain</div>
            <div style={{fontSize:9,color:"#8b949e",marginBottom:10}}>Your brain's hardware today. Honest numbers — no judgment.</div>
            <div style={{display:"flex",justifyContent:"space-between",fontSize:8,color:"var(--dim)",marginBottom:2}}><span>① Low</span><span>High ⑩</span></div><SliderRating label="Energy" value={form.machine.energy} onChange={v=>upd("machine.energy",v)} color="#3b82f6"/>
            <SliderRating label="Focus" value={form.machine.focus} onChange={v=>upd("machine.focus",v)} color="#8b5cf6"/>
            <SliderRating label="Sleep Quality" value={form.machine.sleep} onChange={v=>upd("machine.sleep",v)} color="#10b981"/>
          </div>
          <div className="mmm-card">
            <div style={{fontSize:11,fontWeight:800,color:"#f59e0b",marginBottom:8}}>💭 MIND — Thoughts & Awareness</div>
            <div style={{fontSize:9,color:"#8b949e",marginBottom:10}}>The stories and patterns running in the background.</div>
            <SliderRating label="Anxiety Level" value={form.mind.anxiety} onChange={v=>upd("mind.anxiety",v)} color="#ef4444"/>
            <SliderRating label="Self-Talk Tone" value={form.mind.selfTalk} onChange={v=>upd("mind.selfTalk",v)} color="#f59e0b"/>
            <div style={{marginTop:10}}>
              <div style={{fontSize:10,color:"#8b949e",marginBottom:4}}>Wins this week — even small ones:</div>
              <textarea className="inp ta" spellCheck={true} data-gramm={true} value={form.wins} onChange={e=>setForm(p=>({...p,wins:e.target.value}))} style={{minHeight:60,fontSize:11,background:"#0d1117"}} placeholder="What went well, even a little?"/>
            </div>
            <div style={{marginTop:8}}>
              <div style={{fontSize:10,color:"#8b949e",marginBottom:4}}>What's feeling stuck or hard right now:</div>
              <textarea className="inp ta" spellCheck={true} data-gramm={true} value={form.stuck} onChange={e=>setForm(p=>({...p,stuck:e.target.value}))} style={{minHeight:60,fontSize:11,background:"#0d1117"}} placeholder="What's getting in the way?"/>
            </div>
          </div>
          <div className="mmm-card">
            <div style={{fontSize:11,fontWeight:800,color:"#10b981",marginBottom:8}}>🎯 MISSION — Purpose & Progress</div>
            <div style={{fontSize:9,color:"#8b949e",marginBottom:10}}>How connected do you feel to your goals and direction?</div>
            <SliderRating label="Motivation" value={form.mission.motivation} onChange={v=>upd("mission.motivation",v)} color="#10b981"/>
            <SliderRating label="Goal Progress" value={form.mission.goalProgress} onChange={v=>upd("mission.goalProgress",v)} color="#F76900"/>
            <div style={{marginTop:10}}>
              <div style={{fontSize:10,color:"#8b949e",marginBottom:4}}>What do you want to bring to your next coaching session?</div>
              <textarea className="inp ta" spellCheck={true} data-gramm={true} value={form.bringToSession} onChange={e=>setForm(p=>({...p,bringToSession:e.target.value}))} style={{minHeight:60,fontSize:11,background:"#0d1117"}} placeholder="What topic, question, or challenge do you want to focus on?"/>

          </div>

          <button className="btn btn-primary" onClick={save} disabled={saving}>{saving?"Saving...":"✅ Save Check-In"}</button>

        <div style={{fontSize:36,marginBottom:8,opacity:.3}}>📊</div>
        <div style={{fontSize:13,fontWeight:700,marginBottom:4}}>No check-ins yet</div>
        <div style={{fontSize:11}}>Weekly check-ins build self-awareness and help your coach prepare for each session.</div>
      </div>}
      {checkIns.length>0&&(
        <div>
          <div style={{fontSize:11,fontWeight:700,color:O,marginBottom:10}}>Recent Check-Ins</div>
          {[...checkIns].reverse().slice(0,showAllCI?24:5).map((ci,i)=>(
            <div key={i} style={{background:CARD,border:`1px solid ${BORDER}`,borderRadius:10,padding:12,marginBottom:8}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
                <div style={{fontSize:12,fontWeight:700,color:"#e6edf3"}}>{fmtDate(ci.date)}<button style={{fontSize:9,color:"var(--red)",background:"transparent",border:"none",cursor:"pointer",float:"right",marginTop:-4}} onClick={()=>{if(window.confirm("Remove this check-in?")){const upd=[...checkIns];upd.splice(checkIns.length-1-i,1);setCheckIns(upd);db?.collection("mos").doc(uid).set({checkIns:upd},{merge:true}).catch(()=>{});}}} title="Delete this check-in">✕</button></div>
                <div style={{display:"flex",gap:6}}>
                  {[["⚡",ci.machine?.energy,"#3b82f6"],["🎯",ci.mission?.motivation,"#10b981"]].map(([icon,v,col])=>
                    v?<div key={icon} style={{fontSize:10,color:col,background:col+"18",borderRadius:4,padding:"1px 7px"}}>{icon} {v}/10</div>:null
                  )}
                </div>
              </div>
              {ci.wins&&<div style={{fontSize:11,color:"#8b949e",marginBottom:4}}><strong style={{color:"var(--green)"}}>Wins:</strong> {ci.wins}</div>}
              {ci.stuck&&<div style={{fontSize:11,color:"#8b949e",marginBottom:4}}><strong style={{color:"#ef4444"}}>Stuck:</strong> {ci.stuck}</div>}
              {ci.bringToSession&&<div style={{fontSize:11,color:"#8b949e"}}><strong style={{color:O}}>Bringing to session:</strong> {ci.bringToSession}</div>}
            </div>
          ))}
          {checkIns.length>5&&<button className="btn btn-ghost btn-sm" style={{marginTop:8,fontSize:10}} onClick={()=>setShowAllCI(p=>!p)}>{showAllCI?"▲ Show fewer":"Show all "+checkIns.length+" check-ins ▼"}</button>}
        </div>
      )}
    </div>
  );
}

/* ═══════════════════════════════════════════════════════════
   EF PROFILE — SELF-REPORT & PROGRESS MONITORING
   Evidence: Dawson & Guare Smart But Stuck model ·
   Executive Function Rating (BRIEF-A framework) ·
   Outcome measurement in ADHD coaching (Parker et al.)
═══════════════════════════════════════════════════════════ */
function EFProfilePanel({uid,readOnly=false,showToast=()=>{}}){
  const [reports,setReports]=useState([]);
  const [editing,setEditing]=useState(false);
  const [scores,setScores]=useState(Object.fromEntries(EF_DOMAINS.map(d=>[d.id,3])));
  const [loading,setLoading]=useState(true);
  const [saving,setSaving]=useState(false);
  const CARD="#161b22",BORDER="#30363d";

  useEffect(()=>{
    setEditing(false); // reset edit mode on student switch
    if(!uid||!db){setLoading(false);return;}
    setLoading(true);
    db.collection("mos").doc(uid).get().then(snap=>{
      if(snap.exists&&snap.data().efReports)setReports(snap.data().efReports.slice(-8));
      setLoading(false);
    }).catch(()=>setLoading(false));
  },[uid]);

  const save=async()=>{
    if(!db||!uid)return;
    if(saving)return;
    setSaving(true);
    const entry={date:todayYMD(),scores:{...scores},total:Math.round(Object.values(scores).reduce((a,b)=>a+b,0)/EF_DOMAINS.length*10)/10};
    const updated=[...reports,entry].slice(-8);
    try{
      await db.collection("mos").doc(uid).set({efReports:updated},{merge:true});
      setReports(updated);setEditing(false);
      setScores(Object.fromEntries(EF_DOMAINS.map(d=>[d.id,3])));
      showToast&&showToast("✅ EF assessment saved!");
    }catch(e){showToast&&showToast("Save failed: "+(e.message||"check connection"));}
    finally{setSaving(false);}
  };

  const latest=reports[reports.length-1];
  const prev=reports[reports.length-2];

  // Radar chart points
  const radarPoints=(sc,r,cx,cy)=>EF_DOMAINS.map((d,i)=>{
    const angle=(2*Math.PI*i/EF_DOMAINS.length)-Math.PI/2;
    const val=((sc[d.id]||1)-1)/4;
    return`${cx+val*r*Math.cos(angle)},${cy+val*r*Math.sin(angle)}`;
  }).join(" ");

  if(loading)return<div style={{padding:20,color:"var(--muted)",textAlign:"center"}}>Loading EF profile...</div>;

  return(
    <div style={{fontFamily:"'DM Sans',sans-serif"}}>
      <div style={{background:"linear-gradient(135deg,#001a3a,#0d1117)",border:`2px solid ${O}33`,borderRadius:12,padding:"14px 16px",marginBottom:14}}>
        <div style={{fontSize:9,color:O,fontWeight:800,letterSpacing:1.2,textTransform:"uppercase",marginBottom:4}}>Executive Function Profile</div>
        <div style={{fontFamily:"'DM Serif Display',serif",fontSize:16,marginBottom:2}}>My EF Self-Report</div>
        <div style={{fontSize:10,color:"#8b949e",lineHeight:1.6}}>Based on Dawson & Guare's EF model. Rate 1–5: 1=Significant challenge · 3=Sometimes works · 5=Strong skill.</div>
        {!readOnly&&<button className="btn btn-primary btn-sm" style={{marginTop:10}} onClick={()=>setEditing(!editing)}>
          {editing?"✕ Cancel":reports.length?"📊 New Assessment":"📊 Start EF Assessment"}
        </button>}
        {latest&&<div style={{fontSize:11,color:"#8b949e",marginTop:6}}>Last assessed: {fmtDate(latest.date)} · Overall: {latest.total}/5</div>}
      </div>

      {editing&&!readOnly&&(
        <div style={{background:CARD,border:`2px solid ${O}55`,borderRadius:12,padding:16,marginBottom:14}} className="fade">
          <div style={{fontSize:11,fontWeight:700,color:O,marginBottom:12}}>📅 {fmtDate(todayYMD())} — Rate each EF domain honestly</div>
          {EF_DOMAINS.map(d=>(
            <div key={d.id} className="ef-domain">
              <div style={{fontSize:11,color:"#e6edf3",display:"flex",alignItems:"center",gap:5}}>
                <span>{d.icon}</span><span style={{fontWeight:600}}>{d.l}</span>
              </div>
              <input type="range" min={1} max={5} value={scores[d.id]||3}
                onChange={e=>setScores(p=>({...p,[d.id]:Number(e.target.value)}))}
                style={{accentColor:O}}/>
              <div style={{fontSize:12,fontWeight:800,color:scores[d.id]>=4?"var(--green)":scores[d.id]<=2?"var(--red)":O,textAlign:"right"}}>{scores[d.id]}</div>
            </div>
          ))}
          <div style={{marginTop:6,marginBottom:14,fontSize:10,color:"#8b949e"}}>
            {EF_DOMAINS.map(d=><span key={d.id} style={{marginRight:8}}>{d.icon} {d.l}: <strong>{d.desc}</strong></span>)}
          </div>
          <button className="btn btn-primary btn-sm" onClick={save}>💾 Save Assessment</button>
        </div>
      )}
      {latest&&(
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:14,marginBottom:14}}>
          <div style={{background:CARD,border:`1px solid ${BORDER}`,borderRadius:12,padding:14,textAlign:"center"}}>
            <div style={{fontSize:11,fontWeight:700,color:O,marginBottom:8}}>Current Profile</div>
            <svg width="180" height="180" viewBox="0 0 180 180" style={{display:"block",margin:"0 auto"}}>
              {[1,2,3,4].map(r=>(
                <polygon key={r} points={EF_DOMAINS.map((_,i)=>{
                  const angle=(2*Math.PI*i/EF_DOMAINS.length)-Math.PI/2;
                  const val=(r/4);
                  return`${90+val*70*Math.cos(angle)},${90+val*70*Math.sin(angle)}`;
                }).join(" ")} fill="none" stroke={BORDER} strokeWidth="1"/>
              ))}
              {EF_DOMAINS.map((_,i)=>{
                const angle=(2*Math.PI*i/EF_DOMAINS.length)-Math.PI/2;
                return<line key={i} x1={90} y1={90} x2={90+70*Math.cos(angle)} y2={90+70*Math.sin(angle)} stroke={BORDER} strokeWidth="1"/>;
              })}
              {prev&&<polygon points={radarPoints(prev?.scores||{},70,90,90)} fill={O+"18"} stroke={O+"55"} strokeWidth="1.5"/>}
              <polygon points={radarPoints(latest?.scores||{},70,90,90)} fill={O+"33"} stroke={O} strokeWidth="2"/>
              {EF_DOMAINS.map((d,i)=>{
                const angle=(2*Math.PI*i/EF_DOMAINS.length)-Math.PI/2;
                const x=90+85*Math.cos(angle);const y=90+85*Math.sin(angle);
                return<text key={i} x={x} y={y} textAnchor="middle" dominantBaseline="middle" fill="#8b949e" fontSize="7">{d.icon}</text>;
              })}
            </svg>
            {prev&&<div style={{fontSize:9,color:"#8b949e",marginTop:4}}>Orange=current · Faded=previous</div>}
          </div>
          <div style={{background:CARD,border:`1px solid ${BORDER}`,borderRadius:12,padding:14}}>
            <div style={{fontSize:11,fontWeight:700,color:O,marginBottom:8}}>Domain Breakdown</div>
            {EF_DOMAINS.map(d=>{
              const score=latest.scores[d.id]||3;
              const prevScore=prev?.scores[d.id];
              const diff=prevScore?score-prevScore:0;
              const col=score>=4?"var(--green)":score<=2?"var(--red)":O;
              return(
                <div key={d.id} style={{display:"flex",alignItems:"center",gap:6,marginBottom:5}}>
                  <span style={{fontSize:10}}>{d.icon}</span>
                  <div style={{flex:1,height:6,background:BORDER,borderRadius:3,overflow:"hidden"}}>
                    <div style={{width:`${(score/5)*100}%`,height:"100%",background:col,borderRadius:3}}/>
                  </div>
                  <div style={{fontSize:9,color:col,width:16,textAlign:"right",fontWeight:700}}>{score}</div>
                  {diff!==0&&<div style={{fontSize:8,color:diff>0?"var(--green)":"var(--red)",width:18}}>{diff>0?"↑":"↓"}{Math.abs(diff)}</div>}
                </div>
              );
            })}
          </div>
        </div>
      )}

      {reports.length===0&&!editing&&<div style={{background:CARD,border:`1px dashed ${BORDER}`,borderRadius:10,padding:32,textAlign:"center",color:"#8b949e"}}>
        <div style={{fontSize:36,marginBottom:8,opacity:.3}}>📊</div>
        <div style={{fontSize:13,fontWeight:700,marginBottom:4}}>No EF assessments yet</div>
        <div style={{fontSize:11}}>Regular EF self-assessments create a measurable record of your coaching growth.</div>
      </div>}
    </div>
  );
}

const INIT_INTAKE={
  diagnosisHistory:"",medications:"",previousCoaching:"",previousTherapy:"",
  accommodations:"",testingReports:"",
  learningStyle:"",peakFocusTime:"",studyEnvironment:"",sensoryNeeds:"",
  biggestChallenges:"",biggestStrengths:"",
  shortTermGoals:"",longTermVision:"",
  consentAgreed:false,consentDate:"",ferpaAgreed:false,
  emergencyContact:"",emergencyPhone:"",
  insuranceInfo:"",packageSelected:"",
  coachNotes:""
};
/* ═══════════════════════════════════════════════════════════
   DIGITAL INTAKE — Consent, History, Learning Profile
   Evidence: Informed Consent best practices (ICF Code of Ethics)
   ADHD/EF history collection (Barkley, Brown clinical model)
═══════════════════════════════════════════════════════════ */
function DigitalIntakePanel({uid,coachView=false,showToast}){
  const CARD="#161b22",BORDER="#30363d";
  const [intake,setIntake]=useState(INIT_INTAKE);
  const [saved,setSaved]=useState(false);
  const [saving,setSaving]=useState(false);
  const [loading,setLoading]=useState(true);

  useEffect(()=>{
    setIntake(INIT_INTAKE);
    if(!uid||!db){setLoading(false);return;}
    db.collection("students").doc(uid).get().then(snap=>{
      if(snap.exists&&snap.data().intake){
        const loaded={...snap.data().intake};
        // Confidential coach-only field — never expose it to the student's own
        // browser session, even though the UI already hides it. This keeps it
        // out of client memory/devtools entirely rather than relying on CSS.
        if(!coachView)delete loaded.coachNotes;
        setIntake(p=>({...p,...loaded}));
      }
      setLoading(false);
    }).catch(()=>setLoading(false));
  },[uid,coachView]);

  const upd=(k,v)=>setIntake(p=>({...p,[k]:v}));

  const save=async()=>{
    if(!db||!uid){showToast("Firebase not connected");return;}
    if(saving)return;
    setSaving(true);
    try{
      const now=new Date().toLocaleString("en-US",{month:"short",day:"numeric",year:"numeric",hour:"numeric",minute:"2-digit"});
      await db.collection("students").doc(uid).set({intake:{...intake,lastUpdated:todayYMD(),lastUpdatedAt:now}},{merge:true});
      setSaved(true);showToast("✅ Intake saved!");setTimeout(()=>setSaved(false),3000);
    }catch(e){showToast("Save failed: "+e.message);}
    finally{setSaving(false);}
  };

  const pi2={background:"#0d1117",border:`1px solid ${BORDER}`,color:"#e6edf3",borderRadius:7,padding:"8px 11px",fontSize:12,width:"100%"};
  const ta2={...pi2,resize:"vertical",minHeight:70,lineHeight:1.65};
  const Section=({title,icon,children})=>(
    <div className="intake-section">
      <div style={{fontSize:12,fontWeight:800,color:O,marginBottom:12,display:"flex",alignItems:"center",gap:6}}>
        <span>{icon}</span><span>{title}</span>
      </div>
      {children}
    </div>
  );
  const Field=({label,k,type="textarea",options=[]})=>(
    <div style={{marginBottom:10}}>
      <div style={{fontSize:10,color:"#8b949e",fontWeight:700,marginBottom:4}}>{label}</div>
      {type==="textarea"?<textarea spellCheck={true} data-gramm={true} maxLength={1500} style={ta2} value={intake[k]||""} onChange={e=>upd(k,e.target.value)} placeholder={`${label}...`}/>:
       type==="select"?<select style={pi2} value={intake[k]||""} onChange={e=>upd(k,e.target.value)}>
        <option value="">Select...</option>{options.map(o=><option key={o}>{o}</option>)}</select>:
       <input style={pi2} type={type} value={intake[k]||""} onChange={e=>upd(k,e.target.value)} spellCheck={true} data-gramm={true}/>}
    </div>
  );

  if(loading)return<div style={{padding:20,color:"var(--muted)",textAlign:"center"}}>Loading intake...</div>;

  return(
    <div style={{fontFamily:"'DM Sans',sans-serif"}}>
      <div style={{background:"linear-gradient(135deg,#001a3a,#0d1117)",border:`2px solid ${O}33`,borderRadius:12,padding:"14px 16px",marginBottom:14}}>
        <div style={{fontSize:9,color:O,fontWeight:800,letterSpacing:1.2,textTransform:"uppercase",marginBottom:4}}>Client Intake & History</div>
        <div style={{fontFamily:"'DM Serif Display',serif",fontSize:16,marginBottom:2}}>Focused Solutions LLC · OnTrack at SU</div>
        <div style={{fontSize:10,color:"#8b949e"}}>Confidential · FERPA-protected · {COACH_NAME}, {COACH_TITLE}</div>
      </div>

      <Section title="ADHD & Neurodiversity History" icon="🧬">
        <Field label="Diagnosis History (ADHD type, ASD, LD, anxiety, etc.)" k="diagnosisHistory"/>
        <Field label="Current Medications (if applicable — optional)" k="medications"/>
        <Field label="Current Accommodations (from CDR or IEP/504)" k="accommodations"/>
        <Field label="Previous Testing / Reports (brief description)" k="testingReports"/>
        <Field label="Previous Coaching or Therapy (what worked, what didn't)" k="previousCoaching"/>
      </Section>

      <Section title="Learning & Work Profile" icon="🎨">
        <Field label="Peak Focus Time (morning, afternoon, evening)" k="peakFocusTime" type="select" options={["Morning (8am-12pm)","Midday (12pm-3pm)","Afternoon (3pm-6pm)","Evening (6pm-10pm)","Late Night","Varies significantly"]}/>
        <Field label="Ideal Study Environment" k="studyEnvironment" type="select" options={["Quiet solo space","Background noise (café, library)","Music/headphones","Body doubling (others present)","Outdoors","Varies"]}/>
        <Field label="Sensory Needs or Preferences" k="sensoryNeeds"/>
      </Section>

      <Section title="Strengths & Challenges" icon="⚡">
        <Field label="My Biggest Challenges (EF, academic, social)" k="biggestChallenges"/>
        <Field label="My Biggest Strengths (what I do well, what I'm proud of)" k="biggestStrengths"/>
      </Section>

      <Section title="Coaching Goals" icon="🎯">
        <Field label="Short-term Goals (this semester)" k="shortTermGoals"/>
        <Field label="Longer-term Vision (1-2 years from now)" k="longTermVision"/>
        <Field label="Coaching Package" k="packageSelected" type="select" options={COACHING_PACKAGES.map(p=>p.l)}/>
      </Section>

      <Section title="Emergency & Contact Information" icon="📞">
        <Field label="Emergency Contact Name & Relationship" k="emergencyContact" type="text"/>
        <Field label="Emergency Contact Phone" k="emergencyPhone" type="text"/>
      </Section>

      {coachView&&<Section title="Coach Notes (Internal Only)" icon="🔒">
        <Field label="Initial clinical impressions, observations, referral considerations" k="coachNotes"/>
      </Section>}

      <Section title="Informed Consent" icon="✍️">
        <div style={{background:"#0d1117",border:`1px solid ${BORDER}`,borderRadius:8,padding:14,marginBottom:10,fontSize:11,color:"#8b949e",lineHeight:1.75}}>
          <strong style={{color:"#e6edf3"}}>Coaching Agreement:</strong> I understand that coaching is a collaborative, forward-focused process distinct from therapy or counseling. My coach will not diagnose, treat, or prescribe. All session information is confidential except where disclosure is required by law. I may end coaching at any time. This relationship is governed by ICF Code of Ethics and Focused Solutions LLC confidentiality policies.
        </div>
        <label style={{display:"flex",gap:10,alignItems:"center",marginBottom:8,cursor:"pointer"}}>
          <input type="checkbox" checked={intake.consentAgreed||false} onChange={e=>upd("consentAgreed",e.target.checked)} style={{accentColor:O,width:16,height:16}}/>
          <span style={{fontSize:11,color:"#e6edf3"}}>I have read, understood, and agree to the coaching agreement above</span>
        </label>
        <label style={{display:"flex",gap:10,alignItems:"center",cursor:"pointer"}}>
          <input type="checkbox" checked={intake.ferpaAgreed||false} onChange={e=>upd("ferpaAgreed",e.target.checked)} style={{accentColor:O,width:16,height:16}}/>
          <span style={{fontSize:11,color:"#e6edf3"}}>I understand my records are protected under FERPA and may be shared with CDR/OnTrack program staff as applicable</span>
        </label>
        {intake.consentAgreed&&<div style={{marginTop:8}}>
          <div style={{fontSize:10,color:"#8b949e",marginBottom:4}}>Date of Consent</div>
          <input style={{...pi2,width:"auto"}} type="date" value={intake.consentDate||""} onChange={e=>upd("consentDate",e.target.value)}/>
        </div>}
      </Section>

      <button className="btn btn-primary" onClick={save} disabled={!coachView&&!intake.consentAgreed} style={{opacity:(!coachView&&!intake.consentAgreed)?0.5:1}}>
        {saved?"✅ Saved":"💾 Save Intake Form"}
      </button>
      {!coachView&&!intake.consentAgreed&&<div style={{fontSize:10,color:"var(--muted)",marginTop:6}}>Consent must be agreed before saving</div>}
    </div>
  );
}

const LEVEL_COLORS={"-2":"#ef4444","-1":"#f97316","0":"#f59e0b","1":"#10b981","2":"#34d399"};
const LEVEL_LABELS={"-2":"−2 Much Worse","-1":"−1 Somewhat Worse","0":"0 Expected","1":"+1 Somewhat Better","2":"+2 Much Better"};
/* ═══════════════════════════════════════════════════════════
   GOAL ATTAINMENT SCALING (GAS)
   Gold standard outcome measure in rehabilitation & coaching
   Parker et al. (2013) ADHD coaching effectiveness studies
   T-score calculation: T = 50 + 10(Σwᵢgᵢ) / √(0.7Σwᵢ² + 0.3(Σwᵢ)²)
═══════════════════════════════════════════════════════════ */
function GoalAttainmentPanel({uid,goals=[],showToast}){
  const CARD="#161b22",BORDER="#30363d";
  const [gasGoals,setGasGoals]=useState([]);
  const [saved,setSaved]=useState(false);
  const _ratingSeq=React.useRef(0); // sequence counter — only latest setRating write commits
  const [saving,setSaving]=useState(false);
  const [loading,setLoading]=useState(true);

  useEffect(()=>{
    if(!uid||!db){setLoading(false);return;}
    const _gasUnsub=db.collection("students").doc(uid).onSnapshot(snap=>{
      if(snap.exists&&snap.data().gasGoals){
        setGasGoals(snap.data().gasGoals);
      }else if(goals.filter(g=>g.title).length){
        setGasGoals(goals.filter(g=>g.title).map(g=>({
          id:g.id,title:g.title,
          levels:{"-2":"Much less than expected","-1":"Somewhat less","0":"Expected outcome","1":"Somewhat better","2":"Much better than expected"},
          current:0,history:[]
        })));
      }
      setLoading(false);
    },()=>setLoading(false));
    return()=>{if(typeof _gasUnsub==="function")_gasUnsub();};
  },[uid,goals.length]);

  const updLevel=(gid,l,v)=>setGasGoals(p=>p.map(g=>g.id===gid?{...g,levels:{...g.levels,[String(l)]:v}}:g));
  const setRating=async(gid,v)=>{
    setSaved(false);
    // Increment sequence counter — only the latest invocation should commit
    const seq=++_ratingSeq.current;
    let latestGoals;
    setGasGoals(prev=>{
      latestGoals=prev.map(g=>g.id===gid?{...g,current:v,history:[...g.history,{date:todayYMD(),rating:v}]}:g);
      return latestGoals;
    });
    if(db&&uid&&latestGoals){
      try{
        await db.collection("students").doc(uid).set({gasGoals:latestGoals},{merge:true});
      }catch(e){
        // Only roll back if this is still the latest call (not superseded by a newer rating)
        if(seq===_ratingSeq.current){
          setGasGoals(prev=>prev); // no-op rerender; actual rollback skipped to avoid stale-state overwrite
          showToast&&showToast("Rating save failed — try again.");
          console.error("GAS auto-save:",e);
        }
      }
    }
  };

  const calcTScore=()=>{
    if(!gasGoals.length)return 50;
    const n=gasGoals.length;
    const sum=gasGoals.reduce((a,g)=>a+g.current,0);
    // Standard GAS T-score formula (Kiresuk & Sherman, 1968): T = 50 + 10(Σgᵢ) / √(0.7Σwᵢ² + 0.3(Σwᵢ)²)
    // This tool doesn't collect per-goal importance weights, so each goal is
    // equally weighted (wᵢ=1 for all i), meaning Σwᵢ²=n and (Σwᵢ)²=n².
    const T=50+10*sum/Math.sqrt(0.7*n+0.3*n*n);
    return Math.round(T);
  };

  const save=async()=>{
    if(!db||!uid){showToast("Firebase not connected");return;}
    if(saving)return;
    setSaving(true);
    try{
      await db.collection("students").doc(uid).set({gasGoals},{merge:true});
      setSaved(true);showToast("✅ GAS saved!");setTimeout(()=>setSaved(false),3000);
    }catch(e){showToast("Save failed: "+e.message);}
    finally{setSaving(false);}
  };

  const tScore=calcTScore();
  const tColor=tScore>=60?"var(--green)":tScore>=50?O:tScore>=40?"var(--yellow)":"var(--red)";
  const pi2={background:"#0d1117",border:`1px solid ${BORDER}`,color:"#e6edf3",borderRadius:7,padding:"7px 10px",fontSize:11,width:"100%"};

  if(loading)return<div style={{padding:24,textAlign:"center",color:"var(--muted)"}}>
    <div style={{fontSize:24,marginBottom:8,animation:"spin 1s linear infinite",display:"inline-block"}}>⚖️</div>
    <div style={{fontSize:12}}>Loading goal scales...</div>
  </div>;

  // LEVEL_COLORS and LEVEL_LABELS defined at module level

  return(
    <div style={{fontFamily:"'DM Sans',sans-serif"}}>
      <div style={{background:"linear-gradient(135deg,#001a3a,#0d1117)",border:`2px solid ${O}33`,borderRadius:12,padding:"14px 16px",marginBottom:14}}>
        <div style={{fontSize:9,color:O,fontWeight:800,letterSpacing:1.2,textTransform:"uppercase",marginBottom:4}}>Goal Attainment Scaling</div>
        <div style={{fontFamily:"'DM Serif Display',serif",fontSize:16,marginBottom:2}}>Individualized Outcome Measurement</div>
        <div style={{fontSize:10,color:"#8b949e",lineHeight:1.6}}>For each goal, define what each level looks like, then track progress each session. T-score ≥ 50 indicates expected or better outcomes. Parker et al. (2013).</div>
        {gasGoals.length>0&&<div style={{marginTop:10,display:"flex",alignItems:"center",gap:12}}>
          <div style={{fontSize:30,fontWeight:900,color:tColor}}>{tScore}</div>
          <div><div style={{fontSize:11,fontWeight:700,color:tColor}}>GAS T-Score</div>
          <div style={{fontSize:10,color:"#8b949e"}}>{tScore>=60?"Above expectations ★":tScore>=50?"Meeting expectations ✓":tScore>=40?"Approaching expectations":"Below expectations — review support"}</div></div>
        </div>}
      </div>

      {gasGoals.length===0&&<div style={{background:CARD,border:`1px dashed ${BORDER}`,borderRadius:10,padding:24,textAlign:"center",color:"#8b949e"}}>
        <div style={{fontSize:11}}>Add coaching goals in the Goals tab first. GAS scales will auto-populate from those goals.</div>
      </div>}

      {gasGoals.map(g=>(
        <div key={g.id} style={{background:CARD,border:`1px solid ${BORDER}`,borderRadius:12,padding:14,marginBottom:12}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:8}}><div style={{fontSize:12,fontWeight:800,color:"#e6edf3"}}>🎯 {g.title||"Goal"}</div></div>

          <textarea placeholder="Coach notes…" spellCheck={true} maxLength={400} style={{width:"100%",marginBottom:8,background:"var(--s2)",border:"1px solid var(--bdr)",color:"var(--txt)",borderRadius:6,padding:"4px 7px",fontSize:10,resize:"none",minHeight:32}} value={g.notes||""} onChange={e=>setGasGoals(p=>p.map(g2=>g2.id===g.id?{...g2,notes:e.target.value}:g2))}/>
          <div style={{marginBottom:12}}>
            <div style={{fontSize:10,color:O,fontWeight:700,marginBottom:8}}>Define Each Level:</div>
            {[-2,-1,0,1,2].map(l=>(
              <div key={l} className="gas-scale">
                <div style={{fontSize:10,fontWeight:700,color:LEVEL_COLORS[l],textAlign:"right"}}>{LEVEL_LABELS[l]}</div>
                <input style={pi2} spellCheck={true} data-gramm={true} value={g.levels[String(l)]||""} onChange={e=>updLevel(g.id,l,e.target.value)} placeholder={`What does ${LEVEL_LABELS[l]} look like?`}/>
              </div>
            ))}
          </div>
          <div style={{marginBottom:8}}>
            <div style={{fontSize:10,color:O,fontWeight:700,marginBottom:8}}>Current Rating:</div>
            <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
              {[-2,-1,0,1,2].map(l=>(
                <button key={l} onClick={()=>setRating(g.id,l)} style={{
                  padding:"6px 12px",borderRadius:6,cursor:"pointer",fontSize:11,fontWeight:700,
                  background:g.current===l?LEVEL_COLORS[l]:"transparent",
                  border:`2px solid ${LEVEL_COLORS[l]}`,
                  color:g.current===l?"#fff":LEVEL_COLORS[l]
                }}>{l>0?"+":""}{l}</button>
              ))}
            </div>
            {g.current!==undefined&&<div style={{fontSize:10,color:"#8b949e",marginTop:6}}>{LEVEL_LABELS[g.current]}: {g.levels[String(g.current)]||"(not defined)"}</div>}
          </div>
          {g.history.length>1&&(
            <div style={{marginTop:8}}>
              <div style={{fontSize:9,color:"#8b949e",marginBottom:4}}>Progress history:</div>
              <div style={{display:"flex",gap:3,alignItems:"flex-end",height:24}}>
                {g.history.slice(-10).map((h,i)=>(
                  <div key={i} style={{flex:1,height:`${((h.rating+2)/4)*100}%`,background:LEVEL_COLORS[h.rating]||O,borderRadius:2,minHeight:3}} title={`${fmtDate(h.date)}: ${h.rating>0?"+":""}${h.rating}`}/>
                ))}
              </div>
            </div>
          )}
        </div>
      ))}

      {gasGoals.length>0&&<button className="btn btn-primary btn-sm" onClick={save}>{saved?"✅ Saved":"💾 Save GAS Scales"}</button>}
    </div>
  );
}

/* ═══════════════════════════════════════════════════════════
   PSYCHOEDUCATION LIBRARY + SESSION PACKAGE TRACKER + REFERRAL NETWORK
═══════════════════════════════════════════════════════════ */
function PsychoedLibraryPanel({roster,showToast}){
  const CARD="#161b22",BORDER="#30363d";
  const [filter,setFilter]=useState("all");
  const [pushing,setPushing]=useState(null);
  const [pushed,setPushed]=useState({});
  const [selectedStudent,setSelectedStudentRN]=useState("");

  // Load which resources have already been pushed (persisted in roster docs)
  useEffect(()=>{
    if(!db||!roster.length)return;
    const uids=roster.filter(s=>s.uid).map(s=>s.uid);
    if(!uids.length)return;
    let _mounted=true;
    const reads=uids.map(uid=>db.collection("mos").doc(uid).get());
    Promise.all(reads).then(snaps=>{
      if(!_mounted)return;
      const map={};
      snaps.forEach((snap,i)=>{
        if(!snap.exists)return;
        const pr=snap.data().pushedResources||[];
        pr.forEach(p=>{
          if(p.id){
            if(!map[p.id])map[p.id]=[];
            const name=roster.find(s=>s.uid===uids[i])?.name||uids[i];
            if(!map[p.id].includes(name))map[p.id].push(name);
          }
        });
      });
      setPushed(map);
    }).catch(()=>{});
    return()=>{_mounted=false;};
  },[roster.length]);

  const pushToStudent=async(resourceId,studentUid,studentName)=>{
    if(!db||!studentUid){showToast("Student must be registered first.");return;}
    if(pushed[resourceId]?.includes(studentName)){showToast(`Already sent to ${studentName}`);return;}
    if(pushing===resourceId)return;
    setPushing(resourceId);
    try{
      await db.collection("mos").doc(studentUid).set({
        pushedResources:firebase.firestore.FieldValue.arrayUnion({id:resourceId,date:todayYMD(),resource:PSYCHOED_RESOURCES.find(r=>r.id===resourceId)})
      },{merge:true});
      setPushed(p=>({...p,[resourceId]:[...(p[resourceId]||[]),studentName]}));
      showToast(`✅ Resource pushed to ${studentName}!`);
    }catch(e){
      // Revert optimistic setPushed on failure so coach can retry
      setPushed(p=>{const r={...p};if(r[resourceId])r[resourceId]=(r[resourceId]||[]).filter(n=>n!==studentName);return r;});
      showToast("Failed to send resource: "+(e.message||"check connection"));
    }finally{
      setPushing(null);
    }
  };

  const domains=[{id:"all",l:"All Domains"},...EF_DOMAINS.map(d=>({id:d.domain||d.id,l:d.l}))];

        <div style={{fontFamily:"'DM Serif Display',serif",fontSize:16,marginBottom:2}}>Evidence-Based ADHD Resources</div>
        <div style={{fontSize:10,color:"#8b949e"}}>Push resources to students' portals from session notes or the library. Research shows coaching + psychoeducation produces significantly better outcomes (Knouse & Safren, 2010).</div>
      </div>

      <div style={{marginBottom:12}}>
        <div style={{fontSize:10,color:"var(--muted)",fontWeight:700,marginBottom:4}}>Student for warm handoff note:</div>
        <select style={{background:"var(--s2)",border:"1px solid var(--bdr)",color:"var(--txt)",borderRadius:7,padding:"6px 10px",fontSize:11}}
          value={selectedStudent} onChange={e=>setSelectedStudentRN(e.target.value)}>
          <option value="">— Select student (optional) —</option>
          {roster.filter(s=>s.name).map(s=><option key={s.id} value={s.name||s.email}>{s.name||s.email}{s.studentId?" — #"+s.studentId:""}</option>)}
        </select>
      </div>
      <div style={{display:"flex",gap:6,flexWrap:"wrap",marginBottom:14}}>
        {[{id:"all",l:"All"},{id:"initiation",l:"Initiation"},{id:"timeMgmt",l:"Time"},{id:"workingMem",l:"Memory"},{id:"emotionReg",l:"Emotion"},{id:"focus",l:"Focus"},{id:"persistence",l:"Motivation"},{id:"flexibility",l:"Flexibility"},{id:"inhibition",l:"Inhibition"},{id:"planning",l:"Planning"}].map(f=>(
          <button key={f.id} className="btn btn-ghost btn-sm" style={{borderColor:filter===f.id?O+"66":"var(--bdr)",color:filter===f.id?O:"var(--muted)"}} onClick={()=>setFilter(f.id)}>{f.l}</button>
        ))}
      </div>

      {filtered.map(r=>(
        <div key={r.id} style={{background:CARD,border:`1px solid ${BORDER}`,borderRadius:10,padding:12,marginBottom:8}}>
          <div style={{display:"flex",gap:10,alignItems:"flex-start",marginBottom:8}}>
            <div style={{fontSize:20}}>{TYPE_ICONS[r.type]||"📎"}</div>
            <div style={{flex:1}}>
              <div style={{fontSize:12,fontWeight:700,color:r.url?O:"#e6edf3",marginBottom:2,cursor:r.url?"pointer":"default"}} onClick={()=>r.url&&window.open(r.url,"_blank")}>{r.title}{r.url?" ↗":""}</div>
              <div style={{fontSize:10,color:"#8b949e",marginBottom:4}}>{r.author} · {r.type}</div>
              <div style={{fontSize:11,color:"#8b949e",lineHeight:1.5}}>{r.desc}</div>
              {pushed[r.id]?.length>0&&<div style={{fontSize:9,color:"var(--green)",marginTop:4}}>✓ Sent to: {pushed[r.id].join(", ")}</div>}
            </div>
          </div>
          <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
            <div style={{fontSize:9,color:O,background:O+"15",border:`1px solid ${O}33`,borderRadius:4,padding:"2px 7px"}}>{EF_DOMAINS.find(d=>d.id===r.domain)?.l||r.domain}</div>
            {roster.filter(s=>s.uid).map(s=>(
              <button key={s.id} className="btn btn-ghost btn-xs" onClick={()=>pushToStudent(r.id,s.uid,s.name||s.email)}>

      ))}
    </div>
  );
}

function SessionPackagePanel({uid,studentName,showToast}){
  const CARD="#161b22",BORDER="#30363d";
  const [pkg,setPkg]=useState({packageId:"ontrack",startDate:todayYMD(),totalSessions:25,sessionsUsed:0,attendance:[]});
  const [saved,setSaved]=useState(false);
  const [saving,setSaving]=useState(false);
  const [logging,setLogging]=useState(false);
  const [loading,setLoading]=useState(true);

  useEffect(()=>{
    setPkg({packageId:"ontrack",startDate:todayYMD(),totalSessions:25,sessionsUsed:0,attendance:[]});
    if(!uid||!db){setLoading(false);return;}
    db.collection("students").doc(uid).get().then(snap=>{
      if(snap.exists&&snap.data().package)setPkg(p=>({...p,...snap.data().package}));
      setLoading(false);
    }).catch(()=>setLoading(false));
  },[uid]);

  const logSession=async(status)=>{
    if(logging)return;
    if(!db||!uid){showToast("Firebase not connected");return;}
    setLogging(true);
    const entry={date:todayYMD(),status,num:(pkg.sessionsUsed||0)+(status==="attended"?1:0)};
    const updated={...pkg,attendance:[...(pkg.attendance||[]),entry],sessionsUsed:Math.min((pkg.sessionsUsed||0)+(status==="attended"?1:0),(pkg.totalSessions||999))};
    setPkg(updated);
    // Auto-save immediately so attendance isn't lost on navigation
    try{
      await db.collection("students").doc(uid).set({package:{...updated,attendance:(updated.attendance||[]).slice(-100)}},{merge:true});
      showToast(status==="attended"?"✅ Session logged!":status==="late_cancel"?"⚠️ Late cancel logged":"❌ No-show logged");
    }catch(e){showToast("Log failed: "+e.message);}
    finally{setLogging(false);}
  };

  const save=async()=>{
    if(!db||!uid){showToast("Firebase not connected");return;}
    if(saving)return;
    setSaving(true);
    try{
      const pkgToSave={...pkg,attendance:(pkg.attendance||[]).slice(-100)};
      await db.collection("students").doc(uid).set({package:pkgToSave},{merge:true});
      setSaved(true);showToast("✅ Package saved!");setTimeout(()=>setSaved(false),3000);
    }catch(e){showToast("Save failed: "+e.message);}
    finally{setSaving(false);
    setSaved(p=>p);}
  };

  const pi2={background:"#0d1117",border:`1px solid ${BORDER}`,color:"#e6edf3",borderRadius:7,padding:"7px 10px",fontSize:11,width:"100%"};
  const pct=pkg.totalSessions>0?Math.round((pkg.sessionsUsed/pkg.totalSessions)*100):0;
  const remaining=Math.max(0,(pkg.totalSessions||0)-(pkg.sessionsUsed||0));

  if(loading)return<div style={{padding:20,color:"var(--muted)",textAlign:"center"}}>Loading package...</div>;

  return(
    <div style={{fontFamily:"'DM Sans',sans-serif"}} className="fade">
      <div style={{background:"linear-gradient(135deg,#001a3a,#0d1117)",border:`2px solid ${O}33`,borderRadius:12,padding:"14px 16px",marginBottom:14}}>
        <div style={{fontSize:9,color:O,fontWeight:800,letterSpacing:1.2,textTransform:"uppercase",marginBottom:4}}>Session Package & Attendance</div>
        <div style={{fontFamily:"'DM Serif Display',serif",fontSize:16,marginBottom:2}}>{studentName||"Student"}</div>
      </div>

      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(70px,1fr))",gap:8,marginBottom:14}}>
        {[["Package",COACHING_PACKAGES.find(p=>p.id===pkg.packageId)?.l||"Custom",O],
          ["Total",pkg.totalSessions||0,"var(--blue)"],
          ["Used",pkg.sessionsUsed||0,"var(--green)"],
          ["Remaining",remaining,remaining<=3?"var(--red)":O]].map(([l,v,col])=>(
          <div key={l} className="package-stat">
            <div style={{fontSize:20,fontWeight:900,color:col}}>{v}</div>
            <div style={{fontSize:9,color:"var(--muted)",marginTop:2}}>{l}</div>
          </div>
        ))}
      </div>

      <div style={{background:CARD,border:`1px solid ${BORDER}`,borderRadius:10,padding:14,marginBottom:12}}>
        <div style={{fontSize:11,fontWeight:700,color:O,marginBottom:10}}>Package Settings</div>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
          <div>
            <div style={{fontSize:9,color:"var(--muted)",fontWeight:700,marginBottom:4}}>Package Type</div>
            <select style={pi2} value={pkg.packageId||"ontrack"} onChange={e=>{const p=COACHING_PACKAGES.find(x=>x.id===e.target.value);setPkg(prev=>({...prev,packageId:e.target.value,totalSessions:p?.sessions||prev.totalSessions}));}}>
              {COACHING_PACKAGES.map(p=><option key={p.id} value={p.id}>{p.l} ({p.sessions} sessions)</option>)}
            </select>
          </div>
          <div>
            <div style={{fontSize:9,color:"var(--muted)",fontWeight:700,marginBottom:4}}>Start Date</div>
            <input style={pi2} type="date" value={pkg.startDate||""} onChange={e=>setPkg(p=>({...p,startDate:e.target.value}))}/>
          </div>
        </div>
        <div style={{marginTop:10}}>
          <div style={{display:"flex",justifyContent:"space-between",marginBottom:4,fontSize:10,color:"var(--muted)"}}>
            <span>Package Progress</span><span style={{color:O}}>{pct}%</span>
          </div>
          <div style={{height:8,background:"var(--s3)",borderRadius:4,overflow:"hidden"}}>
            <div style={{width:pct+"%",height:"100%",background:`linear-gradient(90deg,${O},var(--orange2))`,borderRadius:4}}/>
          </div>
        </div>
      </div>

      <div style={{background:CARD,border:`1px solid ${BORDER}`,borderRadius:10,padding:14,marginBottom:12}}>
        <div style={{fontSize:11,fontWeight:700,color:O,marginBottom:10}}>Log Session Attendance</div>
        <div style={{display:"flex",gap:8}}>
          {[["Attended","attended","var(--green)"],["Late Cancel","late_cancel","var(--yellow)"],["No Show","no_show","var(--red)"]].map(([l,s,col])=>(
            <button key={s} className="btn btn-ghost btn-sm" style={{borderColor:col,color:col}} onClick={()=>logSession(s)}>{l}</button>
          ))}
        </div>
        {(pkg.attendance||[]).length>0&&(
          <div style={{marginTop:10}}>
            <div style={{fontSize:9,color:"var(--muted)",marginBottom:6}}>Recent attendance:</div>
            <div style={{display:"flex",gap:4,flexWrap:"wrap"}}>
              {[...pkg.attendance].reverse().slice(0,10).map((a,i)=>(
                <div key={i} style={{fontSize:9,padding:"2px 7px",borderRadius:4,background:a.status==="attended"?"var(--green)18":a.status==="no_show"?"var(--red)18":"var(--yellow)18",color:a.status==="attended"?"var(--green)":a.status==="no_show"?"var(--red)":"var(--yellow)",border:`1px solid ${a.status==="attended"?"var(--green)22":a.status==="no_show"?"var(--red)22":"var(--yellow)22"}`}}>
                  {fmtDate(a.date)} {a.status==="attended"?"✓":a.status==="no_show"?"✗":"⚡"}
                </div>
              ))}
            </div>
          </div>
        )}
      </div>
      <button className="btn btn-primary btn-sm" onClick={save}>{saved?"✅ Saved":"💾 Save Package"}</button>
    </div>
  );
}

function ReferralNetworkPanel({showToast,roster=[]}){
  const CARD="#161b22",BORDER="#30363d";
  const [filter,setFilter]=useState("all");
  const [generating,setGenerating]=useState(null);
  const _ghCtrl=React.useRef(null); // AbortController for generateHandoff
  const [warmHandoff,setWarmHandoff]=useState(null);
  const [selectedStudent,setSelectedStudentRN]=useState("");
  const cats=["all",...new Set(SU_REFERRALS.map(r=>r.cat))];
  React.useEffect(()=>{setSelectedStudentRN("");setWarmHandoff(null);},[roster.length]);
  const filtered=filter==="all"?SU_REFERRALS:SU_REFERRALS.filter(r=>r.cat===filter);

  const generateHandoff=async(ref)=>{
    if(!AI_CONFIGURED){showToast("⚠️ Claude proxy not configured — see Step 3");return;}
    if(!selectedStudent){showToast("⚠️ Select a student first.");return;}
    // Cancel any in-flight request before starting a new one
    if(_ghCtrl.current)_ghCtrl.current.abort();
    _ghCtrl.current=new AbortController();
    const _signal=_ghCtrl.current.signal;
    const _targetStudent=selectedStudent;
    setGenerating(ref.id);
    const sName=selectedStudent||"the student";
    try{
      const sys="Write a brief, warm, professional warm-handoff note from an ICF-certified ADHD coach to a campus resource professional. 3-4 sentences. Include: why the coach is making the referral (using coaching language, not clinical diagnosis language), what the student has been working on, and what kind of support would be most helpful. Professional but warm tone.";
      const msg=`Referral to: ${ref.name}\nReferral category: ${ref.cat}\nStudent name: ${sName}\nStudent is working with an ADHD coach on executive function skills, self-regulation, and academic success strategies.\nWrite the warm handoff note addressed to ${ref.name} staff, referencing ${sName} by name.`;
      const res=await callClaude({model:MODEL,max_tokens:300,system:sys,messages:[{role:"user",content:msg}]});
      if(!res.ok)throw new Error(`API ${res.status}`);
      const d=await res.json();
      const note=d.content?.[0]?.text||"";
      if(_targetStudent===selectedStudent)setWarmHandoff({ref,note});
    }catch(e){if(e.name!=="AbortError")showToast("Generation failed: "+e.message);}
    finally{setGenerating(null);}
  };

  return(
    <div style={{fontFamily:"'DM Sans',sans-serif"}} className="fade">
      <div style={{background:"linear-gradient(135deg,#001a3a,#0d1117)",border:`2px solid ${O}33`,borderRadius:12,padding:"14px 16px",marginBottom:14}}>

        <div style={{fontSize:9,color:"var(--dim)",marginTop:4,marginBottom:10}}>Update contacts by editing SU_REFERRALS at the top of this file.</div>
        <div style={{fontFamily:"'DM Serif Display',serif",fontSize:16,marginBottom:2}}>Syracuse University Resources</div>
        <div style={{fontSize:10,color:"#8b949e"}}>Generate AI warm-handoff notes for any referral in one click.</div>
      </div>

      {warmHandoff&&(
        <div style={{background:CARD,border:`2px solid ${O}55`,borderRadius:12,padding:14,marginBottom:14}} className="fade">
          <div style={{fontSize:11,fontWeight:700,color:O,marginBottom:8}}>📧 Warm Handoff Note — {warmHandoff.ref.name}</div>
          <textarea spellCheck={true} data-gramm={true} style={{background:"#0d1117",border:`1px solid ${BORDER}`,color:"#e6edf3",borderRadius:8,padding:12,fontSize:12,width:"100%",minHeight:120,lineHeight:1.7,resize:"vertical"}}
            value={warmHandoff.note} onChange={e=>setWarmHandoff(p=>({...p,note:e.target.value}))}/>
          <div style={{display:"flex",gap:8,marginTop:8}}>
            <button className="btn btn-primary btn-sm" onClick={()=>{
              const sub=encodeURIComponent(`Coaching Referral — OnTrack at SU`);
              const body=encodeURIComponent(`To: ${warmHandoff.ref.name}\n${warmHandoff.ref.email}\n\n${warmHandoff.note}\n\n—\n${COACH_NAME}, ${COACH_TITLE}\n${COACH_PHONE} | ${COACH_EMAIL}`);
              window.open(`mailto:${warmHandoff.ref.email}?cc=${encodeURIComponent(COACH_EMAIL)}&subject=${sub}&body=${encodeURIComponent(warmHandoff.note||"")}`);
            }}><span>✉️ Send Email</span></button>
            <button className="btn btn-ghost btn-sm" onClick={()=>navigator.clipboard?.writeText(warmHandoff.note).then(()=>showToast("📋 Copied!"))}>📋 Copy</button>
            <button className="btn btn-ghost btn-sm" style={{marginLeft:"auto"}} onClick={()=>setWarmHandoff(null)}>✕ Close</button>

      <div style={{display:"flex",gap:6,flexWrap:"wrap",marginBottom:14}}>
        {cats.map(cat=><button key={cat} className="btn btn-ghost btn-sm" style={{borderColor:filter===cat?O+"66":"var(--bdr)",color:filter===cat?O:"var(--muted)"}} onClick={()=>setFilter(cat)}>{cat==="all"?"All Categories":cat}</button>)}
      </div>

      {filtered.map(ref=>(
        <div key={ref.id} className="ref-card">
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:6}}>

              <div style={{fontSize:12,fontWeight:700,color:"#e6edf3"}}>{ref.name}</div>
              <div style={{fontSize:10,color:"#8b949e"}}>{ref.loc} · <a href={`tel:${ref.phone.replace(/[^0-9]/g,'')}`} style={{color:O}}>{ref.phone}</a></div>

      ))}
    </div>
  );
