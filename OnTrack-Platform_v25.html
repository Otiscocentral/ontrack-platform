<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --navy:#001a3a;--navy2:#002147;--orange:#F76900;--orange2:#ff9a3c;
  --bg:#09101e;--s1:#101828;--s2:#162034;--s3:#1e2d47;--s4:#253554;
  --bdr:#2a3a5c;--txt:#e2eaf8;--muted:#6b82a8;--dim:#4a5f84;
  --green:#10b981;--red:#ef4444;--blue:#3b82f6;--purple:#8b5cf6;--yellow:#f59e0b;
}
body{background:var(--bg);color:var(--txt);font-family:'DM Sans',sans-serif;min-height:100vh;overflow-x:hidden}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:var(--s2)}::-webkit-scrollbar-thumb{background:var(--orange);border-radius:2px}
input,textarea,select{outline:none;color-scheme:dark;font-family:'DM Sans',sans-serif}
a{color:inherit;text-decoration:none}
button{font-family:'DM Sans',sans-serif;cursor:pointer}

@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes flashPulse{0%,100%{opacity:1;box-shadow:0 0 0 0 var(--orange)}50%{opacity:.85;box-shadow:0 0 0 6px transparent}}
@keyframes slideLeft{from{transform:translateX(20px);opacity:0}to{transform:translateX(0);opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.15}}
@keyframes ripple{0%{transform:scale(1);opacity:.6}100%{transform:scale(2.4);opacity:0}}
@keyframes glow{0%,100%{box-shadow:0 0 12px var(--orange)44}50%{box-shadow:0 0 30px var(--orange)88}}

.fade{animation:fadeIn .3s ease both}
.slide{animation:slideLeft .25s ease both}
.spin{animation:spin 1s linear infinite}
.flash-btn{animation:flashPulse 1.2s ease infinite,glow 1.4s ease infinite}

/* ─── LAYOUT ─── */
.app-shell{display:flex;flex-direction:column;min-height:100vh}

.top-bar{
  background:linear-gradient(90deg,var(--navy) 0%,#001535 100%);
  border-bottom:2px solid var(--orange)55;
  height:52px;display:flex;align-items:center;padding:0 20px;
  justify-content:space-between;position:sticky;top:0;z-index:200;
  flex-shrink:0;
}
.top-brand{display:flex;align-items:center;gap:10px}
.top-badge{background:var(--orange);color:#fff;font-size:10px;font-weight:700;letter-spacing:.8px;padding:3px 9px;border-radius:4px}
.top-title{font-family:'DM Serif Display',serif;font-size:16px;color:var(--txt)}
.top-right{display:flex;align-items:center;gap:12px}
.top-contact{font-size:11px;color:var(--muted);display:flex;gap:14px}
.top-contact a{color:var(--muted);display:flex;align-items:center;gap:4px;transition:color .2s}
.top-contact a:hover{color:var(--orange)}

.coach-shell{display:flex;flex:1;overflow:hidden}
.sidebar{
  width:250px;flex-shrink:0;background:var(--s1);border-right:1px solid var(--bdr);
  display:flex;flex-direction:column;overflow-y:auto;
}
.main-area{flex:1;overflow-y:auto;padding:20px}

/* ─── SIDEBAR ─── */
.sb-section{padding:14px 14px 6px;font-size:10px;color:var(--dim);font-weight:700;letter-spacing:1px;text-transform:uppercase;border-top:1px solid var(--bdr)}
.sb-section:first-child{border-top:none}
.sb-btn{
  display:flex;align-items:center;gap:9px;padding:8px 14px;
  background:transparent;border:none;color:var(--muted);width:100%;
  font-size:12px;font-weight:500;transition:all .15s;border-radius:0;
  cursor:pointer;text-align:left;
}
.sb-btn:hover{background:var(--s3);color:var(--txt)}
.sb-btn.active{background:var(--orange)18;color:var(--orange);border-left:3px solid var(--orange)}
.sb-btn .ico{font-size:15px;flex-shrink:0;width:18px;text-align:center}
.sb-badge{margin-left:auto;background:var(--orange);color:#fff;font-size:9px;font-weight:700;border-radius:10px;padding:1px 6px}

/* ─── CARDS ─── */
.card{background:var(--s1);border:1px solid var(--bdr);border-radius:12px;padding:18px;margin-bottom:14px}
.card-title{font-family:'DM Serif Display',serif;font-size:15px;color:var(--txt);margin-bottom:4px;display:flex;align-items:center;gap:8px}
.card-sub{font-size:11px;color:var(--muted);margin-bottom:14px}

/* ─── FORM ─── */
.lbl{font-size:10px;color:var(--muted);font-weight:700;letter-spacing:.5px;text-transform:uppercase;margin-bottom:4px}
.inp{background:var(--s2);border:1px solid var(--bdr);color:var(--txt);border-radius:7px;padding:9px 12px;font-size:12px;width:100%;transition:border-color .15s}
.inp:focus{border-color:var(--orange)77}
.inp::placeholder{color:var(--dim)}
.ta{resize:vertical;min-height:80px;line-height:1.65}
.sel{cursor:pointer;appearance:none}
.fg{margin-bottom:12px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}

/* ─── BUTTONS ─── */
.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 18px;border-radius:8px;border:none;font-size:12px;font-weight:600;font-family:'DM Sans',sans-serif;transition:all .2s;cursor:pointer}
.btn-primary{background:linear-gradient(135deg,var(--orange),var(--orange2));color:#fff;box-shadow:0 3px 12px var(--orange)33}
.btn-primary:hover{transform:translateY(-1px);box-shadow:0 5px 20px var(--orange)44}
.btn-primary:disabled{background:var(--bdr);box-shadow:none;transform:none;cursor:not-allowed;opacity:.6}
.btn-ghost{background:transparent;border:1px solid var(--bdr);color:var(--muted)}
.btn-ghost:hover{border-color:var(--orange)66;color:var(--orange)}
.btn-green{background:linear-gradient(135deg,#059669,var(--green));color:#fff}
.btn-blue{background:linear-gradient(135deg,#1d4ed8,var(--blue));color:#fff}
.btn-red{background:linear-gradient(135deg,#b91c1c,var(--red));color:#fff}
.btn-sm{padding:5px 12px;font-size:11px;border-radius:6px}
.btn-xs{padding:3px 8px;font-size:10px;border-radius:5px}

/* ─── STUDENT ROSTER ─── */
.roster-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.student-card{
  background:var(--s1);border:1px solid var(--bdr);border-radius:10px;
  padding:12px;cursor:pointer;transition:all .2s;position:relative;
}
.student-card:hover{border-color:var(--orange)55;transform:translateY(-2px);box-shadow:0 4px 16px rgba(0,0,0,.3)}
.student-card.active{border-color:var(--orange);background:var(--orange)0d}
.sc-num{position:absolute;top:8px;right:10px;font-size:9px;color:var(--dim);font-weight:700}
.sc-avatar{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--orange),var(--orange2));display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:#fff;margin-bottom:8px}
.sc-name{font-size:13px;font-weight:700;color:var(--txt);margin-bottom:2px}
.sc-meta{font-size:10px;color:var(--muted)}
.sc-tag{display:inline-block;font-size:9px;font-weight:700;border-radius:4px;padding:1px 6px;margin-top:5px}
.sc-empty{border-style:dashed;opacity:.45}
.sc-empty:hover{opacity:.7}
.unread-dot{position:absolute;top:10px;left:10px;width:8px;height:8px;border-radius:50%;background:var(--orange);animation:flashPulse 1s infinite}

/* ─── MESSAGES ─── */
.msg-card{
  background:var(--s2);border:1px solid var(--bdr);border-radius:9px;
  padding:12px 14px;margin-bottom:8px;transition:background .15s;
}
.msg-card.unread{border-color:var(--orange)44;background:var(--orange)08}
.msg-card:hover{background:var(--s3)}

/* ─── COACH MAIL BANNER ─── */
.coach-mail-banner{
  background:linear-gradient(135deg,var(--orange)22,var(--orange)11);
  border:2px solid var(--orange);border-radius:12px;
  padding:14px 18px;margin-bottom:16px;
  display:flex;align-items:center;gap:12px;
  animation:glow 1.5s ease infinite;
  cursor:pointer;
}
.mail-dot{width:12px;height:12px;border-radius:50%;background:var(--orange);animation:blink 1s ease infinite;flex-shrink:0}

/* ─── STUDENT TABS ─── */
.stab-bar{display:flex;border-bottom:1px solid var(--bdr);margin-bottom:18px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;gap:0}
.stab{padding:8px 14px;background:none;border:none;color:var(--muted);font-size:12px;font-weight:500;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;transition:all .15s}
.stab.active{color:var(--orange);border-bottom:3px solid var(--orange);font-weight:700;background:var(--orange)08}

/* ─── LOGIN ─── */
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 0%,#001535 0%,var(--bg) 70%)}
.login-box{background:var(--s1);border:1px solid var(--bdr);border-radius:18px;padding:36px;width:400px;max-width:95vw;animation:fadeIn .4s ease}
.login-logo{text-align:center;margin-bottom:24px}
.login-badge{display:inline-block;background:var(--orange);color:#fff;font-size:11px;font-weight:700;letter-spacing:1px;padding:4px 12px;border-radius:5px;margin-bottom:8px}
.login-title{font-family:'DM Serif Display',serif;font-size:24px;margin-bottom:4px}
.login-sub{font-size:12px;color:var(--muted)}
.login-footer{font-size:11px;color:var(--muted);text-align:center;margin-top:16px}

/* ─── SETUP ─── */
.setup-wrap{min-height:100vh;background:radial-gradient(ellipse at 50% 0%,#001535 0%,var(--bg) 70%);padding:40px 20px;overflow-y:auto}
.setup-box{max-width:700px;margin:0 auto;animation:fadeIn .4s ease}
.setup-step{background:var(--s1);border:1px solid var(--bdr);border-radius:12px;padding:20px;margin-bottom:14px}
.setup-step-num{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;background:var(--orange);color:#fff;font-size:11px;font-weight:700;flex-shrink:0;margin-right:8px}
.code-block{background:#060d18;border:1px solid var(--bdr);border-radius:8px;padding:14px;font-family:monospace;font-size:11px;color:#7dd3fc;line-height:1.7;overflow-x:auto;margin:10px 0}
.code-comment{color:var(--dim)}

/* ─── SHARE ─── */
.share-email-row{display:flex;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--bdr)}

/* ─── MISC ─── */
.tag{display:inline-flex;align-items:center;gap:3px;font-size:9px;font-weight:700;border-radius:4px;padding:2px 7px}
.status-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.divider{border:none;border-top:1px solid var(--bdr);margin:16px 0}
.empty-state{text-align:center;padding:40px 20px;color:var(--muted)}
.empty-state .es-ico{font-size:40px;margin-bottom:10px;opacity:.3}
.toast{position:fixed;top:60px;right:16px;z-index:9999;background:var(--s1);border:1px solid var(--green)55;border-radius:10px;padding:10px 16px;font-size:12px;font-weight:600;color:var(--green);box-shadow:0 6px 24px rgba(0,0,0,.5);animation:fadeIn .25s ease}

/* ─── SESSION NOTE RECORDER ─── */
.rec-btn{width:56px;height:56px;border-radius:50%;border:none;background:linear-gradient(135deg,var(--red),#9b1c1c);color:#fff;font-size:22px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .2s;position:relative}
.rec-btn:hover{transform:scale(1.06)}
.rec-btn.active{background:linear-gradient(135deg,#9b1c1c,#7f1d1d)}
.rec-ripple{position:absolute;inset:-8px;border-radius:50%;border:2px solid var(--red);animation:ripple 1.1s ease infinite}
.progress-ring-wrap{position:relative;width:90px;height:90px;margin:0 auto 10px}
.prog-text{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:10px;color:var(--muted)}

/* RESPONSIVE */
@media(max-width:640px){
  .sidebar{width:200px}
  .roster-grid{grid-template-columns:1fr 1fr}
  .g3{grid-template-columns:1fr 1fr}
}
/* ─── COPYRIGHT FOOTER ─── */
.copyright-footer{
  background:linear-gradient(90deg,#060d18 0%,#0a1628 50%,#060d18 100%);
  border-top:1px solid var(--bdr);
  padding:14px 24px;
  text-align:center;
  font-size:10px;
  color:var(--dim);
  letter-spacing:.4px;
  line-height:1.8;
  flex-shrink:0;
}
.copyright-footer strong{color:var(--muted);font-weight:600;}
.copyright-footer .cf-mark{color:var(--orange);font-weight:700;margin-right:4px;}

/* ─── MOS COMPONENT ANIMATIONS ─── */
@keyframes fadeUp{from{transform:translateY(10px);opacity:0}to{transform:translateY(0);opacity:1}}
@keyframes noteIn{from{transform:scale(0.85) rotate(-3deg);opacity:0}to{transform:scale(1) rotate(0deg);opacity:1}}
.goal-card{animation:fadeUp 0.25s ease both}
.sticky-note{animation:noteIn 0.2s ease both}

/* ─── THINKVERSATION / NEW FEATURE STYLES ─── */
.phase-tab{display:flex;align-items:center;gap:8px;padding:10px 14px;border-radius:8px;cursor:pointer;border:1px solid var(--bdr);transition:all .2s;font-size:12px;font-weight:600;background:var(--s2)}
.phase-tab.active{border-color:var(--orange);background:var(--orange)18;color:var(--orange)}
.phase-tab.done{border-color:var(--green)88;background:var(--green)18;color:var(--green)}
.phase-badge{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;flex-shrink:0}
.ev-pill{display:inline-flex;align-items:center;gap:3px;font-size:8px;font-weight:700;background:var(--purple)18;border:1px solid var(--purple)33;color:var(--purple);border-radius:10px;padding:2px 7px;margin:2px}
.slider-wrap{display:flex;align-items:center;gap:10px}
.slider-wrap input[type=range]{flex:1;accent-color:var(--orange);height:4px}
.slider-num{width:24px;text-align:center;font-size:13px;font-weight:800;color:var(--orange)}
.if-then-row{background:var(--s2);border:1px solid var(--bdr);border-radius:10px;padding:12px;margin-bottom:8px;border-left:3px solid var(--orange)}
.gas-scale{display:grid;grid-template-columns:minmax(80px,110px) 1fr auto;gap:6px;align-items:center;padding:6px 0;border-bottom:1px solid var(--bdr)}
.gas-active{background:var(--orange)18;border-radius:6px;padding:4px 8px}
.arc-phase{flex:1;text-align:center;padding:8px 4px;border-radius:6px;cursor:pointer;transition:all .2s;border:1px solid var(--bdr);font-size:9px;font-weight:700}
.arc-phase.current{background:var(--orange);color:#fff;border-color:var(--orange)}
.arc-phase.done{background:var(--green)18;border-color:var(--green)44;color:var(--green)}
.mmm-card{background:var(--s2);border-radius:10px;padding:14px;border:1px solid var(--bdr);margin-bottom:10px}
.ef-domain{display:grid;grid-template-columns:130px 1fr 30px;gap:8px;align-items:center;margin-bottom:8px}
.intake-section{background:var(--s2);border:1px solid var(--bdr);border-radius:10px;padding:14px;margin-bottom:12px}
.package-stat{background:var(--s1);border:1px solid var(--bdr);border-radius:8px;padding:10px;text-align:center}
.ref-card{background:var(--s2);border:1px solid var(--bdr);border-radius:8px;padding:10px 12px;margin-bottom:6px}
.checkin-q{background:var(--s2);border:1px solid var(--bdr);border-radius:8px;padding:10px 12px;margin-bottom:8px}
.sdt-item{display:grid;grid-template-columns:120px 1fr 24px;gap:8px;align-items:center;margin-bottom:8px}

:focus-visible{outline:2px solid var(--orange);outline-offset:2px;border-radius:4px}
</style>

/* ─── Shared AI call helper ───
   Routes every Claude request through the Cloud Function proxy instead of
   calling api.anthropic.com directly from the browser. The proxy holds the
   real key server-side and verifies the caller's Firebase ID token, so the
   key is never shipped to the client and the endpoint can't be called by
   random visitors. Every call site below should use this instead of fetch(). */
async function callClaude(payload,signal){
  if(!auth||!auth.currentUser)throw new Error("You must be signed in to use AI features.");
  const idToken=await auth.currentUser.getIdToken();
  const res=await fetch(CLAUDE_PROXY_URL,{
    ...(signal?{signal}:{}),
    method:"POST",
    headers:{"Content-Type":"application/json","Authorization":`Bearer ${idToken}`},
    body:JSON.stringify(payload)
  });
  if(res.status===403)throw new Error("This AI feature is available to your coach only.");
  return res;
}

/* ═══════════════════════════════════════════════════════════
   FILE SYSTEM — IndexedDB helpers to persist folder handle
   across page reloads (localStorage can't store FS handles)
═══════════════════════════════════════════════════════════ */
const OT_IDB_NAME="OnTrackNotesDB";
const OT_IDB_STORE="settings";
const OT_FOLDER_KEY="noteFolderHandle";

function _openIDB(){
  return new Promise((res,rej)=>{
    const req=indexedDB.open(OT_IDB_NAME,1);
    req.onupgradeneeded=e=>e.target.result.createObjectStore(OT_IDB_STORE);
    req.onsuccess=e=>res(e.target.result);
    req.onerror=()=>rej(req.error);
  });
}
async function idbGet(key){
  try{const db=await _openIDB();return new Promise((res)=>{const tx=db.transaction(OT_IDB_STORE,"readonly");const r=tx.objectStore(OT_IDB_STORE).get(key);r.onsuccess=()=>res(r.result??null);r.onerror=()=>res(null);});}catch{return null;}
}
async function idbSet(key,val){
  try{const db=await _openIDB();return new Promise((res)=>{const tx=db.transaction(OT_IDB_STORE,"readwrite");tx.objectStore(OT_IDB_STORE).put(val,key);tx.oncomplete=()=>res(true);tx.onerror=()=>res(false);});}catch{return false;}
}

async function buildNoteText(note){
  const line60="═".repeat(60);const line40="─".repeat(40);
  const phases=[["landPhase","🌊 LAND — Arrive & Calibrate"],["noticePhase","🔍 NOTICE — Since We Last Met"],["connectPhase","🔗 CONNECT — What Matters & Why"],["discoverPhase","💡 DISCOVER — What's Possible"],["commitPhase","🎯 COMMIT — The Action Plan"]];
  const closing=[["sessionOutcomes","📈 Session Outcomes"],["nextSessionFocus","🔭 Next Session Focus"],["referrals","🏥 Referrals"]];
  const coach=[["strengthsObserved","⭐ Strengths Observed"],["coachObservations","🔒 Coach Observations"],["coachingCompetencies","🎓 ICF Competencies"]];
  const blk=(pairs)=>pairs.map(([k,l])=>note[k]&&note[k]!=="Not documented this session"?`${l}\n${line40}\n${note[k]}\n`:"").filter(Boolean).join("\n");
  return [line60,"ONTRACK AT SU — COACHING SESSION NOTE","Thinkversation™ Framework · Focused Solutions LLC",line60,
    `Coach: ${COACH_NAME}, ${COACH_TITLE}`,
    `Student: ${note.student||"—"}  |  Session #${note.num||"—"}  |  ${note.date||""}  |  ${note.dur||"??"} min  |  ${note.mode||"—"}`,
    line60,"","— COACHING SESSION —",line40,"",blk(phases),
    line60,"","— OUTCOMES & PLANNING —",line40,"",blk(closing),
    line60,"","— COACH'S RECORD (CONFIDENTIAL) —",line40,"",blk(coach),
    line60,`CONFIDENTIAL — FERPA-protected · © ${new Date().getFullYear()} ${COACH_NAME} & Focused Solutions LLC`,line60
  ].join("\n");
}

async function writeNoteToFolder(folderHandle,note){
  if(!folderHandle)return null;
  try{
    // Re-verify permission (may have expired between sessions)
    const perm=await folderHandle.requestPermission({mode:"readwrite"});
    if(perm!=="granted")return null;
    // Month subfolder: 2026-05
    const monthStr=(note.date||new Date().toISOString().slice(0,10)).slice(0,7);
    const monthDir=await folderHandle.getDirectoryHandle(monthStr,{create:true});
    // Filename: OnTrack_Maria_Session4_2026-05-24.txt
    const firstName=(note.student||"Student").split(" ")[0].replace(/[^a-zA-Z0-9]/g,"");
    const sessPart=note.num?`Session${note.num}_`:"";
    const datePart=note.date||new Date().toISOString().slice(0,10);
    const fileName=`OnTrack_${firstName}_${sessPart}${datePart}.txt`;
    const fileHandle=await monthDir.getFileHandle(fileName,{create:true});
    const writable=await fileHandle.createWritable();
    const text=await buildNoteText(note);
    await writable.write(text);
    await writable.close();
    return fileName;
  }catch(e){console.error("writeNoteToFolder:",e);return null;}
}

function LoginScreen(){
  const [email,setEmail]=useState("");
  const [pass,setPass]=useState("");
  const [isNew,setIsNew]=useState(false);
  const [err,setErr]=useState("");
  const [loading,setLoading]=useState(false);
  const [showPwd,setShowPwd]=useState(false);

  const submit=async()=>{
    if(!email||!pass){setErr("Enter email and password.");return;}
    setLoading(true);setErr("");
    try{
      const cleanEmail=email.trim().toLowerCase();
      if(isNew){
        await auth.createUserWithEmailAndPassword(cleanEmail,pass);
      }else{
        await auth.signInWithEmailAndPassword(cleanEmail,pass);
      }
    }catch(e){
      setErr(e.code==="auth/wrong-password"||e.code==="auth/invalid-credential"?"Incorrect email or password — please try again"
        :e.code==="auth/user-not-found"?"Account not found — try 'Create Account'."
        :e.code==="auth/email-already-in-use"?"Account already exists — sign in instead."
        :e.code==="auth/weak-password"?"Password must be at least 6 characters."
        :e.code==="auth/invalid-email"?"Enter a valid email address."
        :e.code==="auth/too-many-requests"?"Too many attempts — wait before retrying"
        :e.message||"Login failed. Try again.");
    }finally{setLoading(false);}
  };

  return(
    <div className="login-wrap">
      <div className="login-box">
        <div className="login-logo">
          <div className="login-badge">OnTrack at SU</div>
          <div style={{fontSize:10,color:"var(--muted)",marginTop:4,marginBottom:8}}>Focused Solutions LLC · ICF-Certified ADHD Coaching</div>
          <div className="login-title" style={{fontFamily:"'DM Serif Display',serif"}}>Coaching Platform</div>
          <div className="login-sub">{COACH_NAME} · {COACH_TITLE}</div>
        </div>
        <div className="fg">
          <div className="lbl">SU Email Address</div>
          <input className="inp" type="email" placeholder="your@syr.edu" value={email} onChange={e=>setEmail(e.target.value)} onKeyDown={e=>e.key==="Enter"&&submit()}/>
        </div>
        <div className="fg" style={{position:"relative"}}>
          <div className="lbl">Password</div>
          <input className="inp" type={showPwd?"text":"password"} placeholder="Password" value={pass} onChange={e=>setPass(e.target.value)} onKeyDown={e=>e.key==="Enter"&&submit()}/>
        </div>
        {err&&<div style={{fontSize:11,color:"var(--red)",marginBottom:10,background:"var(--red)11",border:"1px solid var(--red)33",borderRadius:6,padding:"6px 10px"}}>{err}</div>}
        <button className="btn btn-primary" style={{width:"100%",justifyContent:"center",marginBottom:10}} onClick={submit} disabled={loading}>
          {loading?<span className="spin" style={{fontSize:14}}>⟳</span>:null}
          {isNew?"Create Account":"Sign In"}
        </button>
          <button type="button" style={{fontSize:10,color:"var(--muted)",background:"transparent",border:"none",cursor:"pointer",padding:"4px 0",display:"block",marginTop:6}} onClick={()=>{
            if(!email.trim()){setErr("Enter your email first");return;}
            auth&&auth.sendPasswordResetEmail(email.trim().toLowerCase()).then(()=>setErr("✅ Reset email sent — check your inbox")).catch(e=>setErr(e.message||"Reset failed"));
          }}>🔑 Forgot password?</button>
        <div style={{textAlign:"center"}}>
          <button className="btn btn-ghost btn-sm" onClick={()=>{setIsNew(!isNew);setErr("");}}>
            {isNew?"Already have an account? Sign In":"First time? Create Account"}
          </button>
        </div>
        <div className="login-footer">
          📱 {COACH_PHONE} &nbsp;·&nbsp; ✉️ {COACH_EMAIL}
        </div>
      </div>
    </div>
  );
}

/* ═══════════════════════════════════════════════════════════
   FOLLOW-UP EMAIL — MODAL COMPONENT + AI GENERATOR
   Renders a preview/edit overlay; opens student email via mailto
═══════════════════════════════════════════════════════════ */
async function generateFollowUpEmail(sd,studentName,sessionDate,showToast,signal=null){
  if(!AI_CONFIGURED){showToast("⚠️ Claude proxy not configured — see Step 3 in the file");return null;}
  const sys=`You are writing a weekly coaching follow-up for an ICF-certified academic coach (OnTrack program, Syracuse University) for a college student with ADHD or a learning difference.

Return a single JSON object with EXACTLY these two keys — no markdown, no preamble, no code fences:

{
  "emailBody": "the full email text — warm, personal, strength-based — including opening, what we worked on, commitments, next session prep, encouraging close, and coach signature/footer. Do NOT include the practice activities here — end right before them.",
  "activities": [
    {
      "title": "Name of the CBT/coaching technique",
      "connection": "1-2 sentences connecting THIS SPECIFIC technique to what happened in today's session for THIS student",
      "what": "Clear step-by-step instructions — 2-4 sentences. Concrete, specific, actionable.",
      "when": "Specific implementation intention: exact day(s), time, and location. E.g. Tuesday and Thursday at 7pm at your desk. Never vague.",
      "duration": "Realistic time in minutes. E.g. 10 minutes. Keep it achievable for ADHD.",
      "barrier": "One realistic obstacle THIS specific student might face based on the session content",
      "workaround": "Specific IF-THEN response: If [barrier], then [specific alternative action]. Make it concrete.",
      "evidence": "Brief citation line. E.g. Gollwitzer (1999) Implementation Intentions · Safren, Otto & Sprich (2010) CBT for Adult ADHD"
    },
    {second activity — same structure, different technique and different focus area}
  ]
}

TECHNIQUE SELECTION — choose the 2 most relevant based on the session:
Thought Record (negative self-talk, shame, distorted thinking) · Behavioral Activation (low energy, mood, motivation) · Cognitive Restructuring (all-or-nothing beliefs) · Self-Monitoring Log (tracking a pattern) · Worry Postponement (anxiety, rumination) · Activity Scheduling (procrastination, initiation) · Problem-Solving Steps (concrete stuck point) · Values Clarification (disconnected motivation) · Mindful Attention Practice (attention regulation, grounding) · Exposure Hierarchy (task/situation avoidance)

EMAIL TONE: Personal, warm, strength-based. Use first name. End emailBody with full coach signature and confidentiality footer.`;

  const msg=`Write a follow-up for this coaching session.
Student: ${studentName}  |  Session date: ${sessionDate}

LAND: ${sd.landPhase||sd.preSessionCheckin||"Not documented"}
NOTICE: ${sd.noticePhase||"Not documented"}
CONNECT: ${sd.connectPhase||"Not documented"}
DISCOVER: ${sd.discoverPhase||sd.strategiesIdentified||"Not documented"}
COMMIT: ${sd.commitPhase||sd.actionSteps||"Not documented"}
Strengths observed: ${sd.strengthsObserved||"Not documented"}
Session outcomes: ${sd.sessionOutcomes||"Not documented"}
Next session focus: ${sd.nextSessionFocus||"Not documented"}
Referrals: ${sd.referrals||"None"}

Coach: ${COACH_NAME}, ${COACH_TITLE} | ${COACH_PHONE} | ${COACH_EMAIL}`;

  try{
    const res=await callClaude({model:MODEL,max_tokens:1400,system:sys,messages:[{role:"user",content:msg}]},signal);
    if(!res.ok)throw new Error(`API ${res.status}`);
    const d=await res.json();
    const raw=(d.content?.[0]?.text||"{}").replace(/```json|```/g,"").trim();
    let parsed={};
    try{parsed=JSON.parse(raw);}catch{try{const m=raw.match(/\{[\s\S]*\}/);parsed=m?JSON.parse(m[0]):{};}catch{}}
    const emailBody=parsed.emailBody||raw;
    const activities=Array.isArray(parsed.activities)?parsed.activities:[];
    // Build plain-text version of activities for email client
    const actText=activities.length?("\n\n━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n"+
      "THIS WEEK'S PRACTICE ACTIVITY\n"+"━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n\n"+
      activities.map((a,i)=>`${i+1}. ${a.title||"Practice"} — ${a.duration||""}\n`+
        `📅 When: ${a.when||""}\n`+
        `Why this week: ${a.connection||""}\n\n`+
        `${a.what||""}\n\n`+
        `🚧 If blocked: ${a.workaround||""}\n`+
        `📚 ${a.evidence||""}`
      ).join("\n\n─────────────────────────────\n\n")):"";
    return{text:emailBody+actText, emailBody, activities};
  }catch(e){
    if(e.name==="AbortError")return null;
    showToast("Email generation failed: "+(e.message||"check connection"));
    return null;
  }
}

function FollowUpEmailModal({studentName,studentEmail,studentUid="",sessionDate="",subject,body:initBody,activities=[],onClose,showToast}){
  const [body,setBody]=useState(initBody);
  const [toEmail,setToEmail]=useState(studentEmail||"");
  const [sending,setSending]=useState(false);
  const [sent,setSent]=useState(false);
  const [savingPortal,setSavingPortal]=useState(false);
  const [savedPortal,setSavedPortal]=useState(false);

  const saveToPortal=async()=>{
    if(!db){showToast("Firebase not connected");return;}
    if(!studentUid){showToast("⚠️ Student portal account not found — they may not have registered yet.");return;}
    if(savingPortal||savedPortal)return;
    setSavingPortal(true);
    try{
      // Store activities with completion tracking fields
      const storedActivities=(activities||[]).map(a=>({...a,completed:false,completedAt:null}));
      await db.collection("messages").add({
        to:studentUid,subject,body,type:"followUp",
        fromName:`${COACH_NAME}, ${COACH_TITLE}`,coachEmail:COACH_EMAIL,
        sessionDate:sessionDate||"",studentName:studentName||"",
        activities:storedActivities,
        timestamp:firebase.firestore.FieldValue.serverTimestamp(),
        readBy:[],
      });
      setSavedPortal(true);
      showToast("✅ Saved to student's portal — they'll see it in Coach Mail!");
    }catch(e){showToast("Portal save failed: "+e.message);}
    finally{setSavingPortal(false);}
  };

  const openMailto=()=>{
    setSending(true);
    try{
      const sub=encodeURIComponent(subject);
      const bod=encodeURIComponent(body);
      // mailto has ~2000 char body limit in some clients; clipboard is the reliable fallback
      const uri=`mailto:${encodeURIComponent(toEmail)}?subject=${sub}&body=${bod}`;
      if(uri.length<2000){
        window.open(uri);
        setSent(true);
      }else{
        navigator.clipboard?.writeText(`To: ${toEmail}
Subject: ${subject}

${body}`)
          .then(()=>{showToast("📋 Email copied to clipboard — paste into your email client!");setSent(true);})
          .catch((clipErr)=>{console.warn("Clipboard write failed:",clipErr);showToast("Copy failed — use the Send to Outlook button below");});
      }
    }catch(err){
      showToast("Failed to open email — try the Copy button.");
      console.error("openMailto error:",err);
    }finally{
      setSending(false);
    }
  };

  const copyAll=()=>{
    navigator.clipboard?.writeText(`To: ${toEmail}
Subject: ${subject}

${body}`)
      .then(()=>{showToast("📋 Copied — paste into any email client!");setSent(true);})
      .catch(()=>showToast("Copy unavailable"));
  };

  return(
    <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.75)",zIndex:9998,display:"flex",alignItems:"center",justifyContent:"center",padding:16}} onClick={e=>{if(e.target===e.currentTarget)onClose();}}>
      <div className="fade" style={{background:"var(--s1)",border:`2px solid ${O}55`,borderRadius:16,width:"100%",maxWidth:660,maxHeight:"90vh",display:"flex",flexDirection:"column",boxShadow:"0 24px 80px rgba(0,0,0,0.8)"}}>
        <div style={{background:`linear-gradient(135deg,${O}22,${O}08)`,borderBottom:`1px solid ${O}33`,padding:"14px 18px",display:"flex",justifyContent:"space-between",alignItems:"center",borderRadius:"14px 14px 0 0",flexShrink:0}}>
          <div>
            <div style={{fontSize:13,fontWeight:700,color:O}}>📧 Student Follow-Up Email</div>
            <div style={{fontSize:10,color:"var(--muted)",marginTop:2}}>AI-generated · Review and edit before sending · Does not send automatically</div>
          </div>
          <button onClick={onClose} style={{background:"transparent",border:"none",color:"var(--muted)",cursor:"pointer",fontSize:18,lineHeight:1}}>✕</button>
        </div>
        <div style={{padding:"12px 18px 0",flexShrink:0}}>
          <div style={{display:"grid",gridTemplateColumns:"auto 1fr",gap:6,alignItems:"center",marginBottom:8}}>
            <div style={{fontSize:11,fontWeight:700,color:"var(--muted)",width:56}}>To:</div>
            <input className="inp" type="email" value={toEmail} onChange={e=>setToEmail(e.target.value)}
              placeholder="student@syr.edu" style={{fontSize:12}}/>
          </div>
          <div style={{display:"grid",gridTemplateColumns:"auto 1fr",gap:6,alignItems:"center",marginBottom:10}}>
            <div style={{fontSize:11,fontWeight:700,color:"var(--muted)",width:56}}>Subject:</div>
            <div style={{fontSize:12,color:"var(--txt)",background:"var(--s2)",border:"1px solid var(--bdr)",borderRadius:7,padding:"8px 12px"}}>{subject}</div>
          </div>
          <div style={{fontSize:10,color:"var(--muted)",marginBottom:6}}>Message — review carefully before sending. Edit freely below.</div>
        </div>
        <div style={{padding:"0 18px",flex:1,overflow:"hidden",display:"flex",flexDirection:"column"}}>
          <textarea
            spellCheck={true} data-gramm={true}
            value={body}
            onChange={e=>setBody(e.target.value)}
            style={{flex:1,background:"var(--s2)",border:`1px solid var(--bdr)`,color:"var(--txt)",borderRadius:8,padding:12,fontSize:12,fontFamily:"inherit",lineHeight:1.75,resize:"none",outline:"none",minHeight:280}}
          />
        <div style={{fontSize:9,color:"var(--muted)",textAlign:"right",marginTop:3}}>{body.length} chars{body.length>1800&&<span style={{color:"var(--yellow)",marginLeft:6}}>⚠️ Very long</span>}</div>
        </div>
        <div style={{padding:"8px 18px 0",flexShrink:0}}>
          <div style={{background:"var(--blue)12",border:"1px solid var(--blue)33",borderRadius:7,padding:"7px 12px",fontSize:10,color:"var(--muted)",lineHeight:1.6}}>
            ⚠️ This email is for the <strong style={{color:"var(--txt)"}}>student only</strong>. It does not include confidential coach observations or clinical notes. Verify the recipient email before sending.
          </div>
        </div>
        <div style={{padding:"12px 18px 16px",display:"flex",gap:8,flexWrap:"wrap",flexShrink:0}}>
          {/* Portal save status */}
          <div style={{width:"100%",marginBottom:6,padding:"7px 12px",background:savedPortal?"var(--green)12":"var(--s2)",border:`1px solid ${savedPortal?"var(--green)44":"var(--bdr)"}`,borderRadius:7,display:"flex",alignItems:"center",gap:8}}>
            <span style={{fontSize:13}}>{savedPortal?"✅":"📱"}</span>
            <div style={{flex:1,fontSize:11}}>
              {savedPortal
                ?<span style={{color:"var(--green)",fontWeight:700}}>Saved to {studentName?.split(" ")[0]||"student"}'s portal — visible in their Coach Mail tab now</span>
                :<span style={{color:"var(--muted)"}}>{studentUid?"Ready to save to student portal":"Student portal unavailable — student may not be registered yet"}</span>
              }
            </div>
            <button className="btn btn-green btn-sm" onClick={saveToPortal} disabled={!studentUid||savingPortal||savedPortal} style={{opacity:!studentUid?0.4:1}}>
              {savingPortal?"Saving...":savedPortal?"✅ In Portal":"💾 Save to Portal"}
            </button>
          </div>
          {sent&&<div style={{fontSize:12,color:"var(--green)",fontWeight:700,display:"flex",alignItems:"center",gap:6}}>✅ Email opened / copied!</div>}
          <button className="btn btn-primary" onClick={openMailto} disabled={!toEmail.trim()||sending} title="Open in your default email client">
            {sending?"Opening...":"✉️ Open in Email Client"}
          </button>
          <button className="btn btn-ghost btn-sm" onClick={copyAll} title="Copy entire email to clipboard">📋 Copy</button>
          <button className="btn btn-ghost btn-sm" style={{marginLeft:"auto"}} onClick={onClose}>Close</button>
        </div>
      </div>
    </div>
  );
}

/* ═══════════════════════════════════════════════════════════
   SESSION NOTE RECORDER (integrated from standalone tool)
═══════════════════════════════════════════════════════════ */
function SessionNotePanel({studentName,studentId,studentEmail="",coachEmail,onSaved,showToast}){
  const [sessionType,setSessionType]=useState("standard"); // "standard" | "thinkversation"
  const [step,setStep]=useState(1);
  const [isRec,setIsRec]=useState(false);
  const [recSeconds,setRecSeconds]=useState(0);
  const [pct,setPct]=useState(0);
  const [pctLabel,setPctLabel]=useState("");
  const [f,setF]=useState({student:studentName||"",sid:studentId||"",date:todayYMD(),num:"",dur:(()=>{try{return localStorage.getItem("snp_dur")||"50";}catch{return"50";}})(),mode:(()=>{try{return localStorage.getItem("snp_mode")||"In-Person";}catch{return"In-Person";}})(),agenda:"",checkin:"",notes:""});
  const [note,setNote]=useState({});
  const recRef=useRef(null);
  const isRecRef=useRef(false); // ref tracks live recording state for onend closure
  const finalRef=useRef("");
  const pctInt=useRef(null);
  const recTimerRef=useRef(null);
  const pctRef=useRef(0); // tracks current animated pct value for animPct closure
  const abortRef=useRef(null);
  const followUpAbortRef=useRef(null); // separate controller for triggerFollowUp // AbortController for in-flight generate() fetch
  // Feature state
  const [loadingPrev,setLoadingPrev]=useState(false);
  const [prevLoaded,setPrevLoaded]=useState(null); // {num,date} shown as banner
  const [savedNoteId,setSavedNoteId]=useState(null); // Firestore doc ID after save
  const [attested,setAttested]=useState(false);
  const [attesting,setAttesting]=useState(false);
  const [prepBrief,setPrepBrief]=useState("");
  const [loadingPrep,setLoadingPrep]=useState(false);
  const [showPrep,setShowPrep]=useState(false);
  const [followUpData,setFollowUpData]=useState(null); // {subject,body,studentEmail}
  const [generatingFollowUp,setGeneratingFollowUp]=useState(false);

  // Clean up all intervals on unmount
  useEffect(()=>()=>{clearInterval(pctInt.current);clearInterval(recTimerRef.current);isRecRef.current=false;recRef.current?.stop();abortRef.current?.abort();},[]);

  // Elapsed recording timer — ticks every second while isRec is true
  useEffect(()=>{
    if(isRec){
      recTimerRef.current=setInterval(()=>setRecSeconds(s=>s+1),1000);
    }else{
      clearInterval(recTimerRef.current);
    }
    return()=>clearInterval(recTimerRef.current);
  },[isRec]);

  const upd=(k,v)=>setF(p=>({...p,[k]:v}));

  const animPct=(target,label,dur)=>{
    clearInterval(pctInt.current);
    setPctLabel(label);
    let start=pctRef.current,steps=30,step2=0;
    pctInt.current=setInterval(()=>{
      step2++;const p=start+(target-start)*(step2/steps);
      const rounded=Math.round(p);pctRef.current=rounded;
      setPct(rounded);if(step2>=steps)clearInterval(pctInt.current);
    },dur/steps);
  };

  const fmtRecTime=(s)=>{
    const h=Math.floor(s/3600),m=Math.floor((s%3600)/60),sec=s%60;
    if(h>0)return`${h}:${String(m).padStart(2,"0")}:${String(sec).padStart(2,"0")}`;
    return`${String(m).padStart(2,"0")}:${String(sec).padStart(2,"0")}`;
  };

  const toggleRec=()=>{
    if(isRec){
      isRecRef.current=false; // set ref BEFORE stop() so onend sees it immediately
      recRef.current?.stop();
      setIsRec(false);
    }
    else{
      const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
      if(!SR){showToast("Voice requires Chrome or Edge");return;}
      setRecSeconds(0); // reset elapsed timer on each new recording
      const r=new SR();r.continuous=true;r.interimResults=true;r.lang="en-US";
      finalRef.current=f.notes||"";
      r.onstart=()=>setIsRec(true); // confirm recording actually started
      r.onresult=e=>{let iv="";
        for(let i=e.resultIndex;i<e.results.length;i++){
          const t=e.results[i][0].transcript;
          if(e.results[i].isFinal)finalRef.current+=(finalRef.current?"\n":"")+t;
          else iv=t;
        }
        upd("notes",finalRef.current+(iv?" "+iv:""));
      };
      r.onerror=e=>{
        // Fatal errors: stop recording completely and alert the user
        const fatal=["not-allowed","audio-capture","service-not-allowed"].includes(e.error);
        if(fatal){isRecRef.current=false;setIsRec(false);showToast(`🎤 Mic error: ${e.error} — check browser mic permissions`);}
        // Non-fatal (no-speech, network, aborted): onend fires and restarts automatically
      };
      r.onend=()=>{
        if(!isRecRef.current)return;
        try{r.start();} // reads ref, not stale closure
        catch(startErr){
          // Browsers can throw here if start() is called too soon after stop —
          // without this catch, the restart chain dies silently while the UI
          // keeps showing "Recording" with the timer still counting up.
          isRecRef.current=false;setIsRec(false);
          showToast("🎤 Voice recording stopped unexpectedly — click the mic to resume.");
        }
      };
      r.start();recRef.current=r;isRecRef.current=true;
      // Note: setIsRec(true) is called by r.onstart for accurate confirmation
    }
  };

  const generate=async()=>{
    abortRef.current?.abort(); // abort any in-flight generation
    if(!AI_CONFIGURED){showToast("⚠️ Claude proxy not configured — see Step 3 in the file");return;}
    if(!f.student.trim()){showToast("⚠️ Enter the student name before generating.");return;}
    if(!f.notes&&!f.agenda&&!f.checkin){showToast("Add session notes first");return;}
    // Stop recording cleanly before generating so the mic is released
    if(isRec){isRecRef.current=false;recRef.current?.stop();setIsRec(false);}
    setStep(2);animPct(25,"Analyzing notes...",600);
    const sys=`You are an expert ICF-certified coaching note writer for the OnTrack program at Syracuse University's Center for Disability Resources. This program provides individual coaching to neurodivergent college students (ADHD, ASD, learning differences, LD).

IMPORTANT: The raw notes below may be voice-dictated (containing filler words, incomplete sentences, repetition, or informal speech). Clean and interpret this content professionally. Extract meaning even from fragmented or conversational input.

Generate a complete structured coaching session note using the Thinkversation™ 5-phase framework (Focused Solutions LLC). Return ONLY valid JSON — no markdown, no preamble, no code fences. Use these exact keys:

PHASE 1 — LAND (Arrive & Calibrate):
- landPhase: Student's attentional state, body/brain/energy at session start, mood, what's been happening — include any self-reported readiness or what the student needed to feel present

PHASE 2 — NOTICE (Since We Last Met):
- noticePhase: What happened since the last session — wins (even small), patterns observed, FOLLOW-THROUGH on last session's commitments (what was attempted, completed, or abandoned and why), self-monitoring observations, what the student's mind has been telling them

PHASE 3 — CONNECT (What Matters & Why):
- connectPhase: How challenges or goals connect to the student's deeper values, purpose, and identity — strengths drawn upon, EF domains addressed (initiation, planning, working memory, time management, emotional regulation, inhibition, flexibility), meaning-making moments, narrative shifts

PHASE 4 — DISCOVER (What's Possible):
- discoverPhase: Options generated, strategies explored, what has worked before, cognitive ergonomics and environment considerations, barriers surfaced and reframed, importance or confidence ruler data if used, tools or frameworks introduced

PHASE 5 — COMMIT (The Action Plan):
- commitPhase: Specific commitments the student made, IF-THEN implementation intentions, accountability structure (exactly HOW the student will remember or track each commitment — phone reminders, calendar, body double, etc.), confidence level expressed, backup plans discussed

CLOSING FIELDS:
- sessionOutcomes: Overall progress and outcomes achieved this session — what shifted, what was resolved
- nextSessionFocus: Priority topics and agenda items to carry forward into the next session
- referrals: SU campus resources referenced, recommended, or formally referred (Barnes Center, CDR, tutoring, advisor, etc.) — write 'None this session' if none

CONFIDENTIAL COACH RECORD (not shared with student):
- strengthsObserved: Specific strengths, assets, and growth observed in this student this session — use strength-based language
- coachObservations: Clinical observations — affect, tone, engagement, avoidance patterns, risk indicators, coach hypotheses, concerns (FERPA-protected, coach-only)
- coachingCompetencies: ICF Core Competencies demonstrated this session (e.g. #5 Maintaining Presence, #6 Active Listening, #7 Evoking Awareness, #8 Facilitating Growth)

Write in professional third-person coaching language. Use bullet points (•) for lists within each field. Each phase should be substantive — 3-6 bullets or sentences minimum. Extract every relevant detail even from messy dictated notes. If a phase has genuinely no content in the notes, write 'Not documented this session.'`;
    const msg=`Student: ${f.student}${f.sid?" (ID: "+f.sid+")":""}\nSession #${f.num||"?"} | ${f.date} | ${f.dur} min | ${f.mode}\nAgenda: ${f.agenda||"(not documented)"}\nCheck-in: ${f.checkin||"(not documented)"}\nNotes:\n${f.notes}`;
    try{
      const ctrl=new AbortController();abortRef.current=ctrl;
      const res=await callClaude({model:MODEL,max_tokens:4096,system:sys,messages:[{role:"user",content:msg}]},ctrl.signal);
      if(!res.ok)throw new Error(`API ${res.status}`);
      animPct(65,"Structuring note...",800);
      const d=await res.json();const raw=d.content?.[0]?.text||"{}";
      animPct(90,"Formatting...",400);
      let parsed;try{parsed=JSON.parse(raw.replace(/```json|```/g,"").trim());}catch{try{const m=raw.match(/\{[\s\S]*\}/);parsed=m?JSON.parse(m[0]):{};} catch{parsed={};}}
      const EXPECTED_KEYS=["landPhase","noticePhase","connectPhase","discoverPhase","commitPhase","sessionOutcomes","nextSessionFocus","referrals","strengthsObserved","coachObservations","coachingCompetencies"];
      const safeFields=Object.fromEntries(EXPECTED_KEYS.filter(k=>k in parsed).map(k=>[k,parsed[k]]));
      setNote({...f,...safeFields});
      setTimeout(()=>{animPct(100,"Done!",200);setTimeout(()=>setStep(3),300);},300);
    }catch(e){
      clearInterval(pctInt.current); // stop animation on failure
      setPct(0);pctRef.current=0; // reset progress so next attempt starts clean
      if(e.name!=="AbortError"){showToast(`⚠️ Generation failed — ${e.message?.includes("401")?"invalid API key":e.message?.includes("429")?"rate limited, wait a moment":"check your connection"}`);}
    }finally{
      // Guarantee progress UI never freezes
      if(step!==3){setStep(1);setPct(0);pctRef.current=0;clearInterval(pctInt.current);}
    }
  };

  const [savingNote,setSavingNote]=useState(false);
  const [noteSaved,setNoteSaved]=useState(false);
  const [cleaning,setCleaning]=useState(false);
  const [saveFolder,setSaveFolder]=useState(null);   // FileSystemDirectoryHandle
  const [saveFolderName,setSaveFolderName]=useState(""); // display name

  // Load persisted folder handle on mount
  useEffect(()=>{
    idbGet(OT_FOLDER_KEY).then(async h=>{
      if(!h)return;
      try{
        // Verify permission is still queryable (don't prompt yet — that waits for save)
        const perm=await h.queryPermission({mode:"readwrite"});
        setSaveFolder(h);
        setSaveFolderName(h.name||"Saved Folder");
        if(perm!=="granted")setSaveFolderName((h.name||"Folder")+" (needs permission)");
      }catch{setSaveFolder(null);setSaveFolderName("");}
    });
  },[]);

  const chooseSaveFolder=async()=>{
    if(!window.showDirectoryPicker){showToast("⚠️ Folder saving requires Chrome or Edge");return;}
    try{
      const h=await window.showDirectoryPicker({mode:"readwrite",startIn:"desktop",id:"ontrack-notes"});
      setSaveFolder(h);setSaveFolderName(h.name||"Selected Folder");
      await idbSet(OT_FOLDER_KEY,h);
      showToast(`📁 Save folder set: ${h.name}`);
    }catch(e){if(e.name!=="AbortError")showToast("Folder selection failed: "+e.message);}
  };

  const cleanTranscript=async()=>{
    if(!AI_CONFIGURED){showToast("⚠️ Claude proxy not configured — see Step 3 in the file");return;}
    if(!f.notes.trim()){showToast("Nothing to clean — record or type notes first");return;}
    // Stop recording before cleaning so the full transcript is captured
    if(isRec){isRecRef.current=false;recRef.current?.stop();setIsRec(false);}
    const notesSnapshot=f.notes; // snapshot — compare after API returns
    setCleaning(true);
    try{
      const res=await callClaude({model:MODEL,max_tokens:4096,
          system:"You are a transcription editor. Clean up voice-dictated coaching notes: remove filler words (um, uh, like, you know), fix sentence structure, remove repetition, but preserve all specific details, names, dates, and coaching content. Return ONLY the cleaned text with no preamble.",
          messages:[{role:"user",content:"Clean this voice transcription:\n\n"+f.notes}]});
      if(!res.ok)throw new Error(`API ${res.status}`);
      const d=await res.json();
      const cleaned=d.content?.[0]?.text||f.notes;
      if(!cleaned){showToast("⚠️ AI returned empty response — your notes are preserved.");setCleaning(false);return;}
      // Only apply if notes haven't changed during the API call
      if(f.notes.trim()===notesSnapshot.trim()){
        upd("notes",cleaned);
        finalRef.current=cleaned;
        showToast("🧹 Transcript cleaned!");
      }else{
        showToast("⚠️ Notes changed during cleaning — result discarded. Try again.");
      }
    }catch(e){if(e.name!=="AbortError")showToast("Clean failed: "+(e.message||"check connection"));}
    finally{setCleaning(false);}
  };

  const saveNote=async()=>{
    if(!db){showToast("Firebase not connected");return;}
    if(savingNote)return;
    setSavingNote(true);
    try{
      const _ref=await db.collection("sessionNotes").add({
        studentSUID:f.sid||"",studentName:f.student.trim(),
        coachEmail,sessionDate:f.date,sessionNum:parseInt(f.num,10)||0,
        sessionData:{...f,...note,rawNotes:f.notes},createdAt:firebase.firestore.FieldValue.serverTimestamp()
      });
      setSavedNoteId(_ref.id);
      setNoteSaved(true);
      if(onSaved)onSaved();
      // ── Auto-write local file if folder is set ──
      if(saveFolder){
        const fileName=await writeNoteToFolder(saveFolder,note);
        if(fileName)showToast(`✅ Saved to Firebase + 📁 ${fileName}`);
        else showToast("✅ Saved to Firebase (local file write failed — check folder permission)");
      }else{
        showToast("✅ Session note saved to Firebase!");
      }
    }catch(e){showToast("Save failed: "+e.message);}
    finally{setSavingNote(false);}
  };

  const exportOutlook=()=>{
    const ln=(k,l)=>note[k]&&note[k]!=="Not documented this session"?`\n${l}\n${"─".repeat(40)}\n${note[k]}\n`:"";
    const body=`ONTRACK AT SU — COACHING SESSION NOTE\nThinkversation™ Framework · Focused Solutions LLC\n${"=".repeat(60)}\nCoach: ${COACH_NAME}, ${COACH_TITLE} | ${COACH_PHONE} | ${coachEmail}\nStudent: ${note.student||"—"}  |  Session #${note.num||"—"}  |  ${fmtDate(note.date)}  |  ${note.dur||"??"} min  |  ${note.mode||"—"}\n${"=".repeat(60)}\n\n— COACHING SESSION —${ln("landPhase","🌊 LAND — Arrive & Calibrate")}${ln("noticePhase","🔍 NOTICE — Since We Last Met")}${ln("connectPhase","🔗 CONNECT — What Matters & Why")}${ln("discoverPhase","💡 DISCOVER — What's Possible")}${ln("commitPhase","🎯 COMMIT — The Action Plan")}\n${"=".repeat(60)}\n\n— OUTCOMES & PLANNING —${ln("sessionOutcomes","📈 Session Outcomes")}${ln("nextSessionFocus","🔭 Next Session Focus")}${ln("referrals","🏥 Referrals")}\n${"=".repeat(60)}\n\n— COACH'S RECORD (CONFIDENTIAL) —${ln("strengthsObserved","⭐ Strengths Observed")}${ln("coachObservations","🔒 Coach Observations")}${ln("coachingCompetencies","🎓 ICF Competencies")}\n${"=".repeat(60)}\nCONFIDENTIAL — FERPA-protected · © ${new Date().getFullYear()} ${COACH_NAME} & Focused Solutions LLC`;
    const sub=encodeURIComponent(`OnTrack Session Note — ${note.student||"Student"} — Session #${note.num||"?"} — ${fmtDate(note.date)}`);
    window.open(`mailto:${coachEmail}?subject=${sub}&body=${encodeURIComponent(body)}`);
  };

  /* ── Follow-Up Email trigger (uses note state) ── */
  const triggerFollowUp=async()=>{
    const _abortCtrl=new AbortController();
    if(followUpAbortRef.current)followUpAbortRef.current.abort();
    followUpAbortRef.current=_abortCtrl;
    try{
      setGeneratingFollowUp(true);
      const result=await generateFollowUpEmail(note,note.student||f.student,fmtDate(note.date||f.date),showToast,_abortCtrl.signal);
      if(!result)return;
      let resolvedUid="";
      if(db&&studentEmail){
        try{
          const snap=await db.collection("roster").where("email","==",studentEmail.toLowerCase()).limit(1).get();
          if(!snap.empty)resolvedUid=snap.docs[0].data().uid||"";
        }catch(e){console.warn("UID lookup:",e.message);}
      }
      setFollowUpData({
        subject:`Your OnTrack Session Summary — ${note.student||f.student} — ${fmtDate(note.date||f.date)}`,
        body:result.text,
        activities:result.activities||[],
        studentEmail:studentEmail||"",
        studentUid:resolvedUid,
        sessionDate:note.date||f.date||"",
      });
    }catch(e){
      if(e.name!=="AbortError")showToast&&showToast("⚠️ Follow-up generation failed — check connection.");
    }finally{
      setGeneratingFollowUp(false);
    }
  };

  /* ── FEATURE 1: Session Continuity — load previous note context ── */
  const loadPrevNote=async()=>{
    if(!f.student.trim()){showToast("Enter the student name first.");return;}
    if(!db){showToast("Firebase not connected");return;}
    setLoadingPrev(true);
    try{
      let snap;
      try{
        snap=await db.collection("sessionNotes")
          .where("studentName","==",f.student.trim())
          .orderBy("createdAt","desc").limit(1).get();
      }catch{
        showToast("🔎 Searching notes (index building)...");const all=await db.collection("sessionNotes").orderBy("createdAt","desc").limit(200).get();
        const docs=all.docs.filter(d=>d.data().studentName===f.student.trim());
        snap={empty:docs.length===0,docs};
      }
      if(snap.empty){showToast("No previous notes found for this student.");return;}
      const prev=snap.docs[0].data();const sd=prev.sessionData||{};
      if(!window.confirm(`Load context from Session #${prev.sessionNum||"?"} (${fmtDate(prev.sessionDate)})?`))return;
      const notDone=s=>s&&s!=="Not documented"&&s.trim()!=="";
      if(notDone(sd.nextSessionFocus))upd("agenda",sd.nextSessionFocus);
      if(notDone(sd.commitPhase||sd.actionSteps))upd("checkin",`Follow-up on Session #${prev.sessionNum||"?"} commitments:
${sd.commitPhase||sd.actionSteps}`);
      // Fetch activity completion from the most recent follow-up for this student
      let prevActivities=[];
      if(db){
        try{
          // No orderBy here — equality-only filters don't need a composite index,
          // but adding orderBy(timestamp) on top would have required one that was
          // never documented in setup, silently breaking this feature via the catch below.
          const fuSnap=await db.collection("messages")
            .where("type","==","followUp").where("studentName","==",f.student.trim())
            .limit(10).get();
          if(!fuSnap.empty){
            const mostRecent=fuSnap.docs
              .map(d=>d.data())
              .sort((a,b)=>(b.timestamp?.toMillis?.()||0)-(a.timestamp?.toMillis?.()||0))[0];

        {(()=>{
        const buildCopyText=()=>{
          const line80="═".repeat(60);const line40="─".repeat(40);
          const header=[
            line80,
            "ONTRACK AT SU — COACHING SESSION NOTE",
            "Thinkversation™ Framework · Focused Solutions LLC",
            line80,
            `Coach: ${COACH_NAME}, ${COACH_TITLE}`,
            `Student: ${note.student||"—"}  |  Session #${note.num||"—"}  |  ${fmtDate(note.date)}  |  ${note.dur||"??"} min  |  ${note.mode||"—"}`,
            line80,"",
          ].join("\n");
          const sessionPhases=["landPhase","noticePhase","connectPhase","discoverPhase","commitPhase"];
          const closingFields=["sessionOutcomes","nextSessionFocus","referrals"];
          const coachFields=["strengthsObserved","coachObservations","coachingCompetencies"];
          const phaseBlock=SECTIONS.filter(s=>sessionPhases.includes(s.k)).map(s=>
            note[s.k]&&note[s.k]!=="Not documented this session"
              ?`${s.l}\n${line40}\n${note[s.k]}\n`
              :""
          ).filter(Boolean).join("\n");
          const closingBlock=SECTIONS.filter(s=>closingFields.includes(s.k)).map(s=>
            note[s.k]&&note[s.k]!=="Not documented this session"
              ?`${s.l}\n${line40}\n${note[s.k]}\n`
              :""
          ).filter(Boolean).join("\n");
          const coachBlock=SECTIONS.filter(s=>coachFields.includes(s.k)).map(s=>
            note[s.k]&&note[s.k]!=="Not documented this session"
              ?`${s.l}\n${line40}\n${note[s.k]}\n`
              :""
          ).filter(Boolean).join("\n");
          const footer=[
            line80,
            "CONFIDENTIAL — FERPA-protected coaching record",
            `© ${new Date().getFullYear()} ${COACH_NAME} & Focused Solutions LLC · All Rights Reserved`,
            line80
          ].join("\n");
          return header
            +"— COACHING SESSION —\n"+line40+"\n\n"+phaseBlock
            +"\n"+line80+"\n\n"
            +"— OUTCOMES & PLANNING —\n"+line40+"\n\n"+closingBlock
            +"\n"+line80+"\n\n"
            +"— COACH'S RECORD (CONFIDENTIAL) —\n"+line40+"\n\n"+coachBlock
            +"\n"+footer;
        };
        return <button className="btn btn-ghost btn-sm" onClick={()=>navigator.clipboard?.writeText(buildCopyText()).then(()=>showToast("📋 Note copied — ready to paste!")).catch(()=>showToast("Copy unavailable"))}>📋 Copy</button>;
      })()}
        <button className="btn btn-ghost btn-sm" style={{marginLeft:"auto"}} onClick={()=>{if(!savingNote&&window.confirm("Start a new note? Any unsaved changes will be lost.")){clearInterval(pctInt.current);pctInt.current=null;setStep(1);setPct(0);pctRef.current=0;setNote({});setNoteSaved(false);setSavedNoteId(null);setAttested(false);setPrevLoaded(null);setPrepBrief("");setShowPrep(false);setFollowUpData(null);setSessionType("standard");}}}>🔄 New Note</button>
      </div>
    </div>
  );
}

const getWeekDates=(wo)=>Array.from({length:7},(_,i)=>{const d=getMondayDate(wo);d.setDate(d.getDate()+i);return dateToYMD(d);});
const avgToLetter=(a)=>{if(a===null||a===undefined)return"—";if(a>=93)return"A";if(a>=90)return"A-";if(a>=87)return"B+";if(a>=83)return"B";if(a>=80)return"B-";if(a>=77)return"C+";if(a>=73)return"C";if(a>=70)return"C-";if(a>=60)return"D";return"F";};
const ltGpa=(l)=>({A:4.0,"A-":3.7,"B+":3.3,B:3.0,"B-":2.7,"C+":2.3,C:2.0,"C-":1.7,D:1.0,F:0.0}[l]??0);
const gc=(a)=>a>=90?"#34d399":a>=80?"#60a5fa":a>=70?"#fbbf24":a>=60?"#f97316":"#f87171";
const getCourseAvg=(c)=>{if(!c.grades?.length)return null;const g=c.grades.filter(x=>x.weight>0&&x.score!==""&&x.maxScore>0);if(!g.length)return null;let tw=0,ep=0;g.forEach(x=>{ep+=(parseFloat(x.score)/parseFloat(x.maxScore))*100*(x.weight/100);tw+=x.weight;});if(tw<=0)return null;return Math.round((ep/(tw/100))*10)/10;};
const calcGPA=(cs)=>{let tp=0,tc=0;cs.forEach(c=>{const a=getCourseAvg(c);if(a!==null&&c.credits){tp+=ltGpa(avgToLetter(a))*c.credits;tc+=c.credits;}});return tc>0?(tp/tc).toFixed(2):null;};
const daysInMonth=(y,m)=>new Date(y,m+1,0).getDate();
const firstDay=(y,m)=>new Date(y,m,1).getDay();

/* ── AUDIO ── */
const playBeep=(freq=880,vol=0.3,dur=0.7)=>{try{const ctx=new(window.AudioContext||window.webkitAudioContext)();const o=ctx.createOscillator();const g=ctx.createGain();o.connect(g);g.connect(ctx.destination);o.frequency.value=freq;g.gain.setValueAtTime(vol,ctx.currentTime);g.gain.exponentialRampToValueAtTime(0.01,ctx.currentTime+dur);o.start();o.stop(ctx.currentTime+dur);}catch{}};

/* ── SYLLABUS PARSER ── */
async function parseSyllabus(content,isPdf,mediaType="application/pdf"){
  const p=`Extract from this syllabus. Return ONLY valid JSON, no markdown:\n{"courseName":"","courseCode":"","credits":3,"prof":{"name":"","email":"","phone":"","office":"","hours":""},"grades":[{"name":"Exams","weight":40,"type":"exam"}],"events":[{"title":"Exam 1","date":"2026-10-15","type":"exam","description":""}]}\n\nIMPORTANT for "events": extract EVERY dated item on the syllabus's schedule or calendar table, not just graded assessments. Many syllabi (especially "provisional calendars" or day-by-day schedules) list ordinary class sessions, topics, and readings for most dates — include ALL of these, not only exams/papers/projects. Each dated row on a schedule table is one event, even if it's just a topic or discussion day with no grade attached.\nEvent types: exam,paper,project,homework,quiz,reading,class,holiday,other — use "class" for ordinary session/topic/discussion days, "holiday" for no-class/break days, "other" for anything that doesn't fit.\nUse the exact year shown in the syllabus dates; if a date has no year, infer it from context (semester/term mentioned).\n${!isPdf?"Syllabus:\n"+content.slice(0,8000):""}`;
  try{
    const r=await callClaude({model:MODEL,max_tokens:3000,system:"You are an academic data extraction assistant. Extract structured course information from syllabi accurately, including the FULL day-by-day schedule/calendar if present — not just formal graded assessments. Always return only valid JSON with no markdown fences or extra commentary.",messages:[{role:"user",content:isPdf?[{type:"document",source:{type:"base64",media_type:mediaType,data:content}},{type:"text",text:p}]:[{type:"text",text:p}]}]});
    if(!r.ok)throw new Error(`API ${r.status}`);
    const d=await r.json();const t=d.content?.[0]?.text||"{}";
    return JSON.parse(t.replace(/```json|```/g,"").trim());
  }catch(e){if(e.name!=="AbortError")console.error("parseSyllabus error:",e.message);return{};}
}

function MosToast({msg,onClose}){

  return<div style={{position:"fixed",top:16,right:16,zIndex:9999,background:`linear-gradient(135deg,${O},#ff9a3c)`,color:"#fff",padding:"12px 18px",borderRadius:12,fontWeight:700,fontSize:13,maxWidth:320,boxShadow:`0 6px 30px rgba(247,105,0,0.5)`,animation:"fadeIn 0.3s ease"}}>{msg}</div>;
}

function TimerWidget({onClose,showToast}){
  const [mode,setMode]=useState("pomodoro");
  const [running,setRunning]=useState(false);
  const [phase,setPhase]=useState("work");
  const [time,setTime]=useState(1500);
  const [total,setTotal]=useState(1500);
  const [study,setStudy]=useState(0);
  const [sessions,setSessions]=useState(0);
  const [mins,setMins]=useState(25);
  const intRef=useRef(null);
  const fmt=(s)=>`${String(Math.floor(s/60)).padStart(2,"0")}:${String(s%60).padStart(2,"0")}`;
  useEffect(()=>{
    if(!running)return;
    intRef.current=setInterval(()=>{
      if(mode==="study"){setStudy(s=>s+1);return;}
      setTime(t=>{
        if(t>1)return t-1;
        // Timer hit zero — signal completion via time=0, side effects handled below
        return 0;
      });
    },1000);
    return()=>clearInterval(intRef.current);
  },[running,mode,phase]);

  // Handle timer completion: fires when time reaches 0 while running
  const prevTimeRef=useRef(null);
  useEffect(()=>{
    if(!running||mode==="study"||time!==0)return;
    if(prevTimeRef.current===0)return; // already handled this zero
    prevTimeRef.current=0;
    clearInterval(intRef.current);
    playBeep(880,0.3,0.5);setTimeout(()=>playBeep(1100,0.2,0.4),600);
    if(mode==="pomodoro"){
      if(phase==="work"){
        setSessions(s=>s+1);setPhase("break");
        setTimeout(()=>{setTime(300);setTotal(300);},0);
        showToast("🍅 Pomodoro done! 5-min break time!");
      }else{
        setPhase("work");
        setTimeout(()=>{setTime(1500);setTotal(1500);},0);
        showToast("🎯 Break over! Back to work!");
        setRunning(false);
      }
    }else{
      setRunning(false);
      showToast("⏰ Timer complete! Great work!");
    }
  },[time,running,mode,phase,showToast]);

  useEffect(()=>{if(time>0)prevTimeRef.current=time;},[time]);
  const reset=()=>{setRunning(false);clearInterval(intRef.current);prevTimeRef.current=null;if(mode==="pomodoro"){setTime(1500);setTotal(1500);setPhase("work");}else if(mode==="custom"){const s=mins*60;setTime(s);setTotal(s);}else{setStudy(0);}};
  const pct=mode==="study"?0.75:(total>0?time/total:0);
  const R=42,C=2*Math.PI*R,dash=C*pct;
  const col=phase==="break"?"#60a5fa":mode==="study"?"#34d399":O;
  return<div style={{position:"fixed",top:68,right:16,zIndex:1000,background:CARD,border:`2px solid ${O}44`,borderRadius:18,padding:18,width:240,boxShadow:"0 8px 40px rgba(0,0,0,0.6)"}}>
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}>
      <span style={{fontWeight:800,color:O,fontSize:13}}>⏱ Study Timer</span>
      <button onClick={onClose} style={{background:"transparent",border:"none",color:"#8b949e",cursor:"pointer",fontSize:16}}>✕</button>
    </div>
    <div style={{display:"flex",gap:3,marginBottom:14}}>
      {[["pomodoro","🍅 Pomo"],["custom","⏲ Custom"],["study","📚 Study"]].map(([m,l])=><button key={m} onClick={()=>{setMode(m);setRunning(false);if(m==="pomodoro"){setTime(1500);setTotal(1500);setPhase("work");}else if(m==="custom"){const s=mins*60;setTime(s);setTotal(s);}else{setStudy(0);}}} style={{flex:1,padding:"4px 2px",background:mode===m?col:"transparent",border:`1px solid ${mode===m?col:BORDER}`,color:mode===m?"#fff":"#8b949e",borderRadius:6,cursor:"pointer",fontSize:9,fontWeight:700}}>{l}</button>)}
    </div>
    <div style={{display:"flex",flexDirection:"column",alignItems:"center",marginBottom:14}}>
      <svg width={100} height={100} viewBox="0 0 100 100">
        <circle cx={50} cy={50} r={R} fill="none" stroke={BORDER} strokeWidth={7}/>
        <circle cx={50} cy={50} r={R} fill="none" stroke={col} strokeWidth={7} strokeLinecap="round"
          strokeDasharray={C} strokeDashoffset={C-dash} transform="rotate(-90 50 50)" style={{transition:"stroke-dashoffset 0.8s ease"}}/>
        <text x={50} y={47} textAnchor="middle" fill="#e6edf3" fontSize={16} fontWeight="800">{mode==="study"?fmt(study):fmt(time)}</text>
        <text x={50} y={62} textAnchor="middle" fill="#8b949e" fontSize={8}>{mode==="pomodoro"?(phase==="work"?"FOCUS":"BREAK"):mode==="custom"?"CUSTOM":"STUDY TIME"}</text>
      </svg>
      {mode==="pomodoro"&&<div style={{fontSize:10,color:"#8b949e",marginTop:2}}>🍅 {sessions} sessions completed</div>}
      {mode==="custom"&&!running&&<div style={{display:"flex",alignItems:"center",gap:6,marginTop:6}}>
        <input type="number" min={1} max={180} value={mins} onChange={e=>{const v=parseInt(e.target.value,10)||25;setMins(v);const s=v*60;setTime(s);setTotal(s);}} style={{background:"#0d1117",border:`1px solid ${BORDER}`,color:"#e6edf3",borderRadius:6,padding:"3px 6px",width:55,fontSize:12,textAlign:"center"}}/>
        <span style={{fontSize:11,color:"#8b949e"}}>min</span>
      </div>}
    </div>
    <div style={{display:"flex",gap:6}}>
      <button onClick={()=>setRunning(!running)} style={{flex:1,background:running?"#ef4444":col,border:"none",color:"#fff",borderRadius:8,padding:"8px 0",cursor:"pointer",fontWeight:800,fontSize:13}}>{running?"⏸ Pause":"▶ Start"}</button>
      <button onClick={reset} style={{background:"transparent",border:`1px solid ${BORDER}`,color:"#8b949e",borderRadius:8,padding:"8px 10px",cursor:"pointer",fontSize:13}}>↺</button>
    </div>
  </div>;
}

                {!readOnly&&<button onClick={()=>fileRef.current&&fileRef.current.click()} style={{background:"transparent",border:`1px solid ${cc.a}`,color:cc.a,borderRadius:7,padding:"5px 12px",cursor:"pointer",fontSize:11,fontWeight:700}}>🔄 Re-upload</button>}

        {!(course.docs||[]).length?<div style={{color:"#8b949e",fontSize:12}}>No documents uploaded yet.</div>:
