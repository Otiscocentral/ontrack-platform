const SessionTrendPanel=React.memo(function SessionTrendPanel({sessionNotes,roster}){
  const EF_TERMS=[
    {k:"Initiation/Starting",   terms:["initiat","starting","start","begin","getting started","procrastinat"]},
    {k:"Time Management",       terms:["time manage","time mgmt","deadlin","schedul","punctual","late","overdue"]},
    {k:"Working Memory",        terms:["working memory","forgets","forgot","remember","remind","lost track"]},
    {k:"Planning/Prioritization",terms:["plan","priorit","organiz","sequence","steps","break down","outline"]},
    {k:"Emotional Regulation",  terms:["overwhelm","anxiet","stress","emotional","frustrat","mood","calm"]},
    {k:"Task Completion",       terms:["complet","finish","follow through","submit","turn in","done"]},
    {k:"Focus/Attention",       terms:["focus","attent","distract","concentrat","hyperfocus"]},
    {k:"Self-Monitoring",       terms:["self-monitor","self-aware","reflect","notice","aware","metacog"]},
    {k:"Flexibility",           terms:["flexib","transition","adapt","shift","change","adjust","pivot"]},
    {k:"Motivation",            terms:["motivat","engage","interest","driven","avoid","stuck","amotivat"]},
  ];

  // Aggregate data from all notes
  const students=[...new Set(sessionNotes.map(n=>n.studentName).filter(Boolean))].sort();
  const perStudent=React.useMemo(()=>students.map(name=>{
    const notes=sessionNotes.filter(n=>n.studentName===name).sort((a,b)=>a.sessionDate?.localeCompare(b.sessionDate||"")||0);
    const attested=notes.filter(n=>n.attestedAt).length;
    return{name,count:notes.length,attested,lastDate:notes[notes.length-1]?.sessionDate||"",firstDate:notes[0]?.sessionDate||""};
  }),[sessionNotes,students]);

  // EF frequency across all notes
  const efCounts=EF_TERMS.map(({k,terms})=>{
    let count=0;
    sessionNotes.forEach(n=>{
      const text=(JSON.stringify(n.sessionData||"")).toLowerCase();
      if(terms.some(t=>text.includes(t)))count++;
    });
    return{k,count};
  }).filter(x=>x.count>0).sort((a,b)=>b.count-a.count);

  const maxEf=efCounts[0]?.count||1;

  // Attestation rate
  const totalAttested=sessionNotes.filter(n=>n.attestedAt).length;
  const pctAtt=sessionNotes.length?Math.round(totalAttested/sessionNotes.length*100):0;

  return(
    <div className="fade" style={{marginBottom:14}}>
      <div className="card" style={{marginBottom:12,borderColor:O+"44",background:O+"06"}}>
        <div className="card-title">📊 Session Analytics Dashboard</div>
        <div className="card-sub">Aggregate view across {sessionNotes.length} note{sessionNotes.length!==1?"s":""} · {students.length} student{students.length!==1?"s":""}</div>
        <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(110px,1fr))",gap:8,marginBottom:16}}>
          {[
            {l:"Total Sessions",  v:sessionNotes.length,   c:"var(--orange)"},
            {l:"Students",        v:students.length,        c:"var(--blue)"},
            {l:"Attested Notes",  v:totalAttested,          c:"var(--green)"},
            {l:"Attestation Rate",v:pctAtt+"%",             c:pctAtt>=80?"var(--green)":pctAtt>=50?"var(--yellow)":"var(--red)"},
          ].map(s=>(
            <div key={s.l} style={{background:"var(--s2)",border:"1px solid var(--bdr)",borderRadius:8,padding:"10px 12px",textAlign:"center"}}>
              <div style={{fontSize:22,fontWeight:800,color:s.c}}>{s.v}</div>
              <div style={{fontSize:9,color:"var(--muted)",marginTop:2}}>{s.l}</div>
            </div>
          ))}
        </div>
        <div style={{marginBottom:16}}>
          <div style={{fontSize:11,fontWeight:700,color:"var(--orange)",marginBottom:8,textTransform:"uppercase",letterSpacing:.5}}>Sessions per Student</div>
          {perStudent.length===0?<div style={{fontSize:11,color:"var(--muted)",textAlign:"center",padding:"20px 0"}}>📝 No session notes yet — start adding sessions to see trends.</div>:
          perStudent.map(s=>(
            <div key={s.name} style={{display:"flex",alignItems:"center",gap:10,marginBottom:6}}>
              <div style={{width:110,fontSize:11,fontWeight:600,color:"var(--txt)",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",flexShrink:0}}>{s.name}</div>
              <div style={{flex:1,height:14,background:"var(--s3)",borderRadius:3,overflow:"hidden"}}>
                <div style={{width:`${Math.min(100,(s.count/Math.max(1,...perStudent.map(x=>x.count)))*100)}%`,height:"100%",background:`linear-gradient(90deg,var(--orange),var(--orange2))`,borderRadius:3}}/>
              </div>
              <div style={{fontSize:11,color:"var(--orange)",fontWeight:700,width:24,textAlign:"right",flexShrink:0}}>{s.count}</div>
              {s.attested>0&&<div style={{fontSize:9,color:"var(--green)",background:"var(--green)15",border:"1px solid var(--green)33",borderRadius:4,padding:"1px 5px",flexShrink:0}}>🔏 {s.attested}</div>}
              <div style={{fontSize:9,color:"var(--muted)",flexShrink:0}}>{fmtDate(s.lastDate)}</div>
            </div>
          ))}
        </div>
        {efCounts.length>0&&<div>
          <div style={{fontSize:11,fontWeight:700,color:"var(--orange)",marginBottom:8,textTransform:"uppercase",letterSpacing:.5}}>EF Domain Frequency</div>
          <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(240px,1fr))",gap:6}}>
            {efCounts.map(({k,count})=>(
              <div key={k} style={{display:"flex",alignItems:"center",gap:8}}>
                <div style={{fontSize:10,color:"var(--txt)",width:150,flexShrink:0}}>{k}</div>
                <div style={{flex:1,height:8,background:"var(--s3)",borderRadius:3,overflow:"hidden"}}>
                  <div style={{width:`${(count/maxEf)*100}%`,height:"100%",background:`linear-gradient(90deg,var(--purple),var(--blue))`,borderRadius:3}}/>
                </div>
                <div style={{fontSize:10,color:"var(--muted)",width:20,textAlign:"right",flexShrink:0}}>{count}</div>
              </div>
            ))}
          </div>
        </div>}
      </div>
    </div>
  );
});

   COACH DASHBOARD

function CoachDashboard({user,showToast}){
  const [view,setView]=useState("roster");
  const [roster,setRoster]=useState([]);
  const [messages,setMessages]=useState([]);
  const [selectedStudent,setSelectedStudent]=useState(null);
  const [sessionNotes,setSessionNotes]=useState([]);
  const [studentPortalData,setStudentPortalData]=useState({}); // {uid: {lastPortalVisit, ...}}
  // Session Notes filter state
  const [noteDateFrom,setNoteDateFrom]=useState("");
  const [noteDateTo,setNoteDateTo]=useState("");
  const [noteStudentFilter,setNoteStudentFilter]=useState("ALL");
  const [expandedNoteId,setExpandedNoteId]=useState(null);
  const [showTrends,setShowTrends]=useState(false);
  const [followUpModal,setFollowUpModal]=useState(null);
  const [generatingFollowUp,setGeneratingFollowUp]=useState(null); // noteId currently generating // {subject,body,studentName,studentEmail}

  const _fallbackUnsubRef=useRef(null); // stores fallback sessionNotes unsub to prevent leak
  useEffect(()=>{
    if(!db)return; // Firebase not initialized — defensive guard
    const unsub1=db.collection("roster").orderBy("slotNum")
      .onSnapshot(
        s=>{setRoster(s.docs.map(d=>({id:d.id,...d.data()})));},
        err=>{
          console.error("Roster listener error:",err);
          showToast("⚠️ Roster failed to load — check Firestore rules & network");
          setRoster([]); // ensure loading state resolves
        }
      );
    const unsub2=db.collection("messages").orderBy("timestamp","desc").limit(200)
      .onSnapshot(
        s=>{setMessages(s.docs.map(d=>({id:d.id,...d.data()})));},
        err=>{console.error("Messages listener error:",err);}
      );
    // Session notes: load last 365 days (coach-only per Firestore rules — FERPA protected)
    const _yearAgo=new Date();_yearAgo.setFullYear(_yearAgo.getFullYear()-1);
    const _yearAgoTs=firebase.firestore.Timestamp.fromDate(_yearAgo);
    const unsub3=db.collection("sessionNotes")
      .where("createdAt",">=",_yearAgoTs)
      .orderBy("createdAt","desc")
      .limit(500) // 20 students × 25 sessions = 500 max per year
      .onSnapshot(
        s=>{setSessionNotes(s.docs.map(d=>({id:d.id,...d.data()})));},
        err=>{
          console.error("Session notes listener error:",err);
          // Fallback: if composite index not yet created, load without date filter
          // Store unsubscribe so it is cleaned up when component unmounts
          _fallbackUnsubRef.current=db.collection("sessionNotes").orderBy("createdAt","desc").limit(500)
            .onSnapshot(s2=>{setSessionNotes(s2.docs.map(d=>({id:d.id,...d.data()})));},()=>{});
        }
      );
    const unsub4=()=>{} // portal data loaded via Promise.all in effect #2 — no persistent listener
    return()=>{unsub1();unsub2();unsub3();unsub4();if(_fallbackUnsubRef.current)_fallbackUnsubRef.current();};
  },[]);

  const openStudent=(s)=>{setSelectedStudent(s);setView("student");};

  // Load portal visit data whenever roster changes (runs after roster populates)
  useEffect(()=>{
    if(!db||!roster.length)return;
    const knownUids=roster.filter(s=>s.uid).map(s=>s.uid);
    if(!knownUids.length)return;
    let cancelled=false;
    Promise.all(knownUids.map(uid=>db.collection("students").doc(uid).get()))
      .then(snaps=>{
        if(cancelled)return;
        const map={};
        snaps.forEach(snap=>{if(snap.exists)map[snap.id]={lastPortalVisit:snap.data().lastPortalVisit};});
        setStudentPortalData(map);
      }).catch(e=>console.warn("Portal data load:",e.message));
    return()=>{cancelled=true;};
  },[roster,db]);

  // Keep selectedStudent fully fresh whenever roster snapshot updates
  useEffect(()=>{
    if(!selectedStudent?.id||!roster.length)return;
    const fresh=roster.find(s=>s.id===selectedStudent.id);
    if(fresh)setSelectedStudent(fresh);
    else{setSelectedStudent(null);setView("roster");} // student was deleted
  },[roster,selectedStudent?.id]);

  return(
    <>
    {followUpModal&&<FollowUpEmailModal
      studentName={followUpModal.studentName}
      studentEmail={followUpModal.studentEmail}
      studentUid={followUpModal.studentUid||""}
      sessionDate={followUpModal.sessionDate||""}
      subject={followUpModal.subject}
      body={followUpModal.body}
      activities={followUpModal.activities||[]}
      onClose={()=>setFollowUpModal(null)}
      showToast={showToast}
    />}
    <div className="app-shell">
      <div className="top-bar">
        <div className="top-brand">
          <div className="top-badge">OnTrack at SU</div>
          <div className="top-title">Coach Dashboard</div>
        </div>
        <div className="top-right">
          <div className="top-contact">
            <a href={`tel:${COACH_PHONE}`}>📱 {COACH_PHONE}</a>
            <a href={`mailto:${COACH_EMAIL}`}>✉️ {COACH_EMAIL}</a>
          </div>
          <div style={{fontSize:11,color:"var(--muted)",borderLeft:"1px solid var(--bdr)",paddingLeft:12}}>{COACH_NAME}, {COACH_TITLE}</div>
          <button className="btn btn-ghost btn-sm" onClick={()=>auth.signOut()}>Sign Out</button>
        </div>
      </div>
      <div className="coach-shell">
        <div className="sidebar">
          <div className="sb-section">Navigation</div>
          {[
            {id:"roster",ico:"👥",l:"Student Roster"},
            {id:"compose",ico:"📨",l:"Send Message",badge:null},
            {id:"notes_list",ico:"📋",l:"Session Notes"},
            {id:"psychoed",ico:"📚",l:"Psychoed Library"},
            {id:"referrals",ico:"🏥",l:"Referral Network"},
            {id:"manage",ico:"⚙️",l:"Manage Students"},
          ].map(item=>(
            <button key={item.id} className={`sb-btn${view===item.id?" active":""}`} onClick={()=>{setView(item.id);setSelectedStudent(null);}}>
              <span className="ico">{item.ico}</span>{item.l}
              {item.badge&&<span className="sb-badge">{item.badge}</span>}
            </button>
          ))}

          <div className="sb-section">Students</div>
          <div style={{overflow:"hidden",flex:1,overflowY:"auto"}}>
            {roster.map(s=>(
              <button key={s.id} className={`sb-btn${selectedStudent?.id===s.id?" active":""}`} onClick={()=>openStudent(s)}>
                <div style={{width:22,height:22,borderRadius:"50%",background:avatarColor(s.name||""),display:"flex",alignItems:"center",justifyContent:"center",fontSize:9,fontWeight:700,color:"#fff",flexShrink:0}}>
                  {initials(s.name||"")}
                </div>
                <div style={{flex:1,minWidth:0,textAlign:"left"}}>
                  <div style={{fontSize:11,fontWeight:600,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{s.name||"No name"}</div>
                  <div style={{fontSize:9,color:"var(--dim)",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{s.studentId||s.email||"—"}</div>
                </div>

              </div>
              <div className="roster-grid">

                    <div className="sc-avatar" style={{background:avatarColor(s.name||"")}}>{initials(s.name||s.email||"")}</div>

                                  subject:`Your OnTrack Session Summary — ${studentName} — ${sessionDate}`,
                                  body:result.text,
                                  activities:result.activities||[],
                                });
                              }}>📧 Follow-Up Email</button>
                            <button className="btn btn-ghost btn-sm" onClick={()=>{
                              const line60="═".repeat(60);const line40="─".repeat(40);
                              const phases=[["landPhase","🌊 LAND — Arrive & Calibrate"],["noticePhase","🔍 NOTICE — Since We Last Met"],["connectPhase","🔗 CONNECT — What Matters & Why"],["discoverPhase","💡 DISCOVER — What's Possible"],["commitPhase","🎯 COMMIT — The Action Plan"]];
                              const closing=[["sessionOutcomes","📈 Session Outcomes"],["nextSessionFocus","🔭 Next Session Focus"],["referrals","🏥 Referrals"]];
                              const coach=[["strengthsObserved","⭐ Strengths Observed"],["coachObservations","🔒 Coach Observations"],["coachingCompetencies","🎓 ICF Competencies"]];
                              const fmtBlock=(pairs)=>pairs.map(([k,l])=>n.sessionData?.[k]?`${l}\n${line40}\n${n.sessionData[k]}\n`:"").filter(Boolean).join("\n");
                              const txt=[line60,"ONTRACK AT SU — COACHING SESSION NOTE","Thinkversation™ Framework · Focused Solutions LLC",line60,`Coach: ${COACH_NAME}, ${COACH_TITLE}`,`Student: ${studentName} | ${sessionDate}${sessionNum}`,line60,"","— COACHING SESSION —",line40,"",fmtBlock(phases),line60,"","— OUTCOMES & PLANNING —",line40,"",fmtBlock(closing),line60,"","— COACH'S RECORD (CONFIDENTIAL) —",line40,"",fmtBlock(coach),line60,`CONFIDENTIAL — FERPA-protected · © ${new Date().getFullYear()} ${COACH_NAME} & Focused Solutions LLC`,line60].join("\n");
                              navigator.clipboard?.writeText(txt).then(()=>showToast("📋 Note copied — ready to paste!")).catch(()=>showToast("Copy unavailable"));
                            }}>📋 Copy Note</button>
                            <button className="btn btn-blue btn-sm" onClick={()=>{
                              const ln=(k,l)=>n.sessionData?.[k]?`\n${l}\n${"─".repeat(40)}\n${n.sessionData[k]}\n`:"";
                              const body=`ONTRACK AT SU — COACHING SESSION NOTE\nThinkversation™ Framework · Focused Solutions LLC\n${"=".repeat(60)}\nCoach: ${COACH_NAME}, ${COACH_TITLE}\nStudent: ${studentName} | ${sessionDate}${sessionNum} · ${dur?dur+" min · ":""}${mode}\n${"=".repeat(60)}\n\n— COACHING SESSION —${ln("landPhase","🌊 LAND — Arrive & Calibrate")}${ln("noticePhase","🔍 NOTICE — Since We Last Met")}${ln("connectPhase","🔗 CONNECT — What Matters & Why")}${ln("discoverPhase","💡 DISCOVER — What's Possible")}${ln("commitPhase","🎯 COMMIT — The Action Plan")}\n${"=".repeat(60)}\n\n— OUTCOMES & PLANNING —${ln("sessionOutcomes","📈 Session Outcomes")}${ln("nextSessionFocus","🔭 Next Session Focus")}${ln("referrals","🏥 Referrals")}\n${"=".repeat(60)}\n\n— COACH'S RECORD (CONFIDENTIAL) —${ln("strengthsObserved","⭐ Strengths Observed")}${ln("coachObservations","🔒 Coach Observations")}${ln("coachingCompetencies","🎓 ICF Competencies")}\n${"=".repeat(60)}\nCONFIDENTIAL — FERPA-protected · © ${new Date().getFullYear()} ${COACH_NAME} & Focused Solutions LLC`;
                              const sub=encodeURIComponent(`OnTrack Session Note — ${studentName} — ${n.sessionDate||""}`);
                              window.open(`mailto:${COACH_EMAIL}?subject=${sub}&body=${encodeURIComponent(body)}`);
                            }}>✉️ Send to Outlook</button>
                            <button className="btn btn-ghost btn-sm" style={{marginLeft:"auto"}} onClick={()=>setExpandedNoteId(null)}>▲ Close</button>
                          </div>
                        </div>
                      )}
                    </div>
                  );
                });
              })()}
            </div>
          )}

          {view==="manage"&&(
            <div className="fade">
              <ManageStudentsPanel roster={roster} onUpdate={()=>{}} showToast={showToast}/>

          {view==="psychoed"&&(

          {view==="referrals"&&(
            <div className="fade">

      </div>
    </div>
    <CopyrightFooter/>
    </>
  );
}

/* ═══════════════════════════════════════════════════════════
   STUDENT PORTAL
═══════════════════════════════════════════════════════════ */
function StudentPortal({user,rosterEntry,showToast}){
  const [data,setData]=useState(null);
  const [messages,setMessages]=useState([]);
  const [unread,setUnread]=useState(0);
  const [tab,setTab]=useState("planner");
  const [saving,setSaving]=useState(false);
  const hasWrittenVisit=useRef(false); // write lastPortalVisit once per session

  useEffect(()=>{
    if(!db||!user?.uid)return; // Firebase or user not ready
    // link uid to roster entry
    if(rosterEntry&&!rosterEntry.uid){
      db.collection("roster").doc(rosterEntry.id).update({uid:user.uid}).catch(e=>console.warn("Roster uid update failed:",e.message));
    }
    // Record this portal visit (one write per session, visible to coach)
    if(!hasWrittenVisit.current){
      hasWrittenVisit.current=true;
      db.collection("students").doc(user.uid)
        .set({lastPortalVisit:firebase.firestore.FieldValue.serverTimestamp()},{merge:true})
        .catch(e=>console.warn("lastPortalVisit write failed:",e.message));
    }
    // student data
    const unsub1=db.collection("students").doc(user.uid)
      .onSnapshot(
        snap=>{
          if(snap.exists){
            // Deep-merge with INIT_STUDENT so any missing field gets a safe default.
            // A plain snap.data() would crash the app if e.g. profile was never written.
            const raw=snap.data();
            setData({
              ...INIT_STUDENT,
              ...raw,
              profile:{...INIT_STUDENT.profile,...(raw.profile||{})},
              goals:Array.isArray(raw.goals)?raw.goals:INIT_STUDENT.goals,
              appointments:Array.isArray(raw.appointments)?raw.appointments:INIT_STUDENT.appointments,
              sharedWith:Array.isArray(raw.sharedWith)?raw.sharedWith:INIT_STUDENT.sharedWith,
            });
          }else{
            const init={...INIT_STUDENT,profile:{...INIT_STUDENT.profile,name:rosterEntry?.name||"",studentId:rosterEntry?.studentId||""}};
            db.collection("students").doc(user.uid).set(init,{merge:true});
            setData(init);
          }
        },
        err=>{
          console.error("Student data read error:",err);
          setData({...INIT_STUDENT,profile:{...INIT_STUDENT.profile,name:rosterEntry?.name||"",studentId:rosterEntry?.studentId||""}});
        }
      );
    // messages — no orderBy on purpose. An "in" query combined with orderBy on a
    // different field requires a Firestore composite index; if that index was ever
    // missing or not finished building, Coach Mail would silently and permanently
    // fail to load. Sorting client-side means this only needs auto-created
    // single-field indexes, so it can never get stuck this way.
    let unsub2=()=>{};
    try{
      unsub2=db.collection("messages")
        .where("to","in",[user.uid,"ALL"])
        .limit(60)
        .onSnapshot(
          snap=>{
            const msgs=snap.docs.map(d=>({id:d.id,...d.data()}))
              .sort((a,b)=>(b.timestamp?.toMillis?.()||0)-(a.timestamp?.toMillis?.()||0))
              .slice(0,30);
            setMessages(msgs);
            setUnread(msgs.filter(m=>!(m.readBy||[]).includes(user.uid)).length);
          },
          err=>{console.error("Messages query error:",err);}
        );
    }catch(e){console.error("Messages listener setup failed:",e);}
    return()=>{unsub1();unsub2();};
  },[user?.uid]);

  const save=async(patch)=>{
    if(!db||!user?.uid)return;
    const payload=patch||data;
    if(!payload){showToast("⚠️ No data to save yet");return;}
    setSaving(true);
    try{await db.collection("students").doc(user.uid).set(payload,{merge:true});showToast("✅ Saved!");}
    catch(e){showToast("Save failed: "+e.message);}
    finally{setSaving(false);}
  };

  const markRead=async(msgId)=>{
    if(!db)return;
    // Optimistic update: mark as read in local state immediately
    setMessages(prev=>prev.map(m=>m.id===msgId?{...m,readBy:[...(m.readBy||[]),user.uid]}:m));
    setUnread(p=>Math.max(0,p-1));
    try{
      await db.collection("messages").doc(msgId).update({readBy:firebase.firestore.FieldValue.arrayUnion(user.uid)});
    }catch(e){
      // Revert optimistic update on failure
      setMessages(prev=>prev.map(m=>m.id===msgId?{...m,readBy:(m.readBy||[]).filter(id=>id!==user.uid)}:m));
      setUnread(p=>p+1);
      // Firestore rules may need: allow update: if request.resource.data.diff(resource.data).affectedKeys().hasOnly(['readBy'])
      console.warn("markRead failed:",e.message);
      showToast&&showToast("Could not mark as read — will retry.");
    }
  };

  const updProfile=(k,v)=>setData(p=>({...p,profile:{...p.profile,[k]:v}}));
  const updGoal=(id,k,v)=>setData(p=>({...p,goals:(p.goals||[]).map(g=>g.id===id?{...g,[k]:v}:g)}));
  const delAppt=(id)=>{
    const remaining=(data.appointments||[]).filter(a=>a.id!==id);
    setData(p=>({...p,appointments:remaining}));
    save({appointments:remaining});
  };
  const updAppt=(id,k,v)=>setData(p=>({...p,appointments:(p.appointments||[]).map(a=>a.id===id?{...a,[k]:v}:a)}));

  const pi={background:"var(--s2)",border:"1px solid var(--bdr)",color:"var(--txt)",borderRadius:7,padding:"8px 11px",fontSize:12,width:"100%"};
  const STATUS_MAP={not_started:{l:"Not Started",c:"#6b82a8"},urgent:{l:"🚨 Urgent",c:"#ef4444"},started:{l:"🔄 Started",c:"#fbbf24"},completed:{l:"✅ Completed",c:"#34d399"}};

  if(!data)return<div style={{padding:40,color:"var(--muted)",textAlign:"center"}}>Loading your planner...</div>;

  return(
    <div className="app-shell">
      <div className="top-bar">
        <div className="top-brand">
          <div className="top-badge">OnTrack at SU</div>
          <div className="top-title">My Orange Success</div>
        </div>
        <div className="top-right">
          <div style={{fontSize:11,color:"var(--muted)"}}>Coach: {COACH_NAME} · 📱 {COACH_PHONE}</div>
          {unread>0&&(
            <button className="btn flash-btn btn-sm" style={{background:O,color:"#fff",border:"none"}} onClick={()=>setTab("mail")}>
              📬 {unread} Coach Mail
            </button>
          )}
          <button className="btn btn-ghost btn-sm" onClick={()=>auth.signOut()}>Sign Out</button>
        </div>
      </div>

      <div style={{padding:"16px 20px",maxWidth:1100,margin:"0 auto",width:"100%"}}>
        {unread>0&&tab!=="mail"&&(
          <div className="coach-mail-banner" onClick={()=>setTab("mail")}>
            <div className="mail-dot"/>
            <div>
              <div style={{fontWeight:700,fontSize:13,color:O}}>📬 You have {unread} new message{unread!==1?"s":""} from Coach Bisson</div>
              <div style={{fontSize:11,color:"var(--muted)"}}>Click to read your Coach Mail</div>
            </div>
            <button className="btn btn-primary btn-sm" style={{marginLeft:"auto"}}>Read Now →</button>
          </div>
        )}

        <div className="stab-bar">
          {[
            {id:"planner",l:"🎯 Goals & Planner"},
            {id:"checkin",l:"📊 Weekly Check-In"},
            {id:"efprofile",l:"🧠 EF Profile"},
            {id:"mmm",l:"🧬 M·M·M"},
            {id:"intake",l:"📝 My Intake"},
            {id:"profile",l:"👤 My Profile"},
            {id:"appointments",l:"📆 Appointments"},
            {id:"notes",l:"📝 Notes"},
            {id:"mail",l:`📬 Coach Mail${unread>0?" ("+unread+")":""}`},
            {id:"mos",l:"🍊 MyOrangeSuccess"},
            {id:"arc",l:"🗺️ My Journey"},
            {id:"share",l:"🔗 Share Access"},
          ].map(t=>(
            <button key={t.id} className={`stab${tab===t.id?" active":""}`} onClick={()=>setTab(t.id)}>{t.l}</button>
          ))}
        </div>
        {tab==="planner"&&<div className="fade">
          <div className="card" style={{marginBottom:14}}>
            <div className="card-title">🎯 Weekly Goals</div>
            <div style={{fontSize:11,color:"var(--muted)",marginBottom:12}}>
              Week of {(()=>{const d=new Date();const day=d.getDay();const diff=day===0?-6:1-day;const mon=new Date(d);mon.setDate(d.getDate()+diff);return mon.toLocaleDateString("en-US",{month:"long",day:"numeric",year:"numeric"})+'  –  '+new Date(mon.getTime()+6*864e5).toLocaleDateString("en-US",{month:"long",day:"numeric",year:"numeric"});})()}
            </div>
            <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(250px,1fr))",gap:10}}>
              {(data.goals||[]).length===0&&<div style={{color:"var(--muted)",fontSize:12,padding:"16px 0",textAlign:"center"}}>No goals set yet — your coach will add goals during your next session.</div>}
              {(data.goals||[]).map((g,i)=>{
                const st=STATUS_MAP[g.status]||STATUS_MAP.not_started;
                return(
                  <div key={g.id} className="card fade" style={{borderLeft:`3px solid ${st.c}`,padding:"12px 14px",marginBottom:0}}>
                    <div style={{display:"flex",gap:6,alignItems:"center",marginBottom:6}}>
                      <div style={{width:20,height:20,borderRadius:"50%",background:st.c,color:"#fff",display:"flex",alignItems:"center",justifyContent:"center",fontSize:10,fontWeight:700,flexShrink:0}}>{i+1}</div>
                      <input style={{...pi,background:"transparent",border:"none",borderBottom:"1px solid var(--bdr)",borderRadius:0,fontSize:12,fontWeight:700,flex:1,padding:"2px 0"}} value={g.title||""} onChange={e=>updGoal(g.id,"title",e.target.value)} placeholder={`Goal ${i+1}...`} spellCheck={true} data-gramm={true}/>
                    </div>
                    <div style={{display:"flex",gap:6,marginBottom:6}}>
                      <select style={{...pi,width:"auto",flex:1,fontSize:10,color:st.c,border:`1px solid ${st.c}55`,padding:"4px 7px"}} value={g.status} onChange={e=>updGoal(g.id,"status",e.target.value)}>
                        {Object.entries(STATUS_MAP).map(([v,x])=><option key={v} value={v}>{x.l}</option>)}
                      </select>
                      <input type="date" style={{...pi,width:"auto",fontSize:10,padding:"4px 7px"}} value={g.completionDate||""} onChange={e=>updGoal(g.id,"completionDate",e.target.value)}/>
                    </div>
                    {g.expanded&&(
                      <div style={{display:"flex",flexDirection:"column",gap:8,marginTop:8}}>
                        {[["steps","📋 Steps"],["location","📍 Location"],["supportsRequired","🤝 Supports"],["outcomeExpectations","🎓 Outcomes"],["reflection","✏️ My Reflection"]].map(([k,l])=>(
                          <div key={k}>
                            <div className="lbl">{l}</div>
                            {k==="location"
                              ?<input style={pi} value={g[k]||""} onChange={e=>updGoal(g.id,k,e.target.value)} spellCheck={true} data-gramm={true}/>
                              :<textarea style={{...pi,resize:"vertical",minHeight:50,lineHeight:1.5}} value={g[k]||""} onChange={e=>updGoal(g.id,k,e.target.value)} spellCheck={true} data-gramm={true}/>
                            }
                          </div>
                        ))}
                      </div>
                    )}
                    <button className="btn btn-ghost btn-xs" style={{marginTop:6}} onClick={()=>updGoal(g.id,"expanded",!g.expanded)}>{g.expanded?"▲":"▼ Details"}</button>
                  </div>
                );
              })}
            </div>
            <button className="btn btn-primary btn-sm" style={{marginTop:12}} onClick={()=>save({goals:data.goals})}>💾 Save Goals</button>
          </div>
        </div>}
        {tab==="checkin"&&<div className="fade"><BetweenSessionCheckIn uid={user?.uid} readOnly={false}/></div>}
        {tab==="efprofile"&&<div className="fade"><EFProfilePanel uid={user?.uid} readOnly={false} showToast={showToast}/></div>}
        {tab==="mmm"&&<div className="fade"><MachineMindMissionPanel uid={user?.uid} readOnly={false} showToast={showToast}/></div>}
        {tab==="intake"&&<div className="fade"><DigitalIntakePanel uid={user?.uid} coachView={false} showToast={showToast}/></div>}
        {tab==="profile"&&<div className="fade">
          <div className="card">
            <div className="card-title">👤 My Profile</div>
            <div className="g2" style={{marginBottom:10}}>
              {[["name","Full Name"],["studentId","Student ID"],["cell","Cell Phone"],["dorm","Dorm / Residence"],["major","Major"],["year","Academic Year"]].map(([k,l])=>(
                <div key={k} className="fg"><div className="lbl">{l}</div><input style={pi} value={data.profile[k]||""} onChange={e=>updProfile(k,e.target.value)} spellCheck={k==="name"||k==="major"}/></div>
              ))}
            </div>
            <div className="divider"/>
            <div style={{fontWeight:700,fontSize:12,color:"var(--blue)",marginBottom:10}}>Parent / Guardian Contact</div>
            <div className="g2">
              {[1,2].map(n=>(
                <div key={n} style={{background:"var(--s2)",borderRadius:8,padding:"10px 12px",border:"1px solid var(--bdr)"}}>
                  <div style={{fontSize:10,color:"var(--blue)",fontWeight:700,marginBottom:8}}>Parent / Guardian {n}</div>
                  {[["Name","Name"],["Cell","Cell"],["Email","Email"]].map(([sf,l])=>(
                    <div key={sf} className="fg"><div className="lbl">{l}</div><input style={{...pi,padding:"6px 10px",fontSize:11}} value={data.profile[`parent${n}${sf}`]||""} onChange={e=>updProfile(`parent${n}${sf}`,e.target.value)}/></div>
                  ))}
                </div>
              ))}
            </div>
            <button className="btn btn-primary btn-sm" style={{marginTop:12}} onClick={()=>save({profile:data.profile})}>💾 Save Profile</button>
          </div>
        </div>}
        {tab==="appointments"&&<div className="fade">
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}>
            <div style={{fontFamily:"'DM Serif Display',serif",fontSize:16}}>Appointments & Support Meetings</div>
            <button className="btn btn-primary btn-sm" onClick={()=>{
              const newAppt={id:Date.now()+"",type:"prof_oh",day:"Monday",date:"",time:"",location:"",questions:"",barriers:"",expanded:true};
              const newAppts=[...(data.appointments||[]),newAppt];
              setData(p=>({...p,appointments:newAppts}));
              save({appointments:newAppts});
            }}>+ Add Appointment</button>
          </div>
          {(data.appointments||[]).length===0&&<div className="empty-state"><div className="es-ico">📅</div><div>No appointments scheduled</div></div>}
          {(data.appointments||[]).map(a=>{
            const at=APPT_TYPES.find(t=>t.v===a.type)||APPT_TYPES[APPT_TYPES.length-1];
            return(
              <div key={a.id} className="card" style={{borderLeft:`3px solid ${at.c}`,padding:"14px 16px",marginBottom:10}}>
                <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:10}}>
                  <div style={{width:8,height:8,borderRadius:"50%",background:at.c,flexShrink:0}}/>
                  <select style={{...pi,width:"auto",flex:1,color:at.c,border:`1px solid ${at.c}44`,fontSize:11,padding:"5px 8px"}} value={a.type} onChange={e=>updAppt(a.id,"type",e.target.value)}>
                    {APPT_TYPES.map(t=><option key={t.v} value={t.v}>{t.l}</option>)}
                  </select>
                  <button className="btn btn-ghost btn-xs" onClick={()=>updAppt(a.id,"expanded",!a.expanded)}>{a.expanded?"▲":"▼"}</button>
                  <button className="btn btn-xs" style={{background:"var(--red)18",border:"1px solid var(--red)33",color:"var(--red)"}} onClick={()=>delAppt(a.id)}>✕</button>
                </div>
                {a.expanded&&(
                  <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:10}}>
                    <div className="fg"><div className="lbl">Day</div><select style={pi} value={a.day} onChange={e=>updAppt(a.id,"day",e.target.value)} className="sel">{DAYS.map(d=><option key={d}>{d}</option>)}</select></div>
                    <div className="fg"><div className="lbl">Date</div><input type="date" style={pi} value={a.date} onChange={e=>updAppt(a.id,"date",e.target.value)}/></div>
                    <div className="fg"><div className="lbl">Time</div><input type="time" style={pi} value={a.time} onChange={e=>updAppt(a.id,"time",e.target.value)}/></div>
                    <div className="fg"><div className="lbl">Location</div><input style={pi} value={a.location} onChange={e=>updAppt(a.id,"location",e.target.value)} placeholder="Building, room, Zoom..." spellCheck={true} data-gramm={true}/></div>
                    <div className="fg"><div className="lbl">❓ Questions to Ask</div><textarea spellCheck={true} data-gramm={true} style={{...pi,resize:"vertical",minHeight:60,lineHeight:1.6}} value={a.questions} onChange={e=>updAppt(a.id,"questions",e.target.value)} placeholder="What do you want to discuss?"/></div>
                    <div className="fg"><div className="lbl">🚧 Barriers / Concerns</div><textarea spellCheck={true} data-gramm={true} style={{...pi,resize:"vertical",minHeight:60,lineHeight:1.6}} value={a.barriers} onChange={e=>updAppt(a.id,"barriers",e.target.value)} placeholder="What might get in the way?"/></div>
                  </div>
                )}
              </div>
            );
          })}
          <button className="btn btn-primary btn-sm" onClick={()=>save({appointments:data.appointments})}>💾 Save Appointments</button>
        </div>}
        {tab==="notes"&&<div className="fade">
          <div className="card">
            <div className="card-title">📝 My Notes & Reflections</div>
            <textarea className="inp ta" spellCheck={true} data-gramm={true} value={data.notes||""} onChange={e=>setData(p=>({...p,notes:e.target.value}))} style={{minHeight:300,lineHeight:1.75}} placeholder="What's on your mind? Goals, questions for your coach, ideas, reflections..."/>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginTop:8}}>
              <span style={{fontSize:11,color:"var(--muted)"}}>{(data.notes||"").length} characters</span>
              <button className="btn btn-primary btn-sm" onClick={()=>save({notes:data.notes})}>💾 Save Notes</button>
            </div>
          </div>
        </div>}
        {tab==="mail"&&<div className="fade">
          <div className="card" style={{marginBottom:14,borderColor:O+"44",background:O+"08"}}>
            <div className="card-title">📬 Coach Mail from {COACH_NAME}</div>
            <button className="btn btn-ghost btn-sm" style={{fontSize:10,marginBottom:8}} onClick={()=>{const unread=(messages||[]).filter(m=>!(m.readBy||[]).includes(user?.uid));if(!unread.length){return;}Promise.all(unread.map(m=>db.collection("messages").doc(m.id).update({readBy:firebase.firestore.FieldValue.arrayUnion(user?.uid)}))).then(()=>showToast(`✅ Marked ${unread.length} messages as read`)).catch(()=>{});}}>✓ Mark all read</button>
            
            <div style={{fontSize:11,color:"var(--muted)"}}>Messages from your OnTrack coach. Reach back: 📱 {COACH_PHONE} · ✉️ {COACH_EMAIL}</div>
          </div>
          {messages.length===0&&<div className="empty-state"><div className="es-ico">📬</div><div>No messages yet from your coach</div></div>}
          {messages.map(m=>{
            const isUnread=!(m.readBy||[]).includes(user.uid);
            const isFollowUp=m.type==="followUp";
            const msgActivities=Array.isArray(m.activities)?m.activities:[];
            const hasActivities=isFollowUp&&msgActivities.length>0;
            const doneCount=msgActivities.filter(a=>a.completed).length;

            const markActivity=async(actIdx,done)=>{
              try{
                const updated=msgActivities.map((a,i)=>i===actIdx?{...a,completed:done,completedAt:done?new Date().toISOString():null}:a);
                await db.collection("messages").doc(m.id).update({activities:updated});
                if(done)showToast("✅ Activity marked complete!");
              }catch(e){showToast("Update failed: "+e.message);}
            };

            // For non-structured follow-ups (legacy text), show plain body
            const bodyForDisplay=isFollowUp&&hasActivities
              ?(m.body||"").split("━━━")[0].trim()
              :(m.body||"");

            return(
              <div key={m.id} className={`msg-card${isUnread?" unread":""}`}
                style={isFollowUp?{borderColor:O+"55",borderLeft:`3px solid ${O}`,padding:"14px 16px"}:{}}
                onClick={()=>isUnread&&markRead(m.id)}>

                {/* ── Follow-up header ── */}
                {isFollowUp&&(
                  <div style={{display:"flex",alignItems:"center",gap:6,flexWrap:"wrap",marginBottom:10}}>
                    <span style={{background:O,color:"#fff",fontSize:9,fontWeight:700,letterSpacing:.8,padding:"2px 8px",borderRadius:4}}>SESSION FOLLOW-UP</span>
                    {m.sessionDate&&<span style={{fontSize:10,color:"var(--muted)"}}>{fmtDate(m.sessionDate)}</span>}

                      {doneCount}/{msgActivities.length} activities done
                    </span>}
                    {isUnread&&<span style={{background:O+"22",color:O,fontSize:9,fontWeight:700,padding:"2px 7px",borderRadius:4,marginLeft:"auto"}}>NEW</span>}
                  </div>
                )}

                {/* ── Subject + timestamp ── */}
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:6}}>
                  <div style={{fontWeight:700,fontSize:13,color:isUnread?O:"var(--txt)"}}>{!isFollowUp&&isUnread&&<span style={{color:O,marginRight:6}}>●</span>}{m.subject}</div>
                  <div style={{fontSize:10,color:"var(--muted)",flexShrink:0,marginLeft:8}}>{ts2str(m.timestamp)}</div>
                </div>
                <div style={{fontSize:11,color:"var(--muted)",marginBottom:10}}>From: {m.fromName||"Coach Bisson"}</div>

                {/* ── Email body ── */}
                <div style={{fontSize:12,lineHeight:1.8,color:"var(--txt)",whiteSpace:"pre-wrap",marginBottom:hasActivities?14:0}}>{bodyForDisplay}</div>

                {/* ── Structured activity cards ── */}
                {hasActivities&&(
                  <div>
                    <div style={{fontSize:10,fontWeight:800,color:O,letterSpacing:.8,textTransform:"uppercase",marginBottom:10,paddingTop:10,borderTop:`1px solid ${O}33`}}>
                      🧠 This Week's Practice Activity

                    {msgActivities.map((a,idx)=>(
                      <div key={idx} style={{
                        background:a.completed?"var(--green)08":"var(--s2)",
                        border:`1px solid ${a.completed?"var(--green)44":O+"33"}`,
                        borderRadius:10,padding:"12px 14px",marginBottom:10,
                        transition:"all .2s"
                      }}>
                        {/* Activity header */}
                        <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:6}}>
                          <div>
                            <div style={{fontWeight:700,fontSize:13,color:a.completed?"var(--green)":O}}>{idx+1}. {a.title||"Practice Activity"}</div>
                            <div style={{fontSize:10,color:"var(--muted)",marginTop:2,display:"flex",gap:10,flexWrap:"wrap"}}>
                              <span>⏱ {a.duration||"10 min"}</span>
                              <span>📅 {a.when||"This week"}</span>
                            </div>
                          </div>
                          <button onClick={e=>{e.stopPropagation();markActivity(idx,!a.completed);}}
                            style={{background:a.completed?"var(--green)18":"transparent",border:`1px solid ${a.completed?"var(--green)44":"var(--bdr)"}`,
                              color:a.completed?"var(--green)":"var(--muted)",borderRadius:6,padding:"4px 10px",fontSize:11,fontWeight:700,cursor:"pointer",flexShrink:0,whiteSpace:"nowrap"}}>
                            {a.completed?"✅ Done":"○ Mark done"}
                          </button>
                        </div>
                        {/* Why this week */}
                        {a.connection&&<div style={{fontSize:11,color:O,fontStyle:"italic",marginBottom:8,lineHeight:1.6}}>
                          Why this week: {a.connection}
                        </div>}
                        {/* Instructions */}
                        {a.what&&<div style={{fontSize:12,color:"var(--txt)",lineHeight:1.75,marginBottom:8}}>{a.what}</div>}
                        {/* Barrier + workaround */}
                        {a.workaround&&<div style={{background:"var(--s3)",border:"1px solid var(--bdr)",borderLeft:`3px solid var(--yellow)`,borderRadius:6,padding:"8px 10px",marginBottom:8}}>
                          <span style={{fontSize:10,fontWeight:700,color:"var(--yellow)"}}>🚧 If blocked: </span>
                          <span style={{fontSize:11,color:"var(--muted)"}}>{a.workaround}</span>
                        </div>}
                        {/* Evidence */}
                        {a.evidence&&<div style={{fontSize:9,color:"var(--dim)",marginTop:4}}>📚 {a.evidence}</div>}
                        {/* Completion timestamp */}

                        </div>}
                      </div>
                    ))}
                  </div>
                )}
                {isUnread&&<div style={{fontSize:10,color:"var(--dim)",marginTop:6}}>Tap to mark as read</div>}
              </div>
            );
          })}
        </div>}
        {tab==="mos"&&<div className="fade">
          <MosPanel uid={user.uid} readOnly={false} isCoach={false}/>
        </div>}
        {tab==="arc"&&<div className="fade">
          <div className="card" style={{marginBottom:12,background:"linear-gradient(135deg,#001a3a,var(--s1))",border:`1px solid ${O}33`}}>

          </div>
          {data?.arc?.phase
            ?<div>
              <div style={{fontSize:11,fontWeight:700,color:O,marginBottom:10}}>Your Current Phase</div>
              <div style={{display:"flex",gap:4,marginBottom:12}}>
                {COACHING_ARC_PHASES.map((p,i)=>{
                  const phases=COACHING_ARC_PHASES.map(x=>x.id);
                  const cur=phases.indexOf(data.arc.phase);
                  const isPast=i<cur,isCur=i===cur;
                  return(
                    <div key={p.id} style={{flex:1,textAlign:"center",padding:"8px 4px",borderRadius:6,
                      background:isCur?O:isPast?"var(--green)18":"var(--s2)",
                      border:`1px solid ${isCur?O:isPast?"var(--green)44":"var(--bdr)"}`,
                      color:isCur?"#fff":isPast?"var(--green)":"var(--muted)",fontSize:9,fontWeight:700}}>
                      <div style={{fontSize:14,marginBottom:2}}>{p.icon}</div>

              {data.arc.milestones&&Object.values(data.arc.milestones).some(Boolean)&&(
                <div className="card">
                  <div style={{fontSize:11,fontWeight:700,color:O,marginBottom:8}}>🏆 Milestones Reached</div>
                  {[{id:"firstGoal",l:"First Goal Achieved"},{id:"selfAdvocacy",l:"Self-advocated independently"},{id:"strategyUsed",l:"Used a strategy on your own"},{id:"independentWeek",l:"Completed a task without prompting"}].map(m=>
                    data.arc.milestones[m.id]?<div key={m.id} style={{display:"flex",gap:8,alignItems:"center",padding:"4px 0",borderBottom:"1px solid var(--bdr)"}}>
                      <span style={{color:"var(--green)"}}>✓</span>
                      <span style={{fontSize:11,color:"var(--green)"}}>{m.l}</span>
                      <span style={{fontSize:9,color:"var(--muted)",marginLeft:"auto"}}>{fmtDate(data.arc.milestones[m.id])}</span>
                    </div>:null
                  )}
                </div>
              )}
            </div>
            :<div style={{color:"var(--muted)",fontSize:12,padding:"20px 0"}}>Your coach hasn't set up your arc yet — check back after your first session!</div>
          }
        </div>}
        {tab==="share"&&<div className="fade">
          <div className="card">
            <div className="card-title">🔗 Share Your Planner — View Only</div>
            <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:10}}>
              <span style={{background:"var(--blue)22",border:"1px solid var(--blue)44",color:"var(--blue)",borderRadius:6,padding:"3px 10px",fontSize:10,fontWeight:700,letterSpacing:.5}}>👁 VIEW ONLY · NO EDIT PERMISSIONS</span>
              <span style={{background:"var(--bdr)",borderRadius:6,padding:"3px 10px",fontSize:10,color:"var(--muted)"}}>Max 4 people</span>
            </div>
            <div className="card-sub">Add up to 4 trusted people (parent, guardian, advisor, or tutor) who can view your OnTrack planner. They receive <strong>read-only access</strong> — they can see your goals, appointments, courses, grades, and calendar, but <strong>cannot make any changes</strong>.</div>
            {(data.sharedWith||[]).map((email,i)=>(
              <div key={`share_${i}`} className="share-email-row">
                <input className="inp" style={{flex:1}} type="email" value={email} onChange={e=>{const a=[...(data.sharedWith||[])];a[i]=e.target.value.toLowerCase();setData(p=>({...p,sharedWith:a}));}} placeholder="email@example.com"/>
                <button className="btn btn-ghost btn-xs" onClick={()=>{const a=(data.sharedWith||[]).filter((_,j)=>j!==i);setData(p=>({...p,sharedWith:a}));}}>✕</button>
              </div>
            ))}
            {(data.sharedWith||[]).length<4&&(
              <button className="btn btn-ghost btn-sm" style={{marginTop:10}} onClick={()=>setData(p=>({...p,sharedWith:[...(p.sharedWith||[]),""]}))}>
                + Add Person ({4-(data.sharedWith||[]).length} remaining)
              </button>
            )}
            <div style={{marginTop:14,display:"flex",gap:8}}>
              <button className="btn btn-primary btn-sm" onClick={async()=>{
                const cappedWith=(data.sharedWith||[]).slice(0,4);
                await save({sharedWith:cappedWith});
              const validEmails=cappedWith.filter(e=>e.includes("@")&&e.includes(".")&&e.indexOf("@")>0&&e.indexOf("@")<e.length-2).map(e=>e.toLowerCase().trim());
                // sync sharedEmails into mos document so rule can check without get()
                if(db&&user?.uid){
                  try{await db.collection("mos").doc(user.uid).set({sharedEmails:validEmails,sharedWith:cappedWith},{merge:true});}catch{}
                }
                if(validEmails.length){
                  const body=encodeURIComponent(`Hi,\n\n${data.profile.name||"Your student"} has shared their OnTrack at SU coaching planner with you.\n\nCoach: ${COACH_NAME} · ${COACH_EMAIL}\n\nThis is a read-only view of their progress and goals.\n\nIf you have questions, please contact the coach directly at ${COACH_PHONE}.\n\nOnTrack at SU | Center for Disability Resources | Syracuse University`);
                  window.open(`mailto:${validEmails.join(",")}?subject=OnTrack Planner Access - ${data.profile.name||"Student"}&body=${body}`);
                }
                showToast("✅ Saved & email opened!");
              }}>💾 Save & Notify</button>
            </div>
            <div style={{marginTop:12,fontSize:11,color:"var(--muted)",lineHeight:1.7}}>
              🔒 Read-only access only. Shared contacts can view your goals, appointments, courses, grades, and calendar — they cannot edit any data, access your session notes, or read coach messages. Remove access at any time by deleting their email and saving.
            </div>
          </div>
        </div>}
      </div>
      <CopyrightFooter/>
    </div>
  );
}

/* ═══════════════════════════════════════════════════════════
   MAIN APP — AUTH ROUTER

/* ── Error Boundary — catches any render crash and shows a recoverable screen ── */
class ErrorBoundary extends React.Component{
  constructor(props){super(props);this.state={hasError:false,error:null};}
  static getDerivedStateFromError(error){return{hasError:true,error};}
  componentDidCatch(error,info){console.error("Portal render error:",error,info.componentStack);}
  render(){
    if(this.state.hasError){
      return(
        <div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",background:"var(--bg)",padding:24}}>
          <div style={{maxWidth:460,background:"var(--s1)",border:"1px solid var(--bdr)",borderRadius:14,padding:32,textAlign:"center"}}>
            <div style={{fontSize:36,marginBottom:12}}>⚠️</div>
            <div style={{fontFamily:"'DM Serif Display',serif",fontSize:22,marginBottom:8}}>Something went wrong</div>
            <div style={{fontSize:13,color:"var(--muted)",marginBottom:6}}>The portal hit an unexpected error. This is usually caused by data loading incorrectly. Try reloading — if it persists, sign out and back in.</div>
            <div style={{fontSize:11,color:"var(--dim)",marginBottom:20,fontFamily:"monospace",background:"var(--s2)",padding:"8px 12px",borderRadius:7,textAlign:"left",wordBreak:"break-all"}}>
              {this.state.error?.message||"Unknown error"}
            </div>
            <div style={{display:"flex",gap:10,justifyContent:"center",flexWrap:"wrap"}}>
              <button className="btn btn-primary" onClick={()=>window.location.reload()}>🔄 Reload Page</button>
              <button className="btn btn-ghost" onClick={()=>{try{firebase.auth().signOut().then(()=>window.location.reload());}catch{window.location.reload();}}}>Sign Out &amp; Retry</button>
            </div>
          </div>
        </div>
      );
    }
    return this.props.children;
  }
}

function App(){
  const [authState,setAuthState]=useState("loading");
  const [user,setUser]=useState(null);
  const [rosterEntry,setRosterEntry]=useState(null);
  const [sharedUid,setSharedUid]=useState(null); // uid of student whose planner shared contact can view
  const [toast,setToast]=useState(null);

  const showToast=useCallback((msg)=>{setToast(msg);setTimeout(()=>setToast(null),3500);},[]);

  useEffect(()=>{
    if(!IS_CONFIGURED){setAuthState("unconfigured");return;}
    const _authUnsub=auth.onAuthStateChanged(async u=>{
      try{
      if(!u){setUser(null);setRosterEntry(null);setAuthState("unauth");}
      else{
        setUser(u);
        if(u.email?.toLowerCase()===COACH_EMAIL.toLowerCase()){setAuthState("coach");}
        else{
          // ── Step 1: check if this email is on the coaching roster ──
          let onRoster=false;
          try{
            const q=await db.collection("roster").where("email","==",u.email.toLowerCase()).limit(1).get();
            if(!q.empty){
              const d=q.docs[0];
              const oldUid=d.data().uid;
              setRosterEntry({id:d.id,...d.data()});
              onRoster=true;
              // Keep roster's uid in sync — re-links automatically if the student's
              // Firebase Auth account was ever deleted/recreated (prevents students
              // being stuck as "orphaned" from an old dead account)
              if(oldUid!==u.uid){
                // IMPORTANT: a non-empty oldUid means this is an ACCOUNT RECREATION,
                // not a first-ever registration (where oldUid would be ""). The
                // student's real historical data (students/{oldUid}, mos/{oldUid})
                // stays keyed to the dead uid — provisionMOS below will create a
                // brand-new, EMPTY record under the new uid. Firestore rules
                // correctly prevent the student's own new session from reading
                // the old uid's data (request.auth.uid must match), so this can
                // only be recovered by the coach, from their own account, using
                // the Recover Data tool in Manage Students.
                const updatePayload={uid:u.uid};
                if(oldUid){
                  console.warn(`⚠️ ACCOUNT RECREATION DETECTED for ${u.email}: old uid ${oldUid} → new uid ${u.uid}. Archived to previousUids for recovery.`);
                  showToast("⚠️ Welcome back! If this isn't your first time here, your coach may need to help recover some older data — please let them know.");
                  // Archive the old uid so it isn't lost the moment we overwrite it below —
                  // without this, there would be no way to ever find the orphaned data again.
                  updatePayload.previousUids=firebase.firestore.FieldValue.arrayUnion(oldUid);
                }
                try{
                  await db.collection("roster").doc(d.id).update(updatePayload);
                }catch(rErr){console.error("Roster uid update failed — check Firestore rules:",rErr);}
              }
            }
          }catch(e){console.error("Roster lookup error:",e);}

          if(onRoster){
            // Roster student — full student portal.
            // Await provisioning BEFORE switching to the student view: otherwise
            // a fast-clicking new student could interact with MyOrangeSuccess
            // before the mos/{uid} doc exists, and provisionMOS's own default
            // write could then land AFTER (and silently overwrite) their first
            // real edit. Awaiting closes that race entirely.
            await provisionMOS(u.uid); // Only provision MOS for actual students
            setAuthState("student");
          }else{
            // ── Step 2: not a student — check if they have shared access ──
            let foundShared=false;
            let lookupFailed=false;
            try{
              const sq=await db.collection("mos")
                .where("sharedEmails","array-contains",u.email.toLowerCase())
                .limit(1).get();
              if(!sq.empty){
                setSharedUid(sq.docs[0].id);
                setAuthState("shared");
                foundShared=true;
              }
            }catch(sharedErr){
              console.warn("Shared access check failed:",sharedErr.message);
              lookupFailed=true;
            }
            if(!foundShared){
              setRosterEntry(null);
              // If both lookups failed (network issue) vs genuinely not registered
              setAuthState(lookupFailed?"noaccess":"noaccess");
              // Note: both paths show noaccess for now; toast gives context
              if(lookupFailed)console.warn("Auth lookup failed — user may be offline or Firestore unavailable");
            }
          }
        }
      }
      }catch(outerErr){console.error("Auth callback error:",outerErr);setAuthState("noaccess");}
    });
    return()=>_authUnsub();
  },[]);

  if(authState==="loading")return(
    <div style={{minHeight:"100vh",background:"var(--bg)",display:"flex",alignItems:"center",justifyContent:"center"}}>
      <div style={{textAlign:"center"}}>
        <div style={{fontSize:32,marginBottom:12,animation:"spin 1s linear infinite",display:"inline-block"}}>🍊</div>
        <div style={{fontFamily:"'DM Serif Display',serif",fontSize:18,color:"var(--txt)"}}>OnTrack at SU</div>
        <div style={{fontSize:12,color:"var(--muted)",marginTop:4}}>Loading coaching platform...</div>
      </div>
    </div>
  );

  return(
    <>
      {toast&&<div className="toast">{toast}</div>}
      {authState==="unconfigured"&&<SetupScreen/>}
      {authState==="unauth"&&<LoginScreen/>}
      {authState==="coach"&&<CoachDashboard user={user} showToast={showToast}/>}
      {authState==="student"&&<StudentPortal user={user} rosterEntry={rosterEntry} showToast={showToast}/>}
      {authState==="shared"&&sharedUid&&<SharedViewer sharedUid={sharedUid} showToast={showToast}/>}
      {authState==="noaccess"&&(
        <div style={{minHeight:"100vh",background:"var(--bg)",display:"flex",alignItems:"center",justifyContent:"center",padding:24}}>
          <div style={{maxWidth:440,background:"var(--s1)",border:"1px solid var(--bdr)",borderRadius:14,padding:32,textAlign:"center"}}>
            <div style={{fontSize:40,marginBottom:12}}>🔒</div>
            <div style={{fontFamily:"'DM Serif Display',serif",fontSize:20,marginBottom:8}}>No Access</div>
            <div style={{fontSize:13,color:"var(--muted)",marginBottom:20,lineHeight:1.7}}>
              This email address is not registered as a student or shared contact on this platform.
              If you were invited to view a student's planner, contact the coach to confirm access was set up.
            </div>
            <div style={{fontSize:11,color:"var(--muted)",marginBottom:20}}>Coach: {COACH_NAME} · {COACH_EMAIL}</div>
            <button className="btn btn-ghost" onClick={()=>auth.signOut()}>← Sign Out</button>
          </div>
        </div>
      )}
    </>
  );
}

ReactDOM.createRoot(document.getElementById("ot-root")).render(<ErrorBoundary><App/></ErrorBoundary>);
</script>
